version: 1
definitions:
  # Text between "${{" and the context that is being tested for. Bounded, and
  # it cannot run past the end of the expression.
  EXPR_OPEN: \$\{\{(?:(?!\}\})[^\n]){0,300}?
  # Event fields whose text an outside contributor chooses (GitHub's list of
  # untrusted input, plus discussions).
  UNTRUSTED_FIELD: (?:tojson\(\s*github\.event\.(?:pull_request|issue|comment|review|review_comment|discussion|head_commit|commits|pages|workflow_run)\s*\)|github\.head_ref\b|github\.event\.(?:issue\.(?:title|body)|pull_request\.(?:title|body|head\.(?:ref|label)|head\.repo\.default_branch)|comment\.body|review\.body|review_comment\.body|discussion\.(?:title|body)|head_commit\.(?:message|(?:author|committer)\.(?:name|email))|commits(?:\.\*|\[[^\]\n]{0,20}\])?\.(?:message|(?:author|committer)\.(?:name|email))|pages(?:\.\*|\[[^\]\n]{0,20}\])?\.page_name|workflow_run\.(?:head_branch|head_commit\.(?:message|(?:author|committer)\.(?:name|email))|display_title|pull_requests(?:\.\*|\[[^\]\n]{0,20}\])?\.head\.ref))\b)
  WORKFLOW: '(?:^|/)\.github/workflows/[^/]+\.ya?ml$'
  # Triggers whose workflow runs with a write token and secrets although the
  # change comes from an outside contributor.
  # Expressions that name the contributor's commit, branch or fork.
  HEAD_CODE: '(?:[^}\n]{0,200}?(?:github\.event\.pull_request\.(?:head\.(?:sha|ref|repo\.full_name)|merge_commit_sha)|github\.head_ref|github\.event\.workflow_run\.(?:head_sha|head_branch|head_repository\.full_name))\b(?!\s*[=!]=))'
  # The trigger declaration (`on: x`, `on: [a, x]`, `on: {x: ...}`, an `x:`
  # key or `- x` item), not the word in a comment, URL or `if:` condition.
  ON_OPEN: '^(?:["\x27]?on["\x27]?\s*:[^#\n]{0,200}?|\s+(?:-\s*)?)["\x27]?'
  ON_CLOSE: '["\x27]?\s*(?::|,|\]|\}|#|$)'
  PRIVILEGED_TRIGGER: '{{ON_OPEN}}(?:pull_request_target|workflow_run|issue_comment){{ON_CLOSE}}'
  PIPE_TO_SHELL: '\b(?:curl|wget)\b[^|\n]{0,600}\|\s*(?:sudo\s+(?:-\S+\s+){0,3})?(?:(?:ba|z|da|k|a)?sh|python[23]?(?!\s+-c\b))\b(?![.\w-])|\b(?:ba|z)?sh\s+(?:-c\s+)?["\x27]?(?:<\(|\$\()\s*(?:curl|wget)\b'
rules:
  - id: gha-pull-request-target
    title: GitHub Actions uses pull_request_target with checkout
    title_zh: GitHub Actions 使用 pull_request_target 并检出代码
    # Checking out the base branch is the documented safe use; checking out
    # the contributor's code is gha-untrusted-checkout (critical).
    severity: medium
    confidence: low
    kind: hotspot
    cwe: CWE-829
    owasp: A08:2021
    languages:
      - yaml
    # The trigger itself (`on: pull_request_target`, `on: [push,
    # pull_request_target]`, a `pull_request_target:` key or list item), not
    # a mention in an `if:` condition or a comment.
    pattern: '{{ON_OPEN}}pull_request_target{{ON_CLOSE}}'
    pathInclude: '{{WORKFLOW}}'
    filePattern: uses:\s*actions/checkout
    message: pull_request_target runs in the base repository context with its secrets; check that the checkout is the base branch and that no PR code is executed.
    message_zh: pull_request_target 在基仓库上下文运行，结合 checkout 不可信 PR 代码可导致密钥泄露。
    remediation: Use pull_request instead; if pull_request_target is required, check out only the base branch and never execute PR code.
    remediation_zh: 改用 pull_request；如必须使用 pull_request_target，只检出基分支并避免执行 PR 代码。
    references:
      - CWE-829
      - OWASP A08:2021
  # Script injection. "${{ ... }}" is expanded by the runner before the shell
  # (or the JavaScript of actions/github-script) sees the text, so a value an
  # attacker chooses becomes code. That is only true inside the body of a
  # `run:` step or a `script:` input; the same expression in `with:`, `env:`,
  # `if:` or `concurrency:` is passed as data and is not matched here
  # (withinKeys). `script:` is treated as code for every action: all the
  # actions that take such an input (github-script, ssh-action, ...) run it.
  #
  # How withinKeys is evaluated (packages/core/src/yamlValues.ts): the workflow
  # is parsed and the patterns below are matched against the VALUE of every
  # `run` / `script` key, wherever and however it is written (alias, flow
  # mapping, quoted / escaped / tagged / anchored key, continued scalar).
  # Before matching, each expression is put in a canonical form: one line,
  # lower case, `github['event']['issue']` written as `github.event.issue`.
  # An expression that reads `env.X` or `matrix.X` is followed by the
  # expressions of the definitions of X in the enclosing step, job and
  # workflow, so `env: { T: ${{ github.event.issue.title }} }` + `run: echo
  # ${{ env.T }}` is reported on the `run` line. A shell variable (`$T`,
  # `"${T}"`) is NOT reported: the shell receives it as data, which is the
  # fix these rules recommend. A file that cannot be parsed (or exceeds the
  # parser bounds) is matched line by line in full, with a warning.
  #
  # Severity policy, one rule each; the three share a group, so one line
  # produces one result, the strongest:
  #   - fields an outside contributor controls            -> high / high
  #   - workflow_dispatch / workflow_call inputs           -> medium / medium
  #     (triggering needs write access or a calling workflow)
  #   - any other github.event field                       -> hotspot
  #   - numeric ids and commit hashes (.number, .id, .sha) -> not reported
  - id: gha-script-injection
    title: GitHub Actions script injection
    title_zh: GitHub Actions 脚本注入
    severity: high
    confidence: high
    cwe: CWE-94
    owasp: A03:2021
    group: gha-expression-injection
    languages:
      - yaml
    pattern: "{{EXPR_OPEN}}{{UNTRUSTED_FIELD}}"
    withinKeys:
      - run
      - script
    pathInclude: (?:^|/)\.github/workflows/[^/]+\.ya?ml$
    message: An event field that an outside contributor controls (title, body, branch name, commit message) is expanded into a run script before the shell parses it, allowing command injection.
    message_zh: 外部贡献者可控的事件字段（标题、正文、分支名、提交信息）在 shell 解析前被展开进 run 脚本，可导致命令注入。
    remediation: Pass the value through env (env FOO set to the expression) and use "$FOO" in the script, so the shell receives it as data.
    remediation_zh: 通过 env 传递该值并在脚本中使用 "$FOO"，使 shell 将其作为数据处理。
    references:
      - CWE-94
      - OWASP A03:2021
      - https://docs.github.com/en/actions/security-for-github-actions/security-guides/security-hardening-for-github-actions#understanding-the-risk-of-script-injections
  - id: gha-script-injection-input
    title: GitHub Actions workflow input expanded into a script
    title_zh: GitHub Actions 工作流输入被展开进脚本
    severity: medium
    confidence: medium
    cwe: CWE-94
    owasp: A03:2021
    group: gha-expression-injection
    languages:
      - yaml
    pattern: "{{EXPR_OPEN}}(?<![\\w.])(?:github\\.event\\.)?inputs\\.[\\w-]+"
    withinKeys:
      - run
      - script
    filePattern: \bworkflow_dispatch\b|\bworkflow_call\b
    pathInclude: (?:^|/)\.github/workflows/[^/]+\.ya?ml$
    message: A workflow_dispatch / workflow_call input is expanded into a run script before the shell parses it. Whoever can start the workflow (write access, or a workflow that calls this one with data it does not control) can inject commands.
    message_zh: workflow_dispatch / workflow_call 的输入在 shell 解析前被展开进 run 脚本；能够触发该工作流的人（写权限，或以不可信数据调用它的工作流）可以注入命令。
    remediation: Pass the input through env and use the environment variable in the script.
    remediation_zh: 通过 env 传递该输入，并在脚本中使用环境变量。
    references:
      - CWE-94
      - OWASP A03:2021
  - id: gha-event-field-in-script
    title: GitHub Actions event field expanded into a script
    title_zh: GitHub Actions 事件字段被展开进脚本
    severity: medium
    confidence: low
    kind: hotspot
    cwe: CWE-94
    owasp: A03:2021
    group: gha-expression-injection
    languages:
      - yaml
    pattern: "{{EXPR_OPEN}}(?<![\\w.])github\\s*(?:\\.\\s*event\\b|\\[\\s*['\"]event['\"]\\s*\\])(?!(?:\\.[a-z_]+)*\\.(?:number|id|sha)\\b(?![\\w.\\[]))"
    withinKeys:
      - run
      - script
    pathInclude: (?:^|/)\.github/workflows/[^/]+\.ya?ml$
    message: A github.event field is expanded into a run script. Check whether someone outside the project can choose its text; numeric ids and commit hashes are not reported.
    message_zh: github.event 字段被展开进 run 脚本。请确认项目外部人员是否能控制其内容；数字 id 和提交哈希不会被报告。
    remediation: Pass the value through env and use the environment variable in the script.
    remediation_zh: 通过 env 传递该值，并在脚本中使用环境变量。
    references:
      - CWE-94
      - OWASP A03:2021
  # Writing an attacker-chosen value into $GITHUB_ENV / $GITHUB_PATH /
  # $GITHUB_OUTPUT: besides the script injection itself, a newline in the
  # value defines further variables (LD_PRELOAD, NODE_OPTIONS, BASH_ENV) for
  # every later step. Same group as the script-injection rules; this one wins.
  - id: gha-github-env-injection
    title: GitHub Actions writes an untrusted event field to GITHUB_ENV
    title_zh: GitHub Actions 将不可信事件字段写入 GITHUB_ENV
    severity: critical
    confidence: high
    cwe: CWE-94
    owasp: A03:2021
    group: gha-expression-injection
    languages: [yaml]
    pattern: '{{EXPR_OPEN}}{{UNTRUSTED_FIELD}}[^\n]{0,300}?>>\s*["\x27]?\$\{?GITHUB_(?:ENV|PATH|OUTPUT)\b'
    withinKeys: [run]
    pathInclude: '{{WORKFLOW}}'
    message: A value that an outside contributor chooses is written to GITHUB_ENV, GITHUB_PATH or GITHUB_OUTPUT; a newline in it sets environment variables or outputs for every later step, which leads to code execution with the job's secrets.
    message_zh: 外部贡献者可控的值被写入 GITHUB_ENV、GITHUB_PATH 或 GITHUB_OUTPUT；值中的换行可为后续每个步骤设置环境变量或输出，进而以作业的密钥执行代码。
    remediation: Do not write untrusted text to these files; if needed, validate it against a strict pattern and use a random heredoc delimiter.
    remediation_zh: 不要把不可信文本写入这些文件；确有需要时先用严格模式校验，并使用随机的 heredoc 分隔符。
  - id: gha-github-env-untrusted-var
    title: GitHub Actions writes a shell variable to GITHUB_ENV in a workflow that reads untrusted fields
    title_zh: 读取不可信字段的 GitHub Actions 工作流把 shell 变量写入 GITHUB_ENV
    severity: medium
    confidence: low
    kind: hotspot
    cwe: CWE-94
    owasp: A03:2021
    languages: [yaml]
    pattern: '\$\{?[A-Za-z_]\w{0,60}\}?[^\n]{0,200}?>>\s*["\x27]?\$\{?GITHUB_(?:ENV|PATH)\b'
    withinKeys: [run]
    # Gate: the workflow puts an untrusted field into an env entry.
    filePattern: '^\s*["\x27]?[A-Za-z_][\w-]{0,60}["\x27]?\s*:\s*["\x27]?\$\{\{\s*{{UNTRUSTED_FIELD}}'
    pathInclude: '{{WORKFLOW}}'
    message: A shell variable is appended to GITHUB_ENV or GITHUB_PATH, and the workflow reads fields an outside contributor controls. If the variable carries one of them, a newline in it defines new variables for later steps.
    message_zh: shell 变量被追加到 GITHUB_ENV 或 GITHUB_PATH，且该工作流读取了外部贡献者可控的字段。若变量来自这些字段，其中的换行可为后续步骤定义新变量。
    remediation: Do not pass untrusted text to GITHUB_ENV; validate it first or keep it in a step-local env variable.
    remediation_zh: 不要把不可信文本传给 GITHUB_ENV；先校验，或仅作为步骤内的 env 变量使用。
  - id: gha-untrusted-checkout
    title: Privileged GitHub Actions workflow checks out pull request code
    title_zh: 特权 GitHub Actions 工作流检出了 PR 代码
    severity: critical
    confidence: medium
    cwe: CWE-829
    owasp: A08:2021
    languages: [yaml]
    # `ref:` / `repository:` of a checkout step (or any action) pointing at
    # the contributor's head commit, branch or fork, in a workflow started by
    # pull_request_target, workflow_run or issue_comment, which run with the
    # base repository's secrets and a write token.
    # In run: also `gh pr checkout` and `git fetch ... pull/N/head`.
    withinKeys: [ref, repository, run]
    # The expression forms are anchored at the start of the value (a ref:
    # or repository: input); inside a run script only git and gh commands
    # count, so an echo of the branch name is not taken for a checkout.
    pattern: '^\s*(?:refs/pull/\$\{\{|\$\{\{\s*(?:{{HEAD_CODE}}|format\(\s*\x27refs/pull/))|\bgit\s+(?:checkout|switch|fetch)\b[^\n]{0,200}?\$\{\{\s*{{HEAD_CODE}}|\bgh\s+pr\s+checkout\b|\bgit\s+fetch\b[^\n]{0,200}?\bpull/(?:\$\{\{[^}\n]{0,100}\}\}|[^\s/]{1,80})/(?:head|merge)\b'
    filePattern: '{{PRIVILEGED_TRIGGER}}'
    pathInclude: '{{WORKFLOW}}'
    message: The workflow runs with the base repository's secrets and a write token but checks out the contributor's code; any build script, test or package hook in that code then runs with those privileges ("pwn request").
    message_zh: 该工作流以基仓库的密钥和写权限令牌运行，却检出了贡献者的代码；其中任何构建脚本、测试或包钩子都会以这些权限执行（"pwn request"）。
    remediation: Build and test PR code in a pull_request workflow without secrets; pass results to the privileged workflow as artifacts and treat them as data.
    remediation_zh: 在没有密钥的 pull_request 工作流中构建和测试 PR 代码；把结果作为 artifact 传给特权工作流并仅当作数据处理。
    references:
      - https://securitylab.github.com/resources/github-actions-preventing-pwn-requests/
  - id: gha-checkout-persist-credentials
    title: Checkout keeps the token on disk in a privileged workflow
    title_zh: 特权工作流中 checkout 将令牌保留在磁盘上
    severity: medium
    confidence: low
    kind: hotspot
    cwe: CWE-522
    owasp: A07:2021
    languages: [yaml]
    withinKeys: [uses]
    pattern: '^\s*actions/checkout@'
    filePattern: '{{PRIVILEGED_TRIGGER}}'
    fileAbsentPattern: 'persist-credentials\s*:\s*["\x27]?false\b'
    pathInclude: '{{WORKFLOW}}'
    message: actions/checkout writes the GITHUB_TOKEN into .git/config by default; in a workflow started by pull_request_target, workflow_run or issue_comment, any later step that runs contributor code can read it.
    message_zh: actions/checkout 默认把 GITHUB_TOKEN 写入 .git/config；在由 pull_request_target、workflow_run 或 issue_comment 触发的工作流中，后续运行贡献者代码的任何步骤都能读取它。
    remediation: Add with persist-credentials false to the checkout step.
    remediation_zh: 为 checkout 步骤添加 persist-credentials 并设为 false。
  - id: gha-unpinned-action
    title: GitHub Actions uses a third-party action without a commit SHA
    title_zh: GitHub Actions 使用未固定到提交 SHA 的第三方 action
    # Always true when it matches (a tag or branch can move), but it takes a
    # compromise of the upstream repository to matter: low severity.
    severity: low
    confidence: medium
    cwe: CWE-829
    owasp: A08:2021
    languages: [yaml]
    # actions/* and github/* are maintained by GitHub; local (./) and
    # docker:// references are not tags.
    withinKeys: [uses]
    pattern: '^\s*(?!(?:actions|github)/)[\w.-]+/[\w./-]+@(?![0-9a-f]{40}\s*$)\S+\s*$'
    pathInclude: '{{WORKFLOW}}'
    message: A tag or branch of a third-party action can be moved to different code at any time; whoever controls that repository then runs code with this job's token and secrets.
    message_zh: 第三方 action 的标签或分支随时可能指向其他代码；控制该仓库的人即可以本作业的令牌和密钥运行代码。
    remediation: Pin the action to a full 40-character commit SHA (keep the version in a comment) and update it with Dependabot or Renovate.
    remediation_zh: 将 action 固定到完整的 40 位提交 SHA（在注释中保留版本号），并用 Dependabot 或 Renovate 更新。
    references:
      - https://docs.github.com/en/actions/security-for-github-actions/security-guides/security-hardening-for-github-actions#using-third-party-actions
  - id: gha-permissions-write-all
    title: GitHub Actions grants write-all permissions
    title_zh: GitHub Actions 授予 write-all 权限
    severity: medium
    confidence: high
    cwe: CWE-250
    owasp: A01:2021
    languages: [yaml]
    pattern: '^\s*permissions\s*:\s*["\x27]?write-all\b'
    pathInclude: '{{WORKFLOW}}'
    message: The GITHUB_TOKEN gets write access to every scope (contents, packages, actions, ...), so any compromised step can push code or publish releases.
    message_zh: GITHUB_TOKEN 获得所有范围（contents、packages、actions 等）的写权限，任何被攻破的步骤都能推送代码或发布版本。
    remediation: Set permissions to the minimum, for example contents read, and grant write scopes per job.
    remediation_zh: 将 permissions 设为最小值（例如 contents 设为 read），按作业单独授予写权限。
  - id: gha-missing-permissions
    title: Privileged GitHub Actions workflow does not restrict token permissions
    title_zh: 特权 GitHub Actions 工作流未限制令牌权限
    severity: medium
    confidence: low
    kind: hotspot
    cwe: CWE-250
    owasp: A01:2021
    languages: [yaml]
    pattern: '^["\x27]?on["\x27]?\s*:'
    filePattern: '{{ON_OPEN}}(?:pull_request_target|workflow_run|issue_comment|issues|discussion|discussion_comment|pull_request_review_comment){{ON_CLOSE}}'
    fileAbsentPattern: '^\s*permissions\s*:'
    pathInclude: '{{WORKFLOW}}'
    message: The workflow reacts to events that outside users trigger and sets no permissions, so its token has the repository default, which may be read-write.
    message_zh: 该工作流响应外部用户可触发的事件且未设置 permissions，令牌使用仓库默认权限，可能是读写权限。
    remediation: Add a top-level permissions block (for example contents read) and grant more per job where needed.
    remediation_zh: 添加顶层 permissions（例如 contents 设为 read），需要时再按作业授予更多权限。
  - id: gha-secrets-inherit
    title: GitHub Actions passes all secrets to a reusable workflow
    title_zh: GitHub Actions 把全部密钥传给可复用工作流
    severity: low
    confidence: low
    kind: hotspot
    cwe: CWE-200
    owasp: A01:2021
    languages: [yaml]
    pattern: '^\s*secrets\s*:\s*["\x27]?inherit\b'
    pathInclude: '{{WORKFLOW}}'
    message: secrets inherit hands every secret of the repository to the called workflow, not only those it needs.
    message_zh: secrets 设为 inherit 会把仓库的全部密钥交给被调用的工作流，而不仅是其所需的密钥。
    remediation: Pass the secrets the called workflow declares, one by one.
    remediation_zh: 逐个传递被调用工作流声明的密钥。
  - id: gha-self-hosted-pull-request
    title: Self-hosted runner in a workflow triggered by pull requests
    title_zh: 由 PR 触发的工作流使用自托管 runner
    severity: high
    confidence: low
    kind: hotspot
    cwe: CWE-269
    owasp: A05:2021
    languages: [yaml]
    withinKeys: [runs-on]
    pattern: '\bself-hosted\b'
    filePattern: '{{ON_OPEN}}pull_request(?:_target)?{{ON_CLOSE}}'
    pathInclude: '{{WORKFLOW}}'
    message: Pull requests from forks can run code on a self-hosted runner, which usually persists between jobs and sits inside the network. Check that the repository is private or that fork runs need approval.
    message_zh: 来自 fork 的 PR 可以在自托管 runner 上运行代码，而 runner 通常在作业之间持久存在并位于内网。请确认仓库为私有或 fork 运行需要审批。
    remediation: Use GitHub-hosted or ephemeral, isolated runners for pull requests, and require approval for outside contributors.
    remediation_zh: PR 使用 GitHub 托管或一次性隔离 runner，并要求外部贡献者的运行经过审批。
  - id: gha-unsecure-commands
    title: GitHub Actions re-enables the insecure set-env and add-path commands
    title_zh: GitHub Actions 重新启用了不安全的 set-env 与 add-path 命令
    severity: high
    confidence: high
    cwe: CWE-94
    owasp: A03:2021
    languages: [yaml]
    pattern: '\bACTIONS_ALLOW_UNSECURE_COMMANDS["\x27]?\s*[:=]\s*["\x27]?true\b'
    pathInclude: '{{WORKFLOW}}'
    message: With ACTIONS_ALLOW_UNSECURE_COMMANDS any text printed to the log (a test name, a file content) can set environment variables and PATH for later steps.
    message_zh: 启用 ACTIONS_ALLOW_UNSECURE_COMMANDS 后，任何打印到日志的文本（测试名、文件内容）都能为后续步骤设置环境变量和 PATH。
    remediation: Remove the variable and use the GITHUB_ENV and GITHUB_PATH files.
    remediation_zh: 删除该变量，改用 GITHUB_ENV 和 GITHUB_PATH 文件。
  - id: gha-set-env-command
    title: GitHub Actions uses the deprecated set-env or add-path command
    title_zh: GitHub Actions 使用了已弃用的 set-env 或 add-path 命令
    severity: medium
    confidence: low
    kind: hotspot
    cwe: CWE-94
    owasp: A03:2021
    languages: [yaml]
    withinKeys: [run, script]
    pattern: '::(?:set-env|add-path)\b'
    pathInclude: '{{WORKFLOW}}'
    message: The set-env and add-path workflow commands are disabled because log output can trigger them; the step only works when unsecure commands are re-enabled.
    message_zh: set-env 与 add-path 命令因可被日志输出触发而被禁用；该步骤只有在重新启用不安全命令时才生效。
    remediation: Append to the GITHUB_ENV and GITHUB_PATH files instead.
    remediation_zh: 改为追加写入 GITHUB_ENV 和 GITHUB_PATH 文件。
  - id: gha-curl-pipe-shell
    title: GitHub Actions pipes a download into a shell
    title_zh: GitHub Actions 将下载内容直接交给 shell 执行
    severity: high
    confidence: high
    cwe: CWE-829
    owasp: A08:2021
    languages: [yaml]
    withinKeys: [run]
    pattern: '{{PIPE_TO_SHELL}}'
    pathInclude: '{{WORKFLOW}}'
    message: A script downloaded in the job is executed without verification, with the job's token and secrets available to it.
    message_zh: 作业中下载的脚本未经校验即被执行，且能访问作业的令牌和密钥。
    remediation: Download a pinned version, verify its checksum, then run it; or use a pinned action.
    remediation_zh: 下载固定版本并校验哈希后再执行，或使用固定版本的 action。
  - id: gha-tojson-secrets
    title: GitHub Actions exposes the whole secrets context
    title_zh: GitHub Actions 暴露了整个 secrets 上下文
    severity: high
    confidence: medium
    cwe: CWE-200
    owasp: A01:2021
    languages: [yaml]
    pattern: '\btojson\s*\(\s*secrets\s*\)'
    pathInclude: '{{WORKFLOW}}'
    message: toJSON(secrets) gives one step every secret of the repository, so a compromise of that step leaks all of them.
    message_zh: toJSON(secrets) 让单个步骤获得仓库的全部密钥，该步骤一旦被攻破即全部泄露。
    remediation: Pass only the secrets the step needs, each by name.
    remediation_zh: 只按名称传递步骤所需的密钥。
  - id: gha-workflow-run-artifact
    title: workflow_run workflow downloads artifacts of another run
    title_zh: workflow_run 工作流下载另一次运行的 artifact
    severity: high
    confidence: low
    kind: hotspot
    cwe: CWE-829
    owasp: A08:2021
    languages: [yaml]
    withinKeys: [uses]
    pattern: '^\s*(?:actions/download-artifact|dawidd6/action-download-artifact)@'
    filePattern: '{{ON_OPEN}}workflow_run{{ON_CLOSE}}'
    pathInclude: '{{WORKFLOW}}'
    message: Artifacts of the triggering run can come from a fork's pull request. Check that this privileged workflow treats them as data and never executes, sources or extracts them over its workspace.
    message_zh: 触发运行的 artifact 可能来自 fork 的 PR。请确认该特权工作流只把它们当作数据，绝不执行、source 或解压覆盖其工作区。
    remediation: Download into a separate directory, validate the content strictly, and never run scripts or binaries from it.
    remediation_zh: 下载到单独目录并严格校验内容，绝不运行其中的脚本或程序。
