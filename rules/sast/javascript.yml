    message_zh: "会话/Cookie 签名密钥是源码中的字面量：拿到代码的人都能伪造会话 Cookie。"
    remediation: "Load the secret from the environment or a secret manager and rotate the committed value."
    remediation_zh: "从环境变量或密钥管理器加载密钥，并轮换已提交的值。"
    references:
      - CWE-798
      - OWASP A07:2021
  - id: js-helmet-csp-disabled
    title: "Content-Security-Policy disabled in helmet"
    title_zh: "helmet 中关闭了 Content-Security-Policy"
