    notPattern: '{{COMMENT}}'
    pathExclude: '{{TESTPATH}}|{{MINIFIED}}'
    group: js-electron
    message: "webSecurity: false turns off the same-origin policy; allowRunningInsecureContent: true runs HTTP scripts in HTTPS pages."
    message_zh: "webSecurity: false 会关闭同源策略；allowRunningInsecureContent: true 会在 HTTPS 页面中运行 HTTP 脚本。"
    remediation: "Remove both options."
    remediation_zh: "删除这两个选项。"
    references:
