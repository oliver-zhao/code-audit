    remediation: "Use createCipheriv with a random IV per message and an AEAD mode (aes-256-gcm), with a key from scrypt or a key store."
    remediation_zh: "使用 createCipheriv，每条消息随机 IV，采用 AEAD 模式（aes-256-gcm），密钥来自 scrypt 或密钥库。"
    references:
      - CWE-327
