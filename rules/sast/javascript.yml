    message_zh: "contentSecurityPolicy: false 会去掉 CSP 头，而它是防御 XSS 的主要纵深措施；需确认是有意为之。"
    remediation: "Keep helmet's CSP and relax only the directives you need."
    remediation_zh: "保留 helmet 的 CSP，只放宽需要的指令。"
    references:
      - CWE-693
      - OWASP A05:2021
  - id: js-postmessage-no-origin
    title: "message event handler without an origin check"
    title_zh: "message 事件处理器未校验 origin"
    severity: medium
    confidence: low
