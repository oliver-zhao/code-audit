    pathExclude: '{{TESTPATH}}|{{MINIFIED}}'
    group: js-tls
    message: "Setting NODE_TLS_REJECT_UNAUTHORIZED to 0 turns off certificate validation for every TLS connection of the process."
    message_zh: "将 NODE_TLS_REJECT_UNAUTHORIZED 设为 0 会关闭整个进程所有 TLS 连接的证书校验。"
    remediation: "Remove the setting and add the needed CA with NODE_EXTRA_CA_CERTS."
    remediation_zh: "删除该设置，并用 NODE_EXTRA_CA_CERTS 添加所需的 CA。"
    references:
      - CWE-295
      - OWASP A02:2021
  - id: js-tls-old-protocol
    title: "Obsolete SSL/TLS protocol version"
    title_zh: "使用过时的 SSL/TLS 协议版本"
    severity: medium
    confidence: high
    cwe: CWE-327
    owasp: A02:2021
    languages:
      - javascript
      - typescript
    pattern: '\bsecureProtocol\s*:\s*[\"\x27](?:SSLv2|SSLv3|TLSv1|TLSv1_1)_(?:client_|server_)?method[\"\x27]|\b(?:minVersion|maxVersion)\s*:\s*[\"\x27](?:SSLv3|TLSv1|TLSv1\.1)[\"\x27]'
    flags: ''
    notPattern: '{{COMMENT}}'
    pathExclude: '{{TESTPATH}}|{{MINIFIED}}'
    group: js-tls
    message: "SSLv3, TLS 1.0 and TLS 1.1 have known weaknesses and are disabled by modern clients."
    message_zh: "SSLv3、TLS 1.0 和 TLS 1.1 存在已知弱点，现代客户端已禁用。"
    remediation: "Use minVersion: 'TLSv1.2' (or TLSv1.3) and drop secureProtocol."
    remediation_zh: "使用 minVersion: 'TLSv1.2'（或 TLSv1.3），不要设置 secureProtocol。"
    references:
      - CWE-327
      - OWASP A02:2021
  - id: js-cors-credentials-any-origin
    title: "CORS reflects any origin together with credentials"
    title_zh: "CORS 允许任意来源并携带凭据"
    severity: high
    confidence: high
    cwe: CWE-942
    owasp: A05:2021
    languages:
      - javascript
      - typescript
    pattern: '\bcors\s*(?:\(\s*|:\s*)\{(?:[^;]{0,300}?\borigin\s*:\s*true\b[^;]{0,300}?\bcredentials\s*:\s*true\b|[^;]{0,300}?\bcredentials\s*:\s*true\b[^;]{0,300}?\borigin\s*:\s*true\b)'
    flags: ''
    notPattern: '{{COMMENT}}'
    pathExclude: '{{SAMPLEPATH}}|{{MINIFIED}}'
    group: js-cors
    message: "The CORS options combine origin: true (reflect every Origin) with credentials: true, so any website can make authenticated requests and read the answers. ('*' with credentials is refused by browsers and not reported.)"
    message_zh: "CORS 选项把 origin: true（反射任意 Origin）与 credentials: true 组合使用，任何网站都能发起带凭据的请求并读取响应。（'*' 加凭据会被浏览器拒绝，不报告。）"
    remediation: "List the trusted origins explicitly when credentials are allowed."
    remediation_zh: "允许凭据时明确列出可信来源。"
    references:
      - CWE-942
      - OWASP A05:2021
  - id: js-cors-header-credentials
    title: "Access-Control-Allow-Origin reflects the request Origin, with credentials"
    title_zh: "Access-Control-Allow-Origin 反射请求 Origin 且允许凭据"
    severity: high
    confidence: medium
    cwe: CWE-942
    owasp: A05:2021
    languages:
      - javascript
      - typescript
    pattern: '\b(?:setHeader|header|set|append)\s*\(\s*[\"\x27]Access-Control-Allow-Origin[\"\x27]\s*,\s*{{REQ}}'
    flags: ''
    notPattern: '{{COMMENT}}'
    pathExclude: '{{SAMPLEPATH}}|{{MINIFIED}}'
    filePattern: 'Access-Control-Allow-Credentials[\"\x27]\s*,\s*[\"\x27]?true|\bcredentials\s*:\s*true\b'
    fileAbsentPattern: '^.{1000}'
    group: js-cors
    message: "The response copies the request's Origin into Access-Control-Allow-Origin while this file also allows credentials."
    message_zh: "响应把请求的 Origin 复制到 Access-Control-Allow-Origin，而本文件同时允许凭据。"
    remediation: "Compare the Origin with an allowlist before echoing it."
    remediation_zh: "回显 Origin 之前先与白名单比较。"
    references:
      - CWE-942
      - OWASP A05:2021
  - id: js-cookie-insecure
    title: "Cookie explicitly set without HttpOnly or Secure"
    title_zh: "Cookie 被显式设为不带 HttpOnly 或 Secure"
    severity: medium
    confidence: medium
    cwe: CWE-614
    owasp: A05:2021
    languages:
      - javascript
      - typescript
    pattern: '\bhttpOnly\s*:\s*false\b|\bcookie\s*:\s*\{[^}\n]{0,200}?\bsecure\s*:\s*false\b|\b(?:res\.cookie|cookies\.set|setCookie|cookie\.serialize)\s*\([^;\n]{0,300}?\bsecure\s*:\s*false\b'
    notPattern: '{{COMMENT}}'
    pathExclude: '{{SAMPLEPATH}}|{{MINIFIED}}'
    fileAbsentPattern: '^.{1000}'
    group: js-cookie
    message: "httpOnly: false lets scripts read the cookie (stolen by XSS); secure: false sends it over plain HTTP."
    message_zh: "httpOnly: false 让脚本可读取 Cookie（可被 XSS 窃取）；secure: false 会经明文 HTTP 发送。"
    remediation: "Set httpOnly: true and secure: true on session and authentication cookies."
    remediation_zh: "会话和认证 Cookie 设置 httpOnly: true 和 secure: true。"
    references:
      - CWE-614
      - OWASP A05:2021
  - id: js-cookie-samesite-none
    title: "Cookie with SameSite=None"
    title_zh: "Cookie 设置了 SameSite=None"
