  - id: js-prototype-pollution
    title: "Deep merge or path set with request data"
    title_zh: "请求数据用于深度合并或按路径赋值"
    severity: high
    confidence: low
    kind: hotspot
    cwe: CWE-1321
    owasp: A08:2021
    languages:
      - javascript
      - typescript
    pattern: '(?:\b(?:_|lodash|\$|jQuery|Hoek|hoek|objectPath|dotProp)\.(?:merge|mergeWith|defaultsDeep|set|setWith|zipObjectDeep|extend|applyToDefaults)|(?<![\w$.])(?:merge|deepmerge|deepExtend|defaultsDeep|mergeDeep|setWith|zipObjectDeep))\s*\((?:[^;{}]|\{\s*\}){0,200}?{{REQ}}|\bObject\.assign\s*\([^;]{0,200}?\bJSON\.parse\s*\('
    flags: ''
    notPattern: '{{COMMENT}}|JSON\.parse\(\s*JSON\.stringify'
    pathExclude: '{{TESTPATH}}|{{MINIFIED}}'
    fileAbsentPattern: '^.{1000}'
    message: "A deep merge / path setter (lodash merge, defaultsDeep, set, zipObjectDeep, $.extend(true, ...)) receives request data, or Object.assign copies parsed JSON; keys like __proto__ can pollute Object.prototype depending on the library version."
    message_zh: "深度合并/按路径赋值（lodash merge、defaultsDeep、set、zipObjectDeep、$.extend(true, ...)）接收了请求数据，或 Object.assign 复制了解析后的 JSON；视库版本而定，__proto__ 等键可污染 Object.prototype。"
    remediation: "Validate request bodies with a schema, copy only known keys, use Object.create(null) targets, and keep lodash up to date."
    remediation_zh: "用 schema 校验请求体、只复制已知键、使用 Object.create(null) 作为目标，并保持 lodash 为最新版本。"
    references:
      - CWE-1321
      - OWASP A08:2021
