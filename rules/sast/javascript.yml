    remediation: "Use AES-GCM (aes-256-gcm) or ChaCha20-Poly1305 with a random IV/nonce."
    remediation_zh: "使用带随机 IV/nonce 的 AES-GCM（aes-256-gcm）或 ChaCha20-Poly1305。"
    references:
