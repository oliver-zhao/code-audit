    message_zh: "SameSite=None 会在跨站请求中携带 Cookie；需确认端点具有 CSRF 防护且 Cookie 带 Secure。"
    remediation: "Use SameSite=Lax or Strict unless cross-site use is required."
    remediation_zh: "除非确需跨站使用，否则使用 SameSite=Lax 或 Strict。"
    references:
      - CWE-1275
      - OWASP A05:2021
  - id: js-session-hardcoded-secret
    title: "Hard-coded session or cookie signing secret"
    title_zh: "硬编码会话或 Cookie 签名密钥"
    severity: high
    confidence: medium
    cwe: CWE-798
    owasp: A07:2021
    languages:
