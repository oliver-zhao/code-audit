      - typescript
    pattern: '(?:\b(?:session|cookieSession|expressSession)\s*\(\s*\{[^;]{0,300}?\bsecret\s*:\s*|(?<![\w$.\"\x27`])cookieParser\s*\(\s*|^\s*secret\s*:\s*)[\"\x27](?<secret>[^\"\x27\n]{1,200})[\"\x27]'
    notPattern: '{{COMMENT}}'
