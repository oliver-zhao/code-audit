    fileAbsentPattern: '^.{1000}'
    message: "noent: true (XML_PARSE_NOENT) expands external entities, so an XML document can read local files or reach internal URLs (XXE)."
    message_zh: "noent: true（XML_PARSE_NOENT）会展开外部实体，XML 文档可借此读取本地文件或访问内网 URL（XXE）。"
    remediation: "Leave entity expansion off (the default) and reject DTDs in untrusted XML."
    remediation_zh: "保持实体展开关闭（默认），并拒绝不可信 XML 中的 DTD。"
    references:
      - CWE-611
      - OWASP A05:2021
  - id: js-electron-node-integration
    title: "Electron nodeIntegration enabled"
    title_zh: "Electron 启用了 nodeIntegration"
    severity: high
    confidence: high
    cwe: CWE-94
    owasp: A05:2021
    languages:
      - javascript
      - typescript
    pattern: '\bnodeIntegration\s*:\s*true\b'
    flags: ''
    notPattern: '{{COMMENT}}'
    pathExclude: '{{TESTPATH}}|{{MINIFIED}}'
    group: js-electron
    message: "With nodeIntegration any XSS in the window becomes code execution on the user's machine."
    message_zh: "启用 nodeIntegration 后，窗口中的任何 XSS 都会变成用户机器上的代码执行。"
    remediation: "Set nodeIntegration: false and expose a minimal API through a preload script with contextBridge."
    remediation_zh: "设置 nodeIntegration: false，通过 preload 脚本和 contextBridge 暴露最小 API。"
    references:
      - CWE-94
      - OWASP A05:2021
  - id: js-electron-node-integration-frames
    title: "Electron Node.js integration in sub-frames or workers"
    title_zh: "Electron 在子框架或 Worker 中启用 Node.js 集成"
    severity: medium
    confidence: low
    kind: hotspot
    cwe: CWE-94
    owasp: A05:2021
    languages:
      - javascript
      - typescript
    pattern: '\bnodeIntegrationIn(?:SubFrames|Worker)\s*:\s*true\b'
    flags: ''
    notPattern: '{{COMMENT}}'
    pathExclude: '{{TESTPATH}}|{{MINIFIED}}'
    fileAbsentPattern: '^.{1000}'
    group: js-electron
    message: "nodeIntegrationInSubFrames / nodeIntegrationInWorker give Node.js to iframes or workers when nodeIntegration is on; with sandbox and nodeIntegration off they mostly affect preload scripts. Check the other webPreferences."
    message_zh: "nodeIntegrationInSubFrames / nodeIntegrationInWorker 在 nodeIntegration 开启时把 Node.js 交给 iframe 或 Worker；在 sandbox 开启且 nodeIntegration 关闭时主要影响 preload 脚本。需检查其他 webPreferences。"
    remediation: "Remove the option unless sub-frames or workers really need Node.js."
    remediation_zh: "除非子框架或 Worker 确实需要 Node.js，否则删除该选项。"
    references:
      - CWE-94
      - OWASP A05:2021
  - id: js-electron-context-isolation
    title: "Electron contextIsolation disabled"
    title_zh: "Electron 关闭了 contextIsolation"
    severity: high
    confidence: high
    cwe: CWE-693
    owasp: A05:2021
    languages:
      - javascript
      - typescript
    pattern: '\bcontextIsolation\s*:\s*false\b'
    flags: ''
    notPattern: '{{COMMENT}}'
    pathExclude: '{{TESTPATH}}|{{MINIFIED}}'
    group: js-electron
    message: "Without context isolation page scripts share the preload script's JavaScript world and can tamper with its privileged APIs."
    message_zh: "关闭上下文隔离后，页面脚本与 preload 脚本共享 JavaScript 环境，可篡改其特权 API。"
    remediation: "Keep contextIsolation: true (the default) and use contextBridge."
    remediation_zh: "保持 contextIsolation: true（默认），并使用 contextBridge。"
    references:
      - CWE-693
      - OWASP A05:2021
  - id: js-electron-web-security
