version: 1
# Built-in JavaScript / TypeScript rules (Node.js and browser).
# Written for code-audit (Apache-2.0); not derived from other rule packs.
#
# The engine matches JavaScript one physical line at a time, comments
# included. Patterns are written to stay correct once a C-family lexer
# removes comments and joins a statement while ( or [ is open: they never
# rely on a comment or on a line break. {{COMMENT}} only drops lines that are
# entirely comment text (JSDoc examples).
#
# Policy (docs/rules.md): high = request data reaches the sink in the
# statement, or the option is dangerous whatever the data; medium = a value
# built at run time reaches the sink; hotspot = the API alone.
definitions:
  TESTPATH: '(?:^|/)(?:tests?|__tests__|__mocks__|specs?|e2e|cypress|fixtures?|testing|test-?utils|testdata|test-[\w-]{1,40}|mocks?|mock-[\w-]{1,40})/|\.(?:test|spec|e2e-spec|cy|stories)\.[cm]?[jt]sx?$|_test\.[\w.]{0,20}[jt]sx?$'
  # Minified and bundled files.
  MINIFIED: '\.min\.[cm]?js$|[.-](?:bundle|chunk)\.[cm]?js$|(?:^|/)compiled/|(?:^|/)public/(?:libraries|vendor|lib)/'
  # Build and developer tooling, where paths and commands come from the developer.
  BUILDPATH: '(?:^|/)(?:scripts?|tools|deploy|\.github|\.husky)/|(?:^|/)(?:vite|webpack|rollup|esbuild|jest|vitest|babel|karma|playwright|eslint|gulpfile|Gruntfile|generate|codegen)[\w.-]{0,40}\.[cm]?[jt]s$|\.config\.[cm]?[jt]s$'
  # Schema migrations and seed data run by the operator.
  MIGRATIONS: '(?:^|/)[\w-]{0,40}(?:[Mm]igrations?|seeds?|seeders)/'
  SAMPLEPATH: '{{TESTPATH}}|(?:^|/)(?:examples?|samples?|docs?|demos?|tutorials?|benchmarks?|playground)/'
  # A line that is only comment text: // ..., /* ..., or * ... inside JSDoc.
  COMMENT: '^\s*(?://|/?\*)'
  # Request data in Express, Koa, Fastify and hapi handlers.
  REQ: '(?:\b(?:req|request)\.(?:query|body|params|headers|cookies|signedCookies|files?|payload)\b|\breq\.(?:param|get|header)\s*\(|\bctx\.(?:request\.)?(?:query|body|params|headers|cookies|files)\b|\b(?:req|request)\.nextUrl\.searchParams\.get\s*\()'
  # Browser values an attacker controls through a link.
  DOMSRC: '(?:\b(?:document\.(?:URL|documentURI|referrer|baseURI)|location\.(?:hash|search|href)|window\.name)\b)'
  # SQL text: SELECT ... FROM, INSERT INTO, UPDATE x SET, DELETE FROM.
  SQLHEAD: '(?:\b(?:SELECT|select)\b[^;\n]{0,300}?\b(?:FROM|from)\b|\b(?:INSERT|insert)\s+(?:(?:OR|or)\s+\w+\s+)?(?:INTO|into)\b|\b(?:UPDATE|update)\s+[\w."`\[\]]{1,80}\s+(?:SET|set)\b|\b(?:DELETE|delete)\s+(?:FROM|from)\b|\b(?:REPLACE|replace)\s+(?:INTO|into)\b)'
  # A comparison or list where a SQL value goes (VALUES only with its parenthesis).
  VALPOS: '(?:[=<>]|\b(?:LIKE|like|IN|in)\b|\b(?:VALUES|values)\s*(?=\())'
  # A string that ends at a SQL value position and is continued by
  # concatenation (+ non-literal) or a template literal with ${...} there.
  # Values that are escaped, numeric, placeholders, enum members or constants.
  SAFEVAL: '(?:(?:[\w$]+\.){0,4}(?:escape\w{0,20}|quote\w{0,20}|format\w{0,10}|parseInt|parseFloat|Number|BigInt|toNumber|placeholders?)\s*\(|[\w$.]{0,60}(?:[Pp]laceholders?|[Bb]indings|qmarks)\b|[\w$.\[\]()]{1,80}\.map\(\s*\(\s*\)\s*=>\s*["\x27]\(?\?|new\s+Array\(|["\x27]\?["\x27]|[A-Z][\w$]*\.[A-Z][\w$]*\s*(?:\}|[+;,)]|$)|[A-Z][A-Z0-9_]{1,40}\s*(?:[+;,)}]|$))'
  SQLVAL: '(?:"[^"\n]{0,400}?{{VALPOS}}\s*\(?\x27?%?"\s*\+\s*(?=[\w$(])(?!{{SAFEVAL}})|\x27[^\x27\n]{0,400}?{{VALPOS}}\s*\(?"?%?\x27\s*\+\s*(?=[\w$(])(?!{{SAFEVAL}})|(?<![\w$.\])])`[^`\n]{0,400}?{{VALPOS}}\s*\(?["\x27]?%?\$\{\s*(?!{{SAFEVAL}}))'
  # Request data concatenated or interpolated anywhere in SQL text (not through an escaping or numeric wrapper).
  SQLVALREQ: '(?:["\x27`]\s*\+\s*|\$\{\s*)(?!{{SAFEVAL}})(?:[\w$.]{1,60}\(\s*)?{{REQ}}'
  # Tagged templates that parameterize: sql`...`, Prisma $queryRaw`...`.
  TAGGEDSQL: '(?:\bsql|\$queryRaw|\$executeRaw|\bPrisma\.sql)\s*`'
  # exec itself or through child_process / shelljs, not a method of another
  # object: RegExp.prototype.exec and query.exec() are not commands.
  CPRECV: '(?:(?<![.\w$])|\b(?:child_process|childProcess|cp|shell|shelljs)\.|\brequire\(\s*["\x27](?:node:)?child_process["\x27]\s*\)\.)'
  STRLIT: '(?:"[^"\n]{0,300}"|\x27[^\x27\n]{0,300}\x27)'
  # A query call whose first argument follows, optionally after literal + value + pieces.
  SQLCALL: '\.(?:query|execute|exec|run|all|get|each|prepare|raw|unsafe|\$queryRawUnsafe|\$executeRawUnsafe)\s*\(\s*(?:{{STRLIT}}\s*\+\s*[\w$.()\[\]]{1,80}\s*\+\s*){0,3}'
  # First argument built by concatenation or interpolation with a value that
  # is not __dirname / process.cwd().
  DYNARG: '(?:{{STRLIT}}\s*\+\s*(?=[\w$(])|(?!__dirname\b|process\.cwd\(\))[\w$][\w$.\[\]]{0,80}\s*\+(?!\+)|(?:__dirname|process\.cwd\(\))\s*\+\s*(?:{{STRLIT}}\s*\+\s*)?(?=[\w$(])|`[^`\n]{0,300}\$\{\s*(?!__dirname\b|process\.cwd\(\)))'
  # Numbers and process ids: not an injection vector.
  NUMISH: '(?:[\w$.]{0,60}\.pid\b|[\w$.]{0,60}(?:[Pp]id|[Pp]ort|[Cc]ount|[Ii]ndex|[Ll]ength|[Ss]ize)\s*[)}+]|Number\(|parseInt\(|String\(\s*\d)'
  # A shell command that starts with a literal command word and continues with
  # an unquoted runtime value: 'tar xzf ' + name, `git log ${ref}`.
  CMDDYN: '(?:"\s*[A-Za-z][^"\n]{0,299}[^"\x27\n]"\s*\+\s*(?=[\w$(])(?!{{NUMISH}})|\x27\s*[A-Za-z][^\x27\n]{0,299}[^"\x27\n]\x27\s*\+\s*(?=[\w$(])(?!{{NUMISH}})|`\s*[A-Za-z][^`$\n]{0,300}?(?<!["\x27])\$\{\s*(?!{{NUMISH}}|__dirname\b|process\.cwd\(\)))'
  # A path built from a literal that names a directory (it has a letter)
  # followed by a runtime value: '/data/' + name, `uploads/${name}`.
  PATHDYN: '(?:"(?=[^"\n]{0,300}?[A-Za-z])[^"\n]{1,300}"\s*\+\s*(?=[\w$(])|\x27(?=[^\x27\n]{0,300}?[A-Za-z])[^\x27\n]{1,300}\x27\s*\+\s*(?=[\w$(])(?!{{NUMISH}})|`(?=[^`$\n]{0,300}?[A-Za-z])[^`$\n]{1,300}\$\{\s*(?!{{NUMISH}}))'
  # File-system sinks; the call's first argument follows.
  FSSINK: '(?:\b(?:readFile|readFileSync|writeFile|writeFileSync|appendFile|appendFileSync|createReadStream|createWriteStream|unlink|unlinkSync|readdir|readdirSync|sendFile|sendfile)|\b(?:res|response)\.download)\s*\(\s*'
  # A path made of __dirname / process.cwd() and literals only.
  CONSTPATH: '(?:path\.(?:join|resolve)\(\s*(?:__dirname|process\.cwd\(\)|{{STRLIT}})(?:\s*,\s*{{STRLIT}}){0,8}\s*\)|(?:__dirname|process\.cwd\(\))(?:\s*\+\s*{{STRLIT}})?)'
  # Outbound HTTP clients; the call's first argument follows.
  OUTBOUND: '(?<!\b(?:function|async|new)\s{1,5})(?:(?<![\w$.#])fetch|\baxios(?:\.(?:get|post|put|patch|delete|head|request))?|\bgot\.(?:get|post|put|patch|delete|stream)|\b(?:http|https)\.(?:get|request)|\bneedle(?:\.(?:get|post|put|request))?|\bsuperagent(?:\.(?:get|post|put))?|\bundici\.(?:request|fetch))\s*\((?!\s*[\w$]+\??\s*:(?!:))'
  # The same plus bare got( / request(, which are often local names: only with request data.
  OUTBOUNDANY: '(?:{{OUTBOUND}}|(?<!\b(?:function|async|new)\s{1,5})(?<![\w$.#])(?:got|request)\s*\()'
  # A method or function definition named like an HTTP client.
  CLIENTDEF: '^\s*(?:(?:export|public|private|protected|static|async|override|function)\s+){0,4}#?(?:fetch|request|got)\s*\([^()]{0,200}\)\s*(?::[^{]{1,80})?\{'
  # A method or function definition named eval / Function, not a call.
  EVALDEF: '^\s*(?:(?:export|public|private|protected|static|async|override|function)\s+){0,4}(?:eval|Function)\s*\([^()]{0,200}\)\s*(?::[^{]{1,80})?\{'
  # The word appears inside a string literal ("requires eval() in development").
  INSTRING: '["\x27`][^"\x27`\n]{0,200}\b(?:eval|Function)\s*\([^"\x27`\n]{0,200}["\x27`]'
  # Shell quoting helpers.
  SHELLQUOTE: '\b(?:shellEscape|shellQuote|escapeShellArg|quote)\s*\(|shell-quote'
  SANITIZED: '\bDOMPurify\b|\b(?:sanitize\w{0,20}|purify|xss|filterXSS|escapeHtml|escapeHTML|encodeHTML|he\.encode|escape)\s*\('
  # A file that handles requests (Express / Koa / Nest handlers).
  HANDLER: '{{REQ}}|\b(?:req|ctx)\b|:\s*(?:Request|NextRequest|FastifyRequest)\b'
rules:
  - id: js-sql-injection
    title: "Node.js SQL query built with string concatenation"
    title_zh: "Node.js SQL 查询字符串拼接"
    severity: critical
    confidence: medium
    cwe: CWE-89
    owasp: A03:2021
    languages:
      - javascript
      - typescript
    # The first argument of a query call is SQL text (SELECT..FROM, INSERT INTO, ...)
    # whose value position is filled by + or ${...}. Identifiers (ALTER TABLE ${table})
    # are not value positions; escaped, numeric, placeholder, enum and constant values
    # are skipped. SQL text built away from the call is js-sql-string-build.
    patterns:
      - '{{SQLCALL}}{{SQLVAL}}'
      - '{{SQLHEAD}}'
    flags: ''
    notPattern: '{{COMMENT}}|{{TAGGEDSQL}}'
    pathExclude: '{{TESTPATH}}|{{BUILDPATH}}|{{MIGRATIONS}}|{{MINIFIED}}'
    fileAbsentPattern: '^.{1000}'
    group: js-sql
    message: "A SQL statement is built by concatenating or interpolating a value where a SQL value goes, so the value can change the query."
    message_zh: "SQL 语句在取值位置通过拼接或模板插值写入变量，该值可以改变查询语义。"
    remediation: "Use placeholders with a bound parameter array, a sql`...` tagged template, or the ORM's query builder."
    remediation_zh: "使用占位符加绑定参数数组、sql`...` 标签模板或 ORM 查询构造器。"
    references:
      - CWE-89
      - OWASP A03:2021
  - id: js-sql-string-build
    title: "SQL text built with a runtime value"
    title_zh: "用运行时值拼接 SQL 文本"
    severity: high
    confidence: low
    kind: hotspot
    cwe: CWE-89
    owasp: A03:2021
    languages:
      - javascript
      - typescript
    patterns:
      - '{{SQLVAL}}'
      - '{{SQLHEAD}}'
    flags: ''
    notPattern: '{{COMMENT}}|{{TAGGEDSQL}}'
    pathExclude: '{{TESTPATH}}|{{BUILDPATH}}|{{MIGRATIONS}}|{{MINIFIED}}'
    fileAbsentPattern: '^.{1000}'
    group: js-sql
    message: "SQL text puts a runtime value where a SQL value goes; confirm the value is escaped or comes from code, not from a user."
    message_zh: "SQL 文本在取值位置写入了运行时值；需确认该值已转义或来自代码而非用户。"
    remediation: "Use placeholders with a bound parameter array or a sql`...` tagged template."
    remediation_zh: "使用占位符加绑定参数数组或 sql`...` 标签模板。"
    references:
      - CWE-89
      - OWASP A03:2021
  - id: js-sql-injection-request
    title: "Request data concatenated into SQL text"
    title_zh: "请求数据被拼接进 SQL 文本"
    severity: critical
    confidence: high
    cwe: CWE-89
    owasp: A03:2021
    languages:
      - javascript
      - typescript
    patterns:
      - '{{SQLVALREQ}}'
      - '{{SQLHEAD}}'
    flags: ''
    notPattern: '{{COMMENT}}|{{TAGGEDSQL}}'
    pathExclude: '{{TESTPATH}}|{{MINIFIED}}'
    group: js-sql
    message: "A request value is concatenated or interpolated into SQL text: a classic SQL injection."
    message_zh: "请求参数被直接拼接或插值到 SQL 文本中：典型的 SQL 注入。"
    remediation: "Pass the value as a bound parameter (placeholders, sql`...` tagged template, or the ORM's replacements/bind option)."
    remediation_zh: "把该值作为绑定参数传入（占位符、sql`...` 标签模板或 ORM 的 replacements/bind 选项）。"
    references:
      - CWE-89
      - OWASP A03:2021
  - id: js-sql-builder-interpolation
    title: "Query-builder raw SQL fragment with interpolated values"
    title_zh: "查询构造器原始 SQL 片段插值"
    severity: high
    confidence: medium
    cwe: CWE-89
    owasp: A03:2021
    languages:
      - javascript
      - typescript
    pattern: '\.(?:raw|whereRaw|orWhereRaw|andWhereRaw|havingRaw|orHavingRaw|orderByRaw|groupByRaw|joinRaw|where|andWhere|orWhere|having|andHaving|orHaving|literal)\s*\(\s*(?:`(?!\$\{)[^`\n]{0,400}?{{VALPOS}}\s*\(?[\"\x27]?%?\$\{\s*|\"[^\"\n]{0,400}?{{VALPOS}}\s*\(?\x27?%?\"\s*\+\s*(?=[\w$(])|\x27[^\x27\n]{0,400}?{{VALPOS}}\s*\(?\"?%?\x27\s*\+\s*(?=[\w$(]))(?!{{SAFEVAL}})'
    flags: ''
    notPattern: '{{COMMENT}}'
    pathExclude: '{{TESTPATH}}|{{BUILDPATH}}|{{MIGRATIONS}}|{{MINIFIED}}'
    fileAbsentPattern: '^.{1000}'
    group: js-sql
    message: "A raw SQL fragment of knex (raw, whereRaw, ...), TypeORM (where, andWhere, ...) or Sequelize (literal) puts a value into a comparison by concatenation or ${...}."
    message_zh: "knex（raw、whereRaw 等）、TypeORM（where、andWhere 等）或 Sequelize（literal）的原始 SQL 片段通过拼接或 ${...} 把变量写入比较位置。"
    remediation: "Use bindings: knex.raw('x = ?', [v]), TypeORM .where('x = :v', { v }), Sequelize replacements."
    remediation_zh: "使用绑定参数：knex.raw('x = ?', [v])、TypeORM .where('x = :v', { v })、Sequelize replacements。"
    references:
      - CWE-89
      - OWASP A03:2021
  - id: js-prisma-raw-unsafe
    title: "Prisma $queryRawUnsafe / $executeRawUnsafe with a built string"
    title_zh: "Prisma $queryRawUnsafe/$executeRawUnsafe 使用拼接字符串"
    severity: critical
    confidence: medium
    cwe: CWE-89
    owasp: A03:2021
    languages:
      - javascript
      - typescript
    pattern: '(?:\$(?:queryRawUnsafe|executeRawUnsafe)|\bPrisma\.raw)\s*\(\s*(?:`[^`\n]{0,400}\$\{\s*(?!{{SAFEVAL}})|{{STRLIT}}\s*\+\s*(?![\"\x27`\s])|[\w$][\w$.]{0,80}\s*\+)'
    flags: ''
    notPattern: '{{COMMENT}}'
    pathExclude: '{{TESTPATH}}|{{MINIFIED}}'
    fileAbsentPattern: '^.{1000}'
    group: js-sql
    message: "The Unsafe raw-query APIs of Prisma run the string as SQL; concatenation or ${...} in it allows SQL injection."
    message_zh: "Prisma 的 Unsafe 原始查询 API 会把字符串直接当作 SQL 执行；其中的拼接或 ${...} 会造成 SQL 注入。"
    remediation: "Use the tagged template prisma.$queryRaw`... ${value}` (parameterized), or pass values as the extra arguments of the Unsafe API."
    remediation_zh: "使用标签模板 prisma.$queryRaw`... ${value}`（参数化），或把值作为 Unsafe API 的附加参数传入。"
    references:
      - CWE-89
      - OWASP A03:2021
  - id: js-sql-api
    title: "Node.js executes a dynamic SQL statement"
    title_zh: "Node.js 执行动态 SQL 语句"
    severity: high
    confidence: low
    kind: hotspot
    cwe: CWE-89
    owasp: A03:2021
    languages:
      - javascript
      - typescript
    # Only files that use a SQL client; the first argument is not a literal.
    pattern: '\.(?:query|execute|raw|whereRaw|orderByRaw|\$queryRawUnsafe|\$executeRawUnsafe)\s*\((?!\s*(?:[\"\x27\[{()]|`(?:[^`$\n]|\$(?!\{)){0,300}(?:`|$)|sql`|function\b|async\b|\w{1,40}\s*=>|$|[A-Z][A-Z0-9_]{1,40}\s*[,)]))'
    flags: ''
    notPattern: '{{COMMENT}}'
    pathExclude: '{{TESTPATH}}|{{BUILDPATH}}|{{MIGRATIONS}}|{{MINIFIED}}'
    filePattern: '\b(?:knex|sequelize|typeorm|prisma|mysql2?|pg|sqlite3?|better-sqlite3|mssql|oracledb|mariadb|pg-promise|postgres|createPool|createConnection|QueryRunner|DataSource)\b'
    fileAbsentPattern: '^.{1000}'
    group: js-sql
    message: "The SQL text comes from a runtime value; confirm it is not attacker-controlled."
    message_zh: "SQL 文本来自运行时值；需确认不可被攻击者控制。"
    remediation: "Use parameterized queries and keep SQL text constant."
    remediation_zh: "使用参数化查询，保持 SQL 文本为常量。"
    references:
      - CWE-89
      - OWASP A03:2021
  - id: js-nosql-where
    title: "MongoDB $where built from a runtime value"
    title_zh: "MongoDB $where 使用运行时拼接值"
    severity: critical
    confidence: medium
    cwe: CWE-943
    owasp: A03:2021
    languages:
      - javascript
      - typescript
    pattern: '[\"\x27]?\$where[\"\x27]?\s*:\s*(?:`[^`\n]{0,300}\$\{|{{STRLIT}}\s*\+\s*(?![\"\x27`\s])|[\w$][\w$.]{0,80}\s*\+|{{REQ}})|\.\$where\s*\(\s*(?:`[^`\n]{0,300}\$\{|{{STRLIT}}\s*\+|{{REQ}})'
    flags: ''
    notPattern: '{{COMMENT}}'
    pathExclude: '{{TESTPATH}}|{{MINIFIED}}'
    fileAbsentPattern: '^.{1000}'
    message: "$where runs JavaScript on the database server; a concatenated or interpolated value allows NoSQL/JavaScript injection."
    message_zh: "$where 会在数据库服务器上执行 JavaScript；拼接或插值的变量可导致 NoSQL/JavaScript 注入。"
    remediation: "Replace $where with query operators ($eq, $gt, ...) on typed values."
    remediation_zh: "用针对已校验类型值的查询运算符（$eq、$gt 等）替代 $where。"
    references:
      - CWE-943
      - OWASP A03:2021
  - id: js-nosql-query-object
    title: "MongoDB query built from a request object"
    title_zh: "MongoDB 查询直接使用请求对象"
    severity: high
    confidence: low
    kind: hotspot
    cwe: CWE-943
    owasp: A03:2021
    languages:
      - javascript
      - typescript
    pattern: '\.(?:find|findOne|findOneAndUpdate|findOneAndDelete|findOneAndReplace|updateOne|updateMany|update|deleteOne|deleteMany|remove|countDocuments|count|exists)\s*\(\s*(?:{{REQ}}\s*[,)]|\{[^;{}]{0,300}?:\s*{{REQ}}(?:\.[\w$]+){0,3}\s*[,}])'
    flags: ''
    notPattern: '{{COMMENT}}'
    pathExclude: '{{TESTPATH}}|{{MINIFIED}}'
    filePattern: '\b(?:mongoose|mongodb|mongojs|monk|marsdb|nedb|MongoClient)\b|\.collection\s*\('
    fileAbsentPattern: '^.{1000}'
    message: "A request value is used as (part of) a MongoDB filter; an object such as {\"$ne\": null} or {\"$gt\": \"\"} changes the query (login bypass)."
    message_zh: "请求值被用作 MongoDB 过滤条件（或其一部分）；{\"$ne\": null}、{\"$gt\": \"\"} 之类的对象会改变查询（如绕过登录）。"
    remediation: "Cast request values to the expected type (String(x)), validate with a schema, or enable sanitizeFilter / express-mongo-sanitize."
    remediation_zh: "把请求值转换为期望类型（String(x)）、用 schema 校验，或启用 sanitizeFilter / express-mongo-sanitize。"
    references:
      - CWE-943
      - OWASP A03:2021
  - id: js-command-injection
    title: "Node.js child_process command built with concatenation"
    title_zh: "Node.js child_process 命令拼接"
    severity: critical
    confidence: medium
    cwe: CWE-78
    owasp: A03:2021
    languages:
      - javascript
      - typescript
    pattern: '{{CPRECV}}exec(?:Sync)?\s*\(\s*{{CMDDYN}}'
    flags: ''
    notPattern: '{{COMMENT}}|{{SHELLQUOTE}}'
    pathExclude: '{{TESTPATH}}|{{BUILDPATH}}|{{MINIFIED}}'
    filePattern: 'child_process|shelljs'
    fileAbsentPattern: '^.{1000}'
    group: js-command
    message: "A shell command starts with a literal command and continues with an unquoted runtime value (concatenation or ${...}); a value with shell metacharacters runs extra commands. A command that is itself a variable is js-exec-api."
    message_zh: "shell 命令通过拼接或 ${...} 构造；含 shell 元字符的值会执行额外命令。"
    remediation: "Use execFile/spawn with an argument array, avoid shell: true, and allowlist inputs."
    remediation_zh: "使用 execFile/spawn 参数数组，避免 shell: true，并对输入做白名单校验。"
    references:
      - CWE-78
      - OWASP A03:2021
  - id: js-command-injection-request
    title: "Request data in a child_process shell command"
    title_zh: "请求数据进入 child_process shell 命令"
    severity: critical
    confidence: high
    cwe: CWE-78
    owasp: A03:2021
    languages:
      - javascript
      - typescript
    pattern: '{{CPRECV}}exec(?:Sync)?\s*\(\s*(?:[^;(){}]|\$\{|\}){0,300}?{{REQ}}'
    flags: ''
    notPattern: '{{COMMENT}}'
    pathExclude: '{{TESTPATH}}|{{MINIFIED}}'
    filePattern: 'child_process|shelljs'
    group: js-command
    message: "A request value is part of a shell command: remote command execution."
    message_zh: "请求参数成为 shell 命令的一部分：可远程执行命令。"
    remediation: "Never pass request data to a shell; use execFile/spawn with a fixed program and an argument array, and allowlist values."
    remediation_zh: "不要把请求数据交给 shell；使用固定程序的 execFile/spawn 参数数组，并对取值做白名单校验。"
    references:
      - CWE-78
      - OWASP A03:2021
  - id: js-spawn-shell
    title: "spawn / execFile with shell: true and a runtime command"
    title_zh: "spawn/execFile 使用 shell: true 且命令为运行时值"
    severity: high
    confidence: medium
    cwe: CWE-78
    owasp: A03:2021
    languages:
      - javascript
      - typescript
    pattern: '\b(?:spawn|spawnSync|execFile|execFileSync)\s*\(\s*(?![\"\x27])[^;]{0,400}?\bshell\s*:\s*true\b'
    flags: ''
    notPattern: '{{COMMENT}}'
    pathExclude: '{{TESTPATH}}|{{BUILDPATH}}|{{MINIFIED}}'
    fileAbsentPattern: '^.{1000}'
    group: js-command
    message: "With shell: true the command and its arguments are joined and parsed by a shell, so a runtime value can inject commands."
    message_zh: "shell: true 会把命令和参数拼接后交给 shell 解析，运行时值可注入命令。"
