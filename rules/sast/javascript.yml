    remediation: "Compare event.origin with the expected origin before using event.data."
    remediation_zh: "使用 event.data 之前将 event.origin 与预期来源比较。"
    references:
      - CWE-346
      - OWASP A01:2021
  - id: js-xxe
    title: "XML parsed with external entity expansion"
    title_zh: "XML 解析启用了外部实体展开"
    severity: high
    confidence: medium
    cwe: CWE-611
    owasp: A05:2021
    languages:
