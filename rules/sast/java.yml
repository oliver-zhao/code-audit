version: 1
# Built-in Java rules (Servlet, Spring, Spring Security, JDBC/JPA, XML,
# crypto, TLS, JWT) and Spring Boot configuration files.
# Written for code-audit (Apache-2.0).
#
# Conventions:
# - Java files are matched on statements (packages/core/src/lexers/clike.ts):
#   comments are blank, and a statement spanning lines while ( or [ is open,
#   or across a line break next to `+` or `.`, is one unit. Lambda bodies are
#   not joined (a block `{` ends the unit).
# - Java is case-sensitive, so the rules set `flags: ''` (the engine default
#   is case-insensitive). SQL keywords are spelled in both cases.
# - kind/confidence follow docs/rules.md: request data visible in the
#   statement -> finding, high; a SQL/command/path string built at run time
#   or an option that is dangerous whatever the data -> finding, medium; a
#   bare sink with an unknown argument -> hotspot, low.
# - Regex cost: gaps are bounded ([^;\n]{0,600}), whitespace is consumed by
#   one quantifier at a time. rules.test.ts / redos.test.ts check this.
# - Test trees (TESTPATH) are excluded from most rules; the scan lowers the
#   confidence of the rest anyway.
definitions:
  TESTPATH: '(?:^|/)src/(?:test|testFixtures|it|integrationTest|intTest|jmh)/|(?:^|/)(?:tests?|testsuite|testing|test-framework)/|(?:^|/)[^/]*(?:Test|Tests|TestCase|IT)\.java$'
  # A request object of the Servlet API, under the names it usually has.
  REQOBJ: '\b(?:request|req|httpRequest|httpServletRequest|servletRequest|httpReq|hreq)\s*\.\s*'
  # A value read from the HTTP request (Servlet API).
  REQ: '{{REQOBJ}}(?:getParameter(?:Values|Map|Names)?|getHeaders?|getQueryString|getCookies|getInputStream|getReader|getRequestURI|getPathInfo|getPart|getParts)\s*\('
  # A request value that is a plain string chosen by the client.
  REQVAL: '{{REQOBJ}}(?:getParameter(?:Values)?|getHeader|getQueryString|getPathInfo)\s*\('
  # Methods that take SQL / JPQL / HQL text as their first argument (JDBC,
  # Spring JdbcTemplate, JPA EntityManager, Hibernate Session). Ends inside
  # the argument list.
  SQLSINK: '\.(?:executeQuery|executeUpdate|executeLargeUpdate|execute|addBatch|prepareStatement|prepareCall|query|queryForObject|queryForList|queryForMap|queryForRowSet|queryForStream|queryForLong|queryForInt|update|batchUpdate|createQuery|createNativeQuery|createSQLQuery|createSelectionQuery|createMutationQuery|nativeSQL)\s*\('
  # The opening quote and first words of a SQL statement in a string literal.
  SQLSTART: '"\s?\{?\s?(?:(?:SELECT|select|Select)\s|(?:INSERT|insert|Insert)\s+(?:INTO|into)\b|(?:UPDATE|update|Update)\s+(?:[\w.`\[\]]{1,80}\s+(?:SET|set)\b|")|(?:DELETE|delete|Delete)\s+(?:(?:FROM|from)\b|")|(?:MERGE|merge|REPLACE|replace)\s+(?:INTO|into)\b|(?:CREATE|create|DROP|drop|ALTER|alter|TRUNCATE|truncate)\s+(?:TABLE|table|INDEX|index|VIEW|view|SCHEMA|schema|DATABASE|database|SEQUENCE|sequence|USER|user|ROLE|role|OR|or|UNIQUE|unique)\b|(?:CALL|call|EXEC|exec)\s|(?:WITH|with)\s+\w{1,60}\s+(?:AS|as)\b|(?:FROM|from)\s+[A-Z]\w{0,60}\s)'
  # `" + operand` where the operand is not another literal and not an
  # upper-case constant (TABLE, Foo.TABLE_NAME): a value built at run time.
  DYNCONCAT: '"\s*\+\s*(?!")(?!(?:[A-Za-z_]\w{0,60}\.){0,3}[A-Z][A-Z0-9_]{0,60}\b(?!\s*[(.]))[\w(]'
  # Rest of the SQL literal that SQLSTART opened, plus up to three further
  # literals appended to it (optionally after an upper-case constant), so
  # that the match stays inside the first argument of the call.
  SQLTAIL: '[^"\n]{0,600}(?:"\s*\+\s*(?:(?:[A-Za-z_]\w{0,60}\.){0,3}[A-Z][A-Z0-9_]{0,60}\s*\+\s*)?"[^"\n]{0,300}){0,3}'
  # Value position at the end of a SQL literal: after = < > or LIKE / IN (,
  # or inside SQL quotes. A concatenation here inserts a value; one after
  # FROM / JOIN / ORDER BY inserts an identifier (hotspot only).
  SQLVALPOS: '(?:[=<>]\s?\x27?%?|\x27%?|\b(?:LIKE|like)\s\x27?%?|\b(?:IN|in)\s?\(\s?\x27?)'
  # SQL-aware escaping (an HTML or URL encoder does not make SQL safe).
  SQLESCAPED: '(?:encodeForSQL|escapeSql|escapeSQL)\s*\('
  # A gap inside the argument list of the call whose "(" precedes it: plain
  # characters, balanced (...) groups and the opening "(" of a nested call,
  # but never the ")" that closes the call itself, so a match cannot run on
  # into a following call (new File(dir, "x").exists() && request...).
  INARG: '(?:[^()\n;]|\([^()\n;]{0,200}\)|\((?![^()\n;]{0,200}\))){0,300}?'
  # The same, limited to the first argument (no top-level comma).
  FIRSTARG: '(?:[^(),\n;]|\([^()\n;]{0,200}\)|\((?![^()\n;]{0,200}\))){0,300}?'
  # Escaping helpers that make a concatenated value safe for its context.
  ESCAPED: '(?:[eE]scape\w{0,30}|[eE]ncode\w{0,30}|[sS]anitiz\w{0,30}|ESAPI)\s*\('
  # The first argument of a call is not a single string literal (and not empty).
  # The argument may start on a later line of the joined statement.
  NONLIT: '(?!\s*"[^"\n]{0,300}"\s*\))(?=\s*[\w(])'
  SPRINGCONF: '(?:^|/)(?:application|bootstrap)(?:-[\w.-]{1,60})?\.ya?ml$'
rules:
  # ---------------------------------------------------------------- SQL ----
  - id: java-sql-injection-request
    title: Java SQL statement built from request data
    title_zh: Java 用请求数据拼接 SQL 语句
    severity: critical
    confidence: high
    cwe: CWE-89
    owasp: A03:2021
    languages: [java]
    flags: ''
    pathExclude: '{{TESTPATH}}'
    pattern: '{{SQLSINK}}\s*{{SQLSTART}}{{SQLTAIL}}"\s*\+\s*(?:[\w.]{1,80}\(\s*){0,3}{{REQ}}'
    notPattern: '{{SQLESCAPED}}'
    group: java-sql
    message: A request parameter is concatenated into SQL text that is passed to JDBC, JdbcTemplate or JPA in the same statement (SQL injection).
    message_zh: 请求参数被直接拼接进传给 JDBC、JdbcTemplate 或 JPA 的 SQL 文本（SQL 注入）。
    remediation: Keep the SQL text constant and bind the value (PreparedStatement with ?, named parameters in JdbcTemplate or setParameter in JPA).
    remediation_zh: 保持 SQL 文本为常量并绑定参数（PreparedStatement 的 ?、JdbcTemplate 命名参数或 JPA 的 setParameter）。
  - id: java-sql-injection
    title: Java SQL statement built with string concatenation
    title_zh: Java SQL 语句通过字符串拼接构造
    severity: high
    confidence: high
    cwe: CWE-89
    owasp: A03:2021
    languages: [java]
    flags: ''
    pathExclude: '{{TESTPATH}}'
    pattern: '{{SQLSINK}}\s*(?:{{SQLSTART}}{{SQLTAIL}}{{SQLVALPOS}}{{DYNCONCAT}}|String\.format\s*\(\s*{{SQLSTART}}[^"\n]{0,600}{{SQLVALPOS}}%s)'
    notPattern: '{{SQLESCAPED}}'
    group: java-sql
    message: SQL text passed to JDBC, JdbcTemplate or JPA/Hibernate is built by concatenating or formatting a run-time value into a value position (after =, LIKE, IN or inside quotes).
    message_zh: 传给 JDBC、JdbcTemplate 或 JPA/Hibernate 的 SQL 文本在值的位置（=、LIKE、IN 之后或引号内）拼接或格式化了运行时值。
    remediation: Use PreparedStatement / named parameters / setParameter for values; pick identifiers (table, column, sort order) from an allowlist.
    remediation_zh: 值使用 PreparedStatement、命名参数或 setParameter 绑定；表名、列名、排序方向等标识符从白名单中选取。
    references:
      - CWE-89
      - OWASP A03:2021
  - id: java-sql-string-concat
    title: Java SQL literal with a quoted value appended at run time
    title_zh: Java SQL 字面量在引号内拼接运行时值
    severity: high
    confidence: medium
    cwe: CWE-89
    owasp: A03:2021
    languages: [java]
    flags: ''
    pathExclude: '{{TESTPATH}}'
    pattern: '{{SQLSTART}}{{SQLTAIL}}(?:[=<>(,]\s?|\b(?:LIKE|like)\s)\x27%?{{DYNCONCAT}}'
    notPattern: '{{SQLESCAPED}}'
    group: java-sql
    message: A run-time value is spliced between SQL quotes ('" + value + "') in a comparison, LIKE, IN or VALUES list of a SQL statement; a quote in the value changes the statement.
    message_zh: 运行时值被拼接在 SQL 语句比较、LIKE、IN 或 VALUES 列表的引号之间（'" + value + "'）；值中的引号会改变语句结构。
    remediation: Replace the quoted value with a ? placeholder and bind it with PreparedStatement or a named parameter.
    remediation_zh: 用 ? 占位符代替带引号的值，并通过 PreparedStatement 或命名参数绑定。
  - id: java-sql-concat-api
    title: Java SQL text built by concatenation
    title_zh: Java 通过拼接构造 SQL 文本
    severity: high
    confidence: low
    kind: hotspot
    cwe: CWE-89
    owasp: A03:2021
    languages: [java]
    flags: ''
    pathExclude: '{{TESTPATH}}'
    pattern: '{{SQLSTART}}{{SQLTAIL}}{{DYNCONCAT}}'
    notPattern: '{{SQLESCAPED}}'
    group: java-sql
    message: SQL text is concatenated with a run-time value (often a table or column name); confirm the value cannot come from a user.
    message_zh: SQL 文本与运行时值拼接（常见于表名或列名）；需确认该值不可能来自用户。
    remediation: Bind values as parameters and choose identifiers from a fixed allowlist.
    remediation_zh: 值通过参数绑定，标识符从固定白名单中选取。
  - id: java-sql-api
    title: Java executes a dynamic SQL statement
    title_zh: Java 执行动态 SQL 语句
    severity: high
    confidence: low
    kind: hotspot
    cwe: CWE-89
    owasp: A03:2021
    languages: [java]
    flags: ''
    pathExclude: '{{TESTPATH}}'
    pattern: '\.(?:executeQuery|executeUpdate|executeLargeUpdate|addBatch|prepareStatement|prepareCall|createNativeQuery|createSQLQuery)\s*\({{NONLIT}}(?!\s*")|\b(?:st|stmt|statement|s)\.execute\s*\({{NONLIT}}(?!\s*")|\bcreateStatement\s*\(\s*\)\s*\.execute\w{0,12}\s*\({{NONLIT}}(?!\s*")|\b\w{0,40}(?:[jJ]dbc|JDBC|[tT]emplate)\w{0,20}\s*\.(?:query\w{0,12}|update|batchUpdate|execute)\s*\({{NONLIT}}(?!\s*")(?![\w.]{1,80}\.class\b)|\b(?:em|entityManager|\w{1,40}EntityManager|session|\w{1,40}Session)\s*\.(?:createQuery|createSelectionQuery|createMutationQuery)\s*\(\s*\w{0,30}(?:[jJ]pql|JPQL|[hH]ql|HQL|[sS]ql|SQL|[qQ]uery(?:String|Str|Text)|[sS]tatement)\w{0,20}\s*[,)]'
    group: java-sql
    message: The SQL statement comes from a runtime value; confirm it is not attacker-controlled.
    message_zh: SQL 语句来自运行时值；需确认不可被攻击者控制。
    remediation: Use PreparedStatement with bound parameters and keep SQL text constant.
    remediation_zh: 使用 PreparedStatement 与绑定参数，保持 SQL 文本为常量。
    references:
      - CWE-89
      - OWASP A03:2021
  - id: java-mybatis-dollar-substitution
    title: MyBatis annotation uses ${} text substitution
    title_zh: MyBatis 注解使用 ${} 文本替换
    severity: high
    confidence: medium
    cwe: CWE-89
    owasp: A03:2021
    languages: [java]
    flags: ''
    pathExclude: '{{TESTPATH}}'
    pattern: '@(?:Select|Update|Insert|Delete)\s*\(\s*(?:value\s*=\s*)?(?:\{\s*)?"(?:[^"\n]{0,600}"\s*[,+]\s*"){0,20}[^"\n]{0,600}\$\{'
    message: '${...} in a MyBatis @Select/@Update/@Insert/@Delete is pasted into the SQL text unescaped; a caller-supplied value becomes SQL.'
    message_zh: MyBatis @Select/@Update/@Insert/@Delete 中的 ${...} 会不经转义直接粘贴进 SQL 文本；调用方传入的值会变成 SQL。
    remediation: 'Use #{...} (a bound parameter). For identifiers, map the input to an allowlisted column name in Java first.'
    remediation_zh: '使用 #{...}（绑定参数）。标识符应先在 Java 中映射为白名单内的列名。'

  # ------------------------------------------------------------ command ----
  - id: java-command-injection-request
    title: Java command execution with request data
    title_zh: Java 用请求数据执行系统命令
    severity: critical
    confidence: high
    cwe: CWE-78
    owasp: A03:2021
    languages: [java]
    flags: ''
    pathExclude: '{{TESTPATH}}'
    pattern: '(?:\.exec|new\s+(?:java\.lang\.)?ProcessBuilder|\.command)\s*\({{INARG}}{{REQVAL}}'
    group: java-command
    message: A request value reaches Runtime.exec or ProcessBuilder in the same statement (OS command injection).
    message_zh: 请求参数在同一语句中进入 Runtime.exec 或 ProcessBuilder（系统命令注入）。
    remediation: Do not build commands from request data. Map the input to a fixed command, pass arguments as a list without a shell, and allowlist values.
    remediation_zh: 不要用请求数据构造命令。将输入映射为固定命令，以参数列表方式调用且不经过 shell，并对取值做白名单校验。
  - id: java-command-injection
    title: Java command execution with a concatenated command
    title_zh: Java 用拼接的命令执行系统命令
    severity: high
    confidence: medium
    cwe: CWE-78
    owasp: A03:2021
    languages: [java]
    flags: ''
    pathExclude: '{{TESTPATH}}'
    pattern: '(?:Runtime\.getRuntime\(\)|\b(?:runtime|rt|r)\b)\.exec\s*\({{INARG}}(?:{{DYNCONCAT}}|[\w)\]]\s*\+\s*"|\b[a-z]\w{0,40}\s*\+\s*[a-z]\w{0,40}\b)|new\s+(?:java\.lang\.)?ProcessBuilder\s*\({{INARG}}(?:{{DYNCONCAT}}|[\w)\]]\s*\+\s*"|\b[a-z]\w{0,40}\s*\+\s*[a-z]\w{0,40}\b)'
    group: java-command
    message: The command passed to Runtime.exec or ProcessBuilder is built by string concatenation, so a run-time value can add arguments or shell syntax.
    message_zh: 传给 Runtime.exec 或 ProcessBuilder 的命令由字符串拼接而成，运行时值可以注入额外参数或 shell 语法。
    remediation: Pass the program and each argument as separate list elements, never through a shell, and validate the values against an allowlist.
    remediation_zh: 把程序和每个参数作为独立的列表元素传入，不要经过 shell，并按白名单校验取值。
    references:
      - CWE-78
      - OWASP A03:2021
  - id: java-command-shell-wrapper
    title: Java runs a non-constant command through a shell
    title_zh: Java 通过 shell 执行非常量命令
    severity: high
    confidence: medium
    cwe: CWE-78
    owasp: A03:2021
    languages: [java]
    flags: ''
    pathExclude: '{{TESTPATH}}'
    pattern: '"(?:/bin/|/usr/bin/)?(?:ba|z|k|da)?sh"\s*,\s*"-c"\s*,\s*(?!"[^"\n]{0,300}"\s*[,)}])[\w(]|"(?:cmd|cmd\.exe)"\s*,\s*"/[cCkK]"\s*,\s*(?!"[^"\n]{0,300}"\s*[,)}])[\w(]|"(?:powershell|pwsh)(?:\.exe)?"\s*,\s*"-(?:Command|c)"\s*,\s*(?!"[^"\n]{0,300}"\s*[,)}])[\w(]'
    group: java-command
    message: A command string that is not a constant is run by sh -c / cmd /c, so shell metacharacters in it are interpreted.
    message_zh: 非常量的命令字符串通过 sh -c / cmd /c 执行，其中的 shell 元字符会被解释。
    remediation: Call the program directly with an argument list (new ProcessBuilder("prog", arg1, arg2)) instead of going through a shell.
    remediation_zh: 用参数列表直接调用程序（new ProcessBuilder("prog", arg1, arg2)），不要经过 shell。
  - id: java-exec-api
    title: Java command execution from a runtime value
    title_zh: Java 从运行时值执行命令
    severity: high
    confidence: low
    kind: hotspot
    cwe: CWE-78
    owasp: A03:2021
    languages: [java]
    flags: ''
    pathExclude: '{{TESTPATH}}'
    pattern: '(?:Runtime\.getRuntime\(\)|\b(?:runtime|rt|r)\b)\.exec\s*\({{NONLIT}}|new\s+(?:java\.lang\.)?ProcessBuilder\s*\((?!\s*"[^"\n]{0,200}"\s*(?:,\s*"[^"\n]{0,200}"\s*){0,20}\))'
    group: java-command
    message: The command comes from a runtime value; confirm the command and arguments are trusted.
    message_zh: 命令来自运行时值；需确认命令与参数可信。
    remediation: Use a ProcessBuilder argument array and an allowlist.
    remediation_zh: 使用 ProcessBuilder 参数数组并做白名单校验。
    references:
      - CWE-78
      - OWASP A03:2021

  # --------------------------------------------- expression / templates ----
  - id: java-expression-injection-request
    title: Java expression or script evaluated from request data
    title_zh: Java 对请求数据做表达式或脚本求值
    severity: critical
    confidence: high
    cwe: CWE-917
    owasp: A03:2021
    languages: [java]
    flags: ''
    pathExclude: '{{TESTPATH}}'
    pattern: '(?:\.parseExpression|\bOgnl\.(?:getValue|setValue|parseExpression)|\bMVEL\.(?:eval|compileExpression|executeExpression)\w{0,20}|\.eval|\bVelocity\.evaluate|\.evaluate|\.createValueExpression|\.parseClass)\s*\({{INARG}}{{REQVAL}}'
    notPattern: '[xX][pP]ath'
    filePattern: 'javax\.script|jakarta\.el|javax\.el|groovy|ExpressionParser|[oO]gnl|OGNL|[mM]vel|MVEL|[vV]elocity|[jJ]exl|JEXL|ScriptEngine|freemarker'
    group: java-expression
    message: A request value is evaluated as a SpEL/OGNL/MVEL/EL expression, a template or a script, which lets the client run code on the server.
    message_zh: 请求参数被当作 SpEL/OGNL/MVEL/EL 表达式、模板或脚本求值，客户端可以在服务器上执行代码。
    remediation: Never evaluate request data as an expression. Pass it as a variable into a constant expression, or use SimpleEvaluationContext for SpEL.
    remediation_zh: 不要把请求数据当作表达式求值。应将其作为变量传入常量表达式；SpEL 使用 SimpleEvaluationContext。
  - id: java-expression-eval-api
    title: Java evaluates a non-constant expression, template or script
    title_zh: Java 对非常量表达式、模板或脚本求值
    severity: high
    confidence: low
    kind: hotspot
    cwe: CWE-917
    owasp: A03:2021
    languages: [java]
    flags: ''
    pathExclude: '{{TESTPATH}}'
    pattern: '\.parseExpression\s*\({{NONLIT}}(?!\s*")|\bOgnl\.(?:getValue|setValue|parseExpression)\s*\(|\bMVEL\.(?:eval|compileExpression|executeExpression)\w{0,20}\s*\(|\bVelocity\.evaluate\s*\(|\b\w{0,40}(?:[eE]ngine|[vV]elocity)\w{0,20}\.evaluate\s*\(|\b\w{0,40}[eE]ngine\w{0,20}\.eval\s*\({{NONLIT}}(?!\s*")|\bnew\s+GroovyShell\s*\([^)\n]{0,100}\)\s*\.(?:evaluate|parse)\s*\(|\bnew\s+(?:freemarker\.template\.)?Template\s*\([^,\n]{1,100},\s*new\s+StringReader\s*\('
    group: java-expression
    message: An expression language, script engine or template engine evaluates text that is not a constant; confirm it cannot come from a user (expression / template injection).
    message_zh: 表达式语言、脚本引擎或模板引擎对非常量文本求值；需确认该文本不可能来自用户（表达式/模板注入）。
    remediation: Evaluate only constant expressions and templates; pass user values as variables. Use SimpleEvaluationContext for SpEL and a sandboxed configuration for template engines.
    remediation_zh: 只对常量表达式和模板求值，用户数据作为变量传入。SpEL 使用 SimpleEvaluationContext，模板引擎使用沙箱配置。

  # ---------------------------------------------------- deserialization ----
  - id: java-deserialization-request
    title: Java deserializes the request body with ObjectInputStream or XMLDecoder
    title_zh: Java 用 ObjectInputStream 或 XMLDecoder 反序列化请求体
    severity: critical
    confidence: high
    cwe: CWE-502
    owasp: A08:2021
    languages: [java]
    flags: ''
    pattern: 'new\s+(?:java\.io\.)?ObjectInputStream\s*\({{INARG}}{{REQ}}|new\s+(?:java\.beans\.)?XMLDecoder\s*\({{INARG}}{{REQ}}'
    group: java-deserialization
    message: Bytes sent by the client are deserialized with Java native serialization or XMLDecoder; a gadget chain on the class path gives remote code execution.
    message_zh: 客户端发送的字节被 Java 原生序列化或 XMLDecoder 反序列化；类路径上的 gadget 链可导致远程代码执行。
    remediation: Accept JSON with a fixed target type instead. If native serialization is unavoidable, set an ObjectInputFilter allowlist.
    remediation_zh: 改为接收绑定固定目标类型的 JSON。若必须使用原生序列化，设置 ObjectInputFilter 白名单。
  - id: java-insecure-deserialization
    title: Java ObjectInputStream deserialization
    title_zh: Java ObjectInputStream 反序列化
    severity: high
    confidence: low
    cwe: CWE-502
    owasp: A08:2021
    languages: [java]
    flags: ''
    pattern: 'new\s+(?:java\.io\.)?ObjectInputStream\s*\('
    fileAbsentPattern: 'setObjectInputFilter|ObjectInputFilter|ValidatingObjectInputStream|resolveClass\s*\('
    group: java-deserialization
    message: Native Java deserialization of untrusted data can lead to remote code execution.
    message_zh: 对不可信数据使用 Java 原生反序列化可导致 RCE。
    remediation: Use an ObjectInputFilter allowlist, or switch to JSON with schema validation.
    remediation_zh: 使用白名单 ObjectInputFilter，或改用 JSON 等安全格式并校验类型。
    references:
      - CWE-502
      - OWASP A08:2021
  - id: java-xmldecoder
    title: Java XMLDecoder used to read objects
    title_zh: Java 使用 XMLDecoder 读取对象
    severity: high
    confidence: medium
    cwe: CWE-502
    owasp: A08:2021
    languages: [java]
    flags: ''
    pathExclude: '{{TESTPATH}}'
    pattern: 'new\s+(?:java\.beans\.)?XMLDecoder\s*\('
    group: java-deserialization
    message: XMLDecoder executes the method calls written in the XML it reads; any XML that is not fully trusted gives code execution.
    message_zh: XMLDecoder 会执行所读取 XML 中描述的方法调用；任何不完全可信的 XML 都能导致代码执行。
    remediation: Replace XMLDecoder with a data binding (JAXB, Jackson XML) that maps to fixed types.
    remediation_zh: 用映射到固定类型的数据绑定（JAXB、Jackson XML）替代 XMLDecoder。
  - id: java-xstream-fromxml
    title: XStream deserializes XML without a type allowlist in the file
    title_zh: XStream 反序列化 XML，文件中未见类型白名单
    severity: high
    confidence: low
    kind: hotspot
    cwe: CWE-502
    owasp: A08:2021
    languages: [java]
    flags: ''
    pathExclude: '{{TESTPATH}}'
    pattern: '\.fromXML\s*\('
    fileAbsentPattern: 'allowTypes|addPermission|setupDefaultSecurity|denyTypes|NoTypePermission|allowTypesByWildcard|allowTypeHierarchy'
    message: XStream.fromXML instantiates the classes named in the XML. Versions before 1.4.18, or any version with a permissive type permission, allow remote code execution.
    message_zh: XStream.fromXML 会实例化 XML 中指定的类。1.4.18 之前的版本，或配置了宽松类型许可的任何版本，都可能导致远程代码执行。
    remediation: Use XStream 1.4.18 or later and configure an explicit allowlist (addPermission(NoTypePermission.NONE) then allowTypes(...)).
    remediation_zh: 使用 XStream 1.4.18 及以上版本并配置显式白名单（先 addPermission(NoTypePermission.NONE) 再 allowTypes(...)）。
  - id: java-jackson-default-typing
    title: Jackson default typing enabled
    title_zh: Jackson 开启了默认类型（default typing）
    severity: high
    confidence: medium
    cwe: CWE-502
    owasp: A08:2021
    languages: [java]
    flags: ''
    pathExclude: '{{TESTPATH}}'
    pattern: '(?<!SecurityJackson2Modules)\.enableDefaultTyping(?:AsProperty)?\s*\(|\bLaissezFaireSubTypeValidator\.instance\b|new\s+LaissezFaireSubTypeValidator\s*\('
    message: Global default typing (enableDefaultTyping, or activateDefaultTyping with LaissezFaireSubTypeValidator) lets JSON choose the class to instantiate, which enables gadget-chain code execution.
    message_zh: 全局默认类型（enableDefaultTyping，或 activateDefaultTyping 搭配 LaissezFaireSubTypeValidator）允许 JSON 指定要实例化的类，可被 gadget 链利用执行代码。
    remediation: Remove default typing, or use activateDefaultTyping with a BasicPolymorphicTypeValidator that allows only your own base types.
    remediation_zh: 去掉默认类型，或使用 activateDefaultTyping 搭配只允许自有基类的 BasicPolymorphicTypeValidator。
  - id: java-jackson-class-type-info
    title: Jackson @JsonTypeInfo uses class names from the JSON
    title_zh: Jackson @JsonTypeInfo 使用 JSON 中的类名
    severity: medium
    confidence: low
    kind: hotspot
    cwe: CWE-502
    owasp: A08:2021
    languages: [java]
    flags: ''
    pathExclude: '{{TESTPATH}}'
    pattern: '@JsonTypeInfo\s*\([^)\n]{0,300}\bId\.(?:CLASS|MINIMAL_CLASS)\b'
    message: 'With use = Id.CLASS the JSON names the Java class to create; when the annotated type is broad (Object, Serializable, a common interface) gadget classes can be instantiated.'
    message_zh: 'use = Id.CLASS 时由 JSON 指定要创建的 Java 类；被注解的类型较宽泛（Object、Serializable、通用接口）时可实例化 gadget 类。'
    remediation: Use Id.NAME with @JsonSubTypes listing the allowed subtypes.
    remediation_zh: 改用 Id.NAME，并在 @JsonSubTypes 中列出允许的子类型。
  - id: java-snakeyaml-unsafe-load
    title: SnakeYAML parser created without SafeConstructor
    title_zh: SnakeYAML 解析器未使用 SafeConstructor
    severity: high
    confidence: low
    kind: hotspot
    cwe: CWE-502
    owasp: A08:2021
    languages: [java]
    flags: ''
    pathExclude: '{{TESTPATH}}'
    pattern: 'new\s+Yaml\s*\(\s*\)'
    filePattern: '\.load(?:All|As)?\s*\('
    fileAbsentPattern: 'SafeConstructor'
    message: SnakeYAML before 2.0 instantiates any class named by a YAML tag when the default constructor is used; loading untrusted YAML gives code execution.
    message_zh: SnakeYAML 2.0 之前使用默认构造器时会实例化 YAML 标签指定的任意类；加载不可信 YAML 可导致代码执行。
    remediation: Use new Yaml(new SafeConstructor(new LoaderOptions())) or SnakeYAML 2.x, and load into fixed types.
    remediation_zh: 使用 new Yaml(new SafeConstructor(new LoaderOptions())) 或 SnakeYAML 2.x，并加载为固定类型。
  - id: java-fastjson-autotype
    title: Fastjson autoType enabled
    title_zh: Fastjson 开启了 autoType
    severity: critical
    confidence: high
    cwe: CWE-502
    owasp: A08:2021
    languages: [java]
    flags: ''
    pathExclude: '{{TESTPATH}}'
    pattern: '\.setAutoTypeSupport\s*\(\s*true\s*\)|\bFeature\.SupportAutoType\b'
    message: With autoType enabled, Fastjson instantiates the class named in "@type" of the JSON, which has a long history of remote code execution.
    message_zh: 开启 autoType 后，Fastjson 会实例化 JSON 中 "@type" 指定的类，历史上多次导致远程代码执行。
    remediation: Keep autoType off (enable safeMode in Fastjson 1.2.68+, or use Fastjson2 / Jackson with fixed types).
    remediation_zh: 保持 autoType 关闭（Fastjson 1.2.68+ 开启 safeMode，或改用 Fastjson2 / Jackson 并绑定固定类型）。

  # ---------------------------------------------------------------- XXE ----
  - id: java-xxe-request
    title: Java parses XML from the request with a parser that is not hardened
    title_zh: Java 用未加固的解析器解析请求中的 XML
    severity: high
    confidence: high
    cwe: CWE-611
    owasp: A05:2021
    languages: [java]
    flags: ''
    pattern: '\.(?:parse|unmarshal|createXMLStreamReader|createXMLEventReader|read|build)\s*\(\s*(?:new\s+[\w.]{1,80}\s*\(\s*){0,2}{{REQOBJ}}(?:getInputStream|getReader)\s*\('
    filePattern: 'DocumentBuilderFactory|SAXParserFactory|XMLInputFactory|SAXReader|SAXBuilder|XMLReader|JAXBContext'
    fileAbsentPattern: 'disallow-doctype-decl|external-general-entities|FEATURE_SECURE_PROCESSING|ACCESS_EXTERNAL_DTD|SUPPORT_DTD|IS_SUPPORTING_EXTERNAL_ENTITIES|setExpandEntities\s*\(\s*false|supportDTD'
    group: java-xxe
    message: The request body is parsed as XML in a file that never disables DTDs or external entities, so the client can read local files or reach internal hosts (XXE).
    message_zh: 请求体被当作 XML 解析，而该文件中从未禁用 DTD 或外部实体，客户端可读取本地文件或访问内网主机（XXE）。
    remediation: Set disallow-doctype-decl to true (or disable external entities and DTD loading) on the factory before parsing.
    remediation_zh: 解析前在工厂上设置 disallow-doctype-decl 为 true（或禁用外部实体与 DTD 加载）。
  - id: java-xxe
    title: Java XML parser is not hardened
    title_zh: Java XML 解析器未加固
    severity: high
    confidence: low
    cwe: CWE-611
    owasp: A05:2021
    languages: [java]
    flags: ''
    pathExclude: '{{TESTPATH}}'
    pattern: 'DocumentBuilderFactory\.new(?:Default|NS|DefaultNS)?Instance\s*\('
    fileAbsentPattern: 'disallow-doctype-decl|external-general-entities|FEATURE_SECURE_PROCESSING|ACCESS_EXTERNAL_DTD|setExpandEntityReferences\s*\(\s*false'
    group: java-xxe
    message: A default DocumentBuilderFactory may resolve external entities and enable XXE.
    message_zh: 默认 DocumentBuilderFactory 可能解析外部实体，导致 XXE。
    remediation: Disable DTDs and external entities, for example with disallow-doctype-decl=true.
    remediation_zh: 禁用 DTD 与外部实体，设置 disallow-doctype-decl 和外部实体特性为 false。
    references:
      - CWE-611
      - OWASP A05:2021
  - id: java-xxe-sax
    title: Java SAX / dom4j / JDOM parser is not hardened
    title_zh: Java SAX / dom4j / JDOM 解析器未加固
    severity: high
    confidence: low
    cwe: CWE-611
    owasp: A05:2021
    languages: [java]
    flags: ''
    pathExclude: '{{TESTPATH}}'
    pattern: 'SAXParserFactory\.new(?:Default|NS|DefaultNS)?Instance\s*\(|XMLReaderFactory\.createXMLReader\s*\(|new\s+(?:org\.dom4j\.io\.)?SAXReader\s*\(|new\s+(?:org\.jdom2?\.input\.)?SAXBuilder\s*\('
    fileAbsentPattern: 'disallow-doctype-decl|external-general-entities|FEATURE_SECURE_PROCESSING|ACCESS_EXTERNAL_DTD|setExpandEntities\s*\(\s*false|load-external-dtd'
    group: java-xxe
    message: A SAX, dom4j or JDOM parser is created in a file that never disables DTDs or external entities; parsing untrusted XML with it allows XXE.
    message_zh: 文件中创建了 SAX、dom4j 或 JDOM 解析器，但从未禁用 DTD 或外部实体；用它解析不可信 XML 会导致 XXE。
    remediation: Call setFeature("http://apache.org/xml/features/disallow-doctype-decl", true) on the factory or reader (JDOM - setExpandEntities(false) as well).
    remediation_zh: 在工厂或读取器上调用 setFeature("http://apache.org/xml/features/disallow-doctype-decl", true)（JDOM 还需 setExpandEntities(false)）。
  - id: java-xxe-stax
    title: Java StAX XMLInputFactory is not hardened
    title_zh: Java StAX XMLInputFactory 未加固
    severity: high
    confidence: low
    cwe: CWE-611
    owasp: A05:2021
    languages: [java]
    flags: ''
    pathExclude: '{{TESTPATH}}'
    pattern: 'XMLInputFactory\.new(?:Instance|Factory|DefaultFactory)\s*\('
    fileAbsentPattern: 'SUPPORT_DTD|IS_SUPPORTING_EXTERNAL_ENTITIES|supportDTD|isSupportingExternalEntities|ACCESS_EXTERNAL_DTD'
    group: java-xxe
    message: An XMLInputFactory is created in a file that never turns off DTD support or external entities; parsing untrusted XML with it allows XXE.
    message_zh: 文件中创建了 XMLInputFactory，但从未关闭 DTD 支持或外部实体；用它解析不可信 XML 会导致 XXE。
    remediation: Set XMLInputFactory.SUPPORT_DTD and IS_SUPPORTING_EXTERNAL_ENTITIES to false before creating readers.
    remediation_zh: 创建读取器前把 XMLInputFactory.SUPPORT_DTD 与 IS_SUPPORTING_EXTERNAL_ENTITIES 设为 false。
  - id: java-xxe-transformer
    title: Java TransformerFactory / SchemaFactory is not hardened
    title_zh: Java TransformerFactory / SchemaFactory 未加固
    severity: medium
    confidence: low
    cwe: CWE-611
    owasp: A05:2021
    languages: [java]
    flags: ''
    pathExclude: '{{TESTPATH}}'
    pattern: '\b(?:SAX)?TransformerFactory\.new(?:Default)?Instance\s*\(|\bSchemaFactory\.new(?:Default)?Instance\s*\('
    fileAbsentPattern: 'ACCESS_EXTERNAL_DTD|ACCESS_EXTERNAL_STYLESHEET|ACCESS_EXTERNAL_SCHEMA|FEATURE_SECURE_PROCESSING|disallow-doctype-decl'
    group: java-xxe
    message: A TransformerFactory or SchemaFactory is created in a file that never restricts external DTD, stylesheet or schema access; untrusted input can make it fetch files or URLs.
    message_zh: 文件中创建了 TransformerFactory 或 SchemaFactory，但从未限制外部 DTD、样式表或 Schema 访问；不可信输入可使其读取文件或访问 URL。
    remediation: Set XMLConstants.ACCESS_EXTERNAL_DTD and ACCESS_EXTERNAL_STYLESHEET (or ACCESS_EXTERNAL_SCHEMA) to "" on the factory.
    remediation_zh: 在工厂上把 XMLConstants.ACCESS_EXTERNAL_DTD 与 ACCESS_EXTERNAL_STYLESHEET（或 ACCESS_EXTERNAL_SCHEMA）设为 ""。

  # ------------------------------------------------------- LDAP / XPath ----
  - id: java-ldap-injection
    title: Java LDAP filter built by concatenation
    title_zh: Java 通过拼接构造 LDAP 过滤器
    severity: high
    confidence: medium
    cwe: CWE-90
    owasp: A03:2021
    languages: [java]
    flags: ''
    pathExclude: '{{TESTPATH}}'
    pattern: '"[^"\n]{0,200}\([A-Za-z][\w.-]{0,40}[~<>]?=\*?{{DYNCONCAT}}'
    filePattern: 'javax\.naming|DirContext|LdapTemplate|LdapContext|ldap|LDAP|Ldap'
    notPattern: '{{ESCAPED}}|LdapEncoder|filterEncode|LdapNameBuilder'
    message: A run-time value is concatenated into an LDAP search filter; characters such as * ( ) | & in it change the query (LDAP injection).
    message_zh: 运行时值被拼接进 LDAP 查询过滤器；其中的 * ( ) | & 等字符会改变查询（LDAP 注入）。
    remediation: Use search(base, "(uid={0})", new Object[]{value}, controls) with filter arguments, or escape with LdapEncoder.filterEncode.
    remediation_zh: 使用带过滤参数的 search(base, "(uid={0})", new Object[]{value}, controls)，或用 LdapEncoder.filterEncode 转义。
  - id: java-xpath-injection
    title: Java XPath expression built by concatenation
    title_zh: Java 通过拼接构造 XPath 表达式
    severity: high
    confidence: medium
    cwe: CWE-643
    owasp: A03:2021
    languages: [java]
    flags: ''
    pathExclude: '{{TESTPATH}}'
    pattern: '"[^"\n]{0,300}\[\s?@?[\w:-]{1,60}\s?=\s?\x27{{DYNCONCAT}}|\b\w{0,40}[xX][pP]ath\w{0,20}\.(?:evaluate|compile|selectNodes|selectSingleNode)\s*\(\s*"[^"\n]{0,300}{{DYNCONCAT}}'
    filePattern: 'javax\.xml\.xpath|XPath|xpath|selectNodes|selectSingleNode'
    notPattern: '{{ESCAPED}}'
    message: A run-time value is concatenated into an XPath expression; a quote in it rewrites the query (XPath injection).
    message_zh: 运行时值被拼接进 XPath 表达式；其中的引号会改写查询（XPath 注入）。
    remediation: Use an XPathVariableResolver ($name variables) or validate the value against a strict pattern.
    remediation_zh: 使用 XPathVariableResolver（$name 变量），或按严格格式校验取值。

  # --------------------------------------------------------------- SSRF ----
  - id: java-ssrf-request
    title: Java HTTP request to a URL taken from the request
    title_zh: Java 向来自请求的 URL 发起 HTTP 请求
    severity: high
    confidence: high
    cwe: CWE-918
    owasp: A10:2021
    languages: [java]
    flags: ''
    pathExclude: '{{TESTPATH}}'
    pattern: '(?:new\s+(?:java\.net\.)?URL|URI\.create|new\s+(?:java\.net\.)?URI|\.(?:getForObject|getForEntity|postForObject|postForEntity|exchange|uri)|new\s+Http(?:Get|Post|Put|Delete)|WebClient\.create|Jsoup\.connect)\s*\(\s*{{REQVAL}}'
    group: java-ssrf
    message: The server opens a URL that the client chose (server-side request forgery); it can reach internal services and cloud metadata endpoints.
    message_zh: 服务器访问由客户端指定的 URL（服务端请求伪造），可访问内部服务和云元数据接口。
    remediation: Do not fetch client-supplied URLs. Map the input to a fixed set of hosts, or validate scheme, host and resolved address against an allowlist.
    remediation_zh: 不要访问客户端提供的 URL。将输入映射到固定主机集合，或按白名单校验协议、主机名和解析后的地址。
  - id: java-ssrf-api
    title: Java opens a URL built at run time
    title_zh: Java 访问运行时构造的 URL
    severity: medium
    confidence: low
    kind: hotspot
    cwe: CWE-918
    owasp: A10:2021
    languages: [java]
    flags: ''
    pathExclude: '{{TESTPATH}}'
    pattern: 'new\s+(?:java\.net\.)?URL\s*\((?!\s*")[^)\n]{1,200}\)\s*\.open(?:Connection|Stream)\s*\(|WebClient\.create\s*\(\s*[a-z]\w{0,60}\s*\)'
    group: java-ssrf
    message: An HTTP connection is opened to a URL computed at run time; confirm the host cannot be chosen by a user.
    message_zh: 向运行时计算的 URL 建立 HTTP 连接；需确认主机不能由用户指定。
    remediation: Restrict outgoing requests to an allowlist of hosts and block internal address ranges.
    remediation_zh: 只允许访问白名单主机，并屏蔽内网地址段。

  # ------------------------------------------------------- path / files ----
  - id: java-path-traversal
    title: Java file path built from request data
    title_zh: Java 用请求数据构造文件路径
    severity: high
    confidence: high
    cwe: CWE-22
    owasp: A01:2021
    languages: [java]
    flags: ''
    pathExclude: '{{TESTPATH}}'
    pattern: '(?:new\s+(?:java\.io\.)?(?:File|FileInputStream|FileOutputStream|FileReader|FileWriter|RandomAccessFile|PrintWriter)|\bPaths\.get|\bPath\.of|\.getResource(?:AsStream)?)\s*\({{INARG}}{{REQVAL}}|(?:\bFiles\.\w{1,30}|\.resolve)\s*\({{FIRSTARG}}{{REQVAL}}'
    notPattern: 'FilenameUtils\.getName|\.getFileName\(\)'
    group: java-file
    message: A request value becomes part of a file path; "../" or an absolute path in it reads or writes files outside the intended directory.
    message_zh: 请求参数成为文件路径的一部分；其中的 "../" 或绝对路径可读写目标目录之外的文件。
    remediation: Normalize the path and verify its realpath stays inside the target directory; reject .. and absolute paths.
    remediation_zh: 规范化路径并校验其 realpath 位于目标目录内；拒绝 .. 与绝对路径。
    references:
      - CWE-22
      - OWASP A01:2021
  - id: java-upload-filename-path
    title: Uploaded file name used as a file path
    title_zh: 上传文件名被直接用作文件路径
    severity: high
    confidence: high
    cwe: CWE-22
    owasp: A01:2021
    languages: [java]
    flags: ''
    pathExclude: '{{TESTPATH}}'
    pattern: '(?:new\s+(?:java\.io\.)?(?:File|FileOutputStream)|\bPaths\.get|\bPath\.of|\.resolve|\bFiles\.(?:write|copy|newOutputStream|createFile))\s*\({{INARG}}\.(?:getOriginalFilename|getSubmittedFileName)\s*\(\s*\)'
    notPattern: 'FilenameUtils\.getName|\.getFileName\(\)|UUID'
    fileAbsentPattern: 'getCanonicalPath\s*\(|toRealPath\s*\(|\.contains\s*\(\s*"\.\."|\.normalize\s*\(\s*\)\s*\.startsWith'
    group: java-file
    message: The client-supplied name of an uploaded file is used as a path, so a name like "../../app/x.jsp" writes outside the upload directory.
    message_zh: 客户端提供的上传文件名被直接用作路径，"../../app/x.jsp" 这样的名字会写到上传目录之外。
    remediation: Generate the stored name (UUID) or keep only the last path element (FilenameUtils.getName), then check the resolved path stays inside the upload directory.
    remediation_zh: 由服务端生成存储文件名（UUID），或只保留最后一级文件名（FilenameUtils.getName），再校验解析后的路径仍在上传目录内。
  - id: java-zip-slip
    title: Archive entry name used as an extraction path
    title_zh: 压缩包条目名被直接用作解压路径
    severity: high
    confidence: medium
    cwe: CWE-22
    owasp: A01:2021
    languages: [java]
    flags: ''
    pathExclude: '{{TESTPATH}}'
    pattern: '(?:new\s+(?:java\.io\.)?(?:File|FileOutputStream)|\.resolve|\bPaths\.get|\bPath\.of)\s*\({{INARG}}\b\w{0,30}(?:[eE]ntry|\bze|\bzipEntry|\bje)\w{0,20}\.getName\s*\(\s*\)'
    fileAbsentPattern: 'getCanonicalPath\s*\(|toRealPath\s*\(|\.normalize\s*\(\s*\)|\.startsWith\s*\('
    group: java-file
    message: A ZIP/JAR entry name is joined to the extraction directory without a containment check; an entry named "../../x" is written outside it (Zip Slip).
    message_zh: ZIP/JAR 条目名直接拼接到解压目录且没有包含性检查；名为 "../../x" 的条目会被写到目录之外（Zip Slip）。
    remediation: Resolve the entry against the target directory, normalize it and reject it unless it still starts with the target directory.
    remediation_zh: 将条目解析到目标目录下并规范化，若结果不以目标目录开头则拒绝。
  - id: java-file-api
    title: Java File constructed from a runtime path
    title_zh: Java 使用运行时路径构造 File
    severity: medium
    confidence: low
    kind: hotspot
    cwe: CWE-22
    owasp: A01:2021
    languages: [java]
    flags: ''
    pathExclude: '{{TESTPATH}}'
    pattern: 'new\s+(?:java\.io\.)?File\s*\({{NONLIT}}(?!\s*(?:\w{1,60}\.){0,6}[A-Z][A-Z0-9_]{0,60}\s*\))'
    group: java-file
    message: The File path comes from a runtime value; confirm it stays inside the allowed directory after normalization.
    message_zh: File 路径来自运行时值；需确认规范化后仍位于允许目录内。
    remediation: Normalize the path and verify its realpath stays inside the target directory.
    remediation_zh: 规范化并校验 realpath 位于目标目录内。
    references:
      - CWE-22
      - OWASP A01:2021

  # ------------------------------------------------------ redirect / XSS ----
  - id: java-open-redirect-request
    title: Java redirect to a URL taken from the request
    title_zh: Java 重定向到来自请求的 URL
    severity: medium
    confidence: high
    cwe: CWE-601
    owasp: A01:2021
    languages: [java]
    flags: ''
    pathExclude: '{{TESTPATH}}'
    pattern: '\.sendRedirect\s*\(\s*{{REQVAL}}|"redirect:"\s*\+\s*{{REQVAL}}|\.setHeader\s*\(\s*"Location"\s*,\s*{{REQVAL}}'
    group: java-redirect
    message: The response redirects to a location the client chose (open redirect), which is used for phishing and to steal OAuth codes.
    message_zh: 响应重定向到客户端指定的位置（开放重定向），可被用于钓鱼和窃取 OAuth 授权码。
    remediation: Redirect only to relative paths you build yourself, or to entries of an allowlist.
    remediation_zh: 只重定向到自行构造的相对路径或白名单中的地址。
  - id: java-open-redirect
    title: Spring controller redirects to a variable target
    title_zh: Spring 控制器重定向到变量目标
    severity: medium
    confidence: medium
    cwe: CWE-601
    owasp: A01:2021
    languages: [java]
    flags: ''
    pathExclude: '{{TESTPATH}}'
    pattern: '"redirect:"\s*\+\s*[a-z]\w{0,60}\s*[;)]'
    filePattern: '@RequestParam|getParameter\s*\('
    group: java-redirect
    message: A handler that reads request parameters returns "redirect:" + variable, with no fixed path in front of it; when the variable is a parameter this is an open redirect.
    message_zh: 读取请求参数的处理器返回 "redirect:" + 变量，且前面没有固定路径；当该变量是请求参数时即为开放重定向。
    remediation: Prefix a fixed path ("redirect:/orders/" + id) or check the target against an allowlist of relative paths.
    remediation_zh: 加上固定路径前缀（"redirect:/orders/" + id），或按相对路径白名单校验目标。
  - id: java-redirect-api
    title: Java sendRedirect to a run-time value
    title_zh: Java sendRedirect 到运行时值
    severity: medium
    confidence: low
    kind: hotspot
    cwe: CWE-601
    owasp: A01:2021
    languages: [java]
    flags: ''
    pathExclude: '{{TESTPATH}}'
    pattern: '\.sendRedirect\s*\({{NONLIT}}(?!\s*")(?![^;\n]{0,200}getContextPath)'
    group: java-redirect
    message: The redirect target is a run-time value; confirm it cannot be chosen by the client.
    message_zh: 重定向目标是运行时值；需确认客户端无法指定它。
    remediation: Redirect only to relative paths you build yourself or to allowlisted URLs.
    remediation_zh: 只重定向到自行构造的相对路径或白名单 URL。
  - id: java-xss-request
    title: Java servlet writes request data into the response
    title_zh: Java Servlet 把请求数据写入响应
    severity: high
    confidence: high
    cwe: CWE-79
    owasp: A03:2021
    languages: [java]
    flags: ''
    pathExclude: '{{TESTPATH}}'
    pattern: '\.get(?:Writer|OutputStream)\s*\(\s*\)\s*\.(?:write|print|println|printf|format|append)\s*\({{INARG}}{{REQVAL}}'
    notPattern: '{{ESCAPED}}|HtmlUtils\.htmlEscape|Encode\.for'
    group: java-xss
    message: A request value is written to the response body without HTML encoding (reflected cross-site scripting).
    message_zh: 请求参数未经 HTML 编码被写入响应体（反射型跨站脚本）。
    remediation: Encode for the output context (OWASP Java Encoder Encode.forHtml, Spring HtmlUtils.htmlEscape) or render through an auto-escaping template.
    remediation_zh: 按输出上下文编码（OWASP Java Encoder 的 Encode.forHtml、Spring HtmlUtils.htmlEscape），或使用自动转义的模板渲染。
  - id: java-xss-writer-api
    title: Java servlet writes a run-time value into the response
    title_zh: Java Servlet 把运行时值写入响应
    severity: medium
    confidence: low
    kind: hotspot
    cwe: CWE-79
    owasp: A03:2021
    languages: [java]
    flags: ''
    pathExclude: '{{TESTPATH}}'
    pattern: '\.getWriter\s*\(\s*\)\s*\.(?:write|print|println|printf|format)\s*\({{NONLIT}}(?!\s*"[^"\n]{0,300}"\s*\))'
    filePattern: 'HttpServletResponse'
    notPattern: '{{ESCAPED}}|HtmlUtils\.htmlEscape|Encode\.for|objectMapper|toJson|writeValueAsString'
    group: java-xss
    message: A run-time value is written to the servlet response; confirm it is HTML-encoded or the content type is not HTML.
    message_zh: 运行时值被写入 Servlet 响应；需确认已做 HTML 编码或响应类型不是 HTML。
    remediation: Encode values for HTML before writing them, or render through an auto-escaping template.
    remediation_zh: 写出前对值做 HTML 编码，或通过自动转义的模板渲染。

  # ------------------------------------------------------------- crypto ----
  - id: java-weak-cipher
    title: Java broken or legacy cipher (DES, 3DES, RC2, RC4, Blowfish)
    title_zh: Java 使用已破解或过时的加密算法（DES、3DES、RC2、RC4、Blowfish）
    severity: medium
    confidence: medium
    cwe: CWE-327
    owasp: A02:2021
    languages: [java]
    flags: ''
    pathExclude: '{{TESTPATH}}'
    pattern: '\b(?:Cipher|KeyGenerator|SecretKeyFactory)\.getInstance\s*\(\s*"(?:DES|DESede|TripleDES|3DES|RC2|RC4|ARCFOUR|Blowfish|PBEWithMD5AndDES|PBEWithSHA1AndDESede|PBEWithMD5AndTripleDES)(?:/[^"\n]{0,60})?"'
    group: java-cipher
    message: DES, 3DES, RC2, RC4 and Blowfish have small keys or blocks, or known attacks; data encrypted with them is not protected.
    message_zh: DES、3DES、RC2、RC4 和 Blowfish 的密钥或分组过小，或存在已知攻击；用它们加密的数据得不到保护。
    remediation: Use AES-GCM (Cipher.getInstance("AES/GCM/NoPadding")) or ChaCha20-Poly1305 with a random nonce.
    remediation_zh: 使用 AES-GCM（Cipher.getInstance("AES/GCM/NoPadding")）或 ChaCha20-Poly1305，并使用随机 nonce。
  - id: java-cipher-ecb
    title: Java block cipher in ECB mode
    title_zh: Java 分组密码使用 ECB 模式
    severity: medium
    confidence: medium
    cwe: CWE-327
    owasp: A02:2021
    languages: [java]
    flags: ''
    pathExclude: '{{TESTPATH}}'
    pattern: '\bCipher\.getInstance\s*\(\s*"(?:AES(?:_(?:128|192|256))?|(?!RSA/)[A-Za-z0-9]{2,20}/ECB/[^"\n]{0,40})"'
    group: java-cipher
    message: '"AES" without a mode means AES/ECB; ECB encrypts equal blocks to equal ciphertext and has no integrity, so patterns in the data leak and ciphertext can be rearranged.'
    message_zh: '只写 "AES" 等同于 AES/ECB；ECB 会把相同明文块加密为相同密文且没有完整性保护，数据中的模式会泄露，密文可被重排。'
    remediation: Use AES/GCM/NoPadding with a fresh random 12-byte IV per message.
    remediation_zh: 使用 AES/GCM/NoPadding，并为每条消息生成新的 12 字节随机 IV。
  - id: java-rsa-no-oaep
    title: Java RSA encryption with PKCS#1 v1.5 padding
    title_zh: Java RSA 加密使用 PKCS#1 v1.5 填充
    severity: medium
    confidence: low
    cwe: CWE-780
    owasp: A02:2021
    languages: [java]
    flags: ''
    pathExclude: '{{TESTPATH}}'
    pattern: '\bCipher\.getInstance\s*\(\s*"RSA(?:/(?:ECB|NONE)/(?:PKCS1Padding|NoPadding))?"'
    group: java-cipher
    message: RSA with PKCS#1 v1.5 (the default for "RSA") or no padding is open to padding-oracle attacks when the decryption result is observable.
    message_zh: 使用 PKCS#1 v1.5 填充（"RSA" 的默认值）或无填充的 RSA，在解密结果可被观察时易受填充预言攻击。
    remediation: Use RSA/ECB/OAEPWithSHA-256AndMGF1Padding, or a hybrid scheme.
    remediation_zh: 使用 RSA/ECB/OAEPWithSHA-256AndMGF1Padding，或混合加密方案。
  - id: java-weak-hash
    title: Java weak hash algorithm (MD5/SHA1)
    title_zh: Java 使用 MD5/SHA1
    severity: medium
    confidence: low
    cwe: CWE-328
    owasp: A02:2021
    languages: [java]
    pathExclude: '{{TESTPATH}}'
    pattern: 'MessageDigest\.getInstance\(\s*"(?:MD2|MD4|MD5|SHA-?1|SHA)"|\bDigestUtils\.(?:md5|md5Hex|sha1|sha1Hex|shaHex|md2|md2Hex)\s*\('
    flags: ''
    message: MD5/SHA1 are unsuitable for security-sensitive hashing.
    message_zh: MD5/SHA1 不适合安全场景。
    remediation: Use SHA-256/SHA-512; hash passwords with PBKDF2/bcrypt/Argon2.
    remediation_zh: 使用 SHA-256/SHA-512；口令使用 PBKDF2/bcrypt/Argon2。
    references:
      - CWE-328
      - OWASP A02:2021
  - id: java-static-iv
    title: Java cipher IV is a constant
    title_zh: Java 加密 IV 为常量
    severity: medium
    confidence: low
    kind: hotspot
    cwe: CWE-329
    owasp: A02:2021
    languages: [java]
    flags: ''
    pathExclude: '{{TESTPATH}}'
    pattern: 'new\s+(?:javax\.crypto\.spec\.)?(?:IvParameterSpec|GCMParameterSpec)\s*\((?:\s*\d{2,3}\s*,)?\s*(?:new\s+byte\s*\[\s*\]\s*\{|new\s+byte\s*\[\s*\d{1,3}\s*\]\s*\)|"[^"\n]{0,100}"\s*\.getBytes)'
    message: The IV / nonce is a literal (or all zeros); reusing an IV under one key leaks plaintext relations (CBC) or breaks confidentiality and integrity outright (GCM, CTR).
    message_zh: IV / nonce 为字面量（或全零）；同一密钥下重复使用 IV 会泄露明文关系（CBC），或直接破坏机密性与完整性（GCM、CTR）。
    remediation: Generate a fresh random IV per message with SecureRandom and send it with the ciphertext.
    remediation_zh: 每条消息用 SecureRandom 生成新的随机 IV，并与密文一同传输。
  - id: java-hardcoded-crypto-key
    title: Java encryption key is a literal
    title_zh: Java 加密密钥为字面量
    severity: high
    confidence: low
    kind: hotspot
    cwe: CWE-321
    owasp: A02:2021
    languages: [java]
    flags: ''
    pathExclude: '{{TESTPATH}}'
    pattern: 'new\s+(?:javax\.crypto\.spec\.)?SecretKeySpec\s*\(\s*(?:(?<secret>"[^"\n]{1,200}")\s*\.getBytes|new\s+byte\s*\[\s*\]\s*\{)'
    redactEvidence: true
    message: A SecretKeySpec is built from a key written in the source; everyone with the code (or the binary) has the key.
    message_zh: SecretKeySpec 由写在源码中的密钥构造；任何拿到代码（或二进制）的人都拥有该密钥。
    remediation: Load keys from a key store or secret manager, and rotate the committed key.
    remediation_zh: 从密钥库或密钥管理服务加载密钥，并轮换已提交的密钥。
  - id: java-securerandom-seed
    title: Java SecureRandom seeded explicitly
    title_zh: Java SecureRandom 被显式设置种子
    severity: medium
    confidence: low
    kind: hotspot
    cwe: CWE-335
    owasp: A02:2021
    languages: [java]
    flags: ''
    pathExclude: '{{TESTPATH}}'
    pattern: '\.setSeed\s*\(|new\s+(?:java\.security\.)?SecureRandom\s*\((?!\s*\))'
    filePattern: 'SecureRandom'
    message: A seed is passed to SecureRandom; with the SHA1PRNG provider a seed given before first use replaces the system entropy and makes the output predictable.
    message_zh: 向 SecureRandom 传入了种子；对于 SHA1PRNG，在首次使用前设置的种子会替代系统熵，使输出可预测。
    remediation: Use new SecureRandom() (or SecureRandom.getInstanceStrong()) without a seed.
    remediation_zh: 使用不带种子的 new SecureRandom()（或 SecureRandom.getInstanceStrong()）。
  - id: java-weak-random-token
    title: Java security value generated with a non-cryptographic random
    title_zh: Java 用非密码学随机数生成安全相关值
    severity: medium
    confidence: medium
    cwe: CWE-338
    owasp: A02:2021
    languages: [java]
    flags: ''
    pathExclude: '{{TESTPATH}}'
    pattern: '\b\w{0,40}(?:[tT]oken|[pP]assword|[sS]ecret|[sS]alt|[nN]once|\b[oO]tp|OTP|[sS]ession[iI]d|[aA]pi[kK]ey|[rR]ememberMe|[rR]eset[cC]ode|[vV]erification[cC]ode|[cC]srf)\w{0,40}\s*=[^;\n]{0,200}?(?:new\s+(?:java\.util\.)?Random\s*\([^)\n]{0,40}\)|\bMath\.random\s*\(|\bThreadLocalRandom\.current\s*\(|\bRandomStringUtils\.random\w{0,20}\s*\()'
    group: java-random
    message: A token, password, salt or similar secret is generated with java.util.Random / Math.random / ThreadLocalRandom / RandomStringUtils, whose output can be predicted from a few samples.
    message_zh: 令牌、口令、盐等秘密值由 java.util.Random / Math.random / ThreadLocalRandom / RandomStringUtils 生成，其输出可由少量样本预测。
    remediation: Use SecureRandom (for example new SecureRandom().nextBytes(buf) encoded with Base64).
    remediation_zh: 使用 SecureRandom（例如 new SecureRandom().nextBytes(buf) 后做 Base64 编码）。
  - id: java-weak-random
    title: Java java.util.Random used for security-sensitive values
    title_zh: Java 使用 java.util.Random
    severity: medium
    confidence: low
    cwe: CWE-338
    owasp: A02:2021
    languages: [java]
    flags: ''
    pathExclude: '{{TESTPATH}}'
    pattern: 'new\s+(?:java\.util\.)?Random\s*\(\s*\)'
    group: java-random
    message: java.util.Random is not cryptographically secure.
    message_zh: java.util.Random 不是密码学安全的随机源。
    remediation: Use SecureRandom for tokens, salts, and session identifiers.
    remediation_zh: 使用 SecureRandom 生成令牌、盐和会话标识。
    references:
      - CWE-338
      - OWASP A02:2021
  - id: java-pbkdf-low-iterations
    title: Java password-based key derivation with few iterations
    title_zh: Java 基于口令的密钥派生迭代次数过少
    severity: medium
    confidence: medium
    cwe: CWE-916
    owasp: A02:2021
    languages: [java]
    flags: ''
    pathExclude: '{{TESTPATH}}'
    pattern: 'new\s+(?:javax\.crypto\.spec\.)?PBEKeySpec\s*\([^,;\n]{1,120},[^,;\n]{1,120},\s*(?:[1-9]\d{0,3}|0)\s*[,)]|new\s+(?:javax\.crypto\.spec\.)?PBEParameterSpec\s*\([^,;\n]{1,120},\s*(?:[1-9]\d{0,3})\s*[,)]'
    message: Fewer than 10,000 PBKDF iterations make offline guessing of the password cheap.
    message_zh: PBKDF 迭代次数少于 10,000，离线猜测口令的成本很低。
    remediation: Use at least 600,000 iterations for PBKDF2-HMAC-SHA256 (OWASP 2023), or Argon2id / bcrypt / scrypt.
    remediation_zh: PBKDF2-HMAC-SHA256 至少使用 600,000 次迭代（OWASP 2023），或改用 Argon2id / bcrypt / scrypt。

  # ---------------------------------------------------------------- TLS ----
  - id: java-trust-all-certificates
    title: Java TrustManager that accepts every certificate
    title_zh: Java TrustManager 接受所有证书
    severity: high
    confidence: medium
    cwe: CWE-295
    owasp: A07:2021
    languages: [java]
    flags: ''
    pathExclude: '{{TESTPATH}}'
    pattern: '\bimplements\s+(?:[\w.<>]{1,80}\s*,\s*){0,5}(?:javax\.net\.ssl\.)?X509(?:Extended)?TrustManager\b|\bnew\s+(?:javax\.net\.ssl\.)?X509(?:Extended)?TrustManager\s*\(\s*\)|\bextends\s+(?:javax\.net\.ssl\.)?X509ExtendedTrustManager\b'
    filePattern: 'checkServerTrusted'
    fileAbsentPattern: 'throw\s+new\s+(?:java\.security\.cert\.)?Certificate\w{0,40}Exception|\.checkServerTrusted\s*\(|\.checkValidity\s*\(|CertPathValidator|\.verify\s*\('
    group: java-tls
    message: This X509TrustManager never rejects a certificate (no CertificateException, no delegation, no validation), so TLS connections that use it can be intercepted.
    message_zh: 该 X509TrustManager 从不拒绝证书（不抛出 CertificateException、不委托、不校验），使用它的 TLS 连接可被中间人拦截。
    remediation: Use the default TrustManagerFactory, or a trust store that contains the private CA, instead of a custom trust-all manager.
    remediation_zh: 使用默认 TrustManagerFactory，或包含私有 CA 的信任库，而不是自定义的全信任管理器。
  - id: java-hostname-verifier-disabled
    title: Java TLS hostname verification disabled
    title_zh: Java 关闭了 TLS 主机名校验
    severity: high
    confidence: medium
    cwe: CWE-297
    owasp: A07:2021
    languages: [java]
    flags: ''
    pathExclude: '{{TESTPATH}}'
    pattern: '\bNoopHostnameVerifier\.INSTANCE\b|\bnew\s+(?:[\w.]{1,80}\.)?(?:NoopHostnameVerifier|AllowAllHostnameVerifier)\s*\(|\bALLOW_ALL_HOSTNAME_VERIFIER\b|(?:[hH]ostnameVerifier\w{0,30}\s*(?:\(|=)\s*|\bverify\s*=\s*)\(\s*\w{1,40}\s*,\s*\w{1,40}\s*\)\s*->\s*true\b|\bboolean\s+verify\s*\(\s*(?:final\s+)?String\s+\w{1,40}\s*,\s*(?:final\s+)?(?:javax\.net\.ssl\.)?SSLSession\s+\w{1,40}\s*\)\s*\{\s*return\s+true\s*;'
    group: java-tls
    message: Hostname verification is turned off, so any certificate from a trusted CA is accepted for any host (man-in-the-middle).
    message_zh: 主机名校验被关闭，任何受信 CA 签发的证书都会被任意主机接受（中间人攻击）。
    remediation: Keep the default hostname verifier (DefaultHostnameVerifier / HttpsURLConnection default).
    remediation_zh: 保留默认主机名校验器（DefaultHostnameVerifier / HttpsURLConnection 默认值）。
  - id: java-hostname-verifier-impl
    title: Java custom HostnameVerifier
    title_zh: Java 自定义 HostnameVerifier
    severity: medium
    confidence: low
    kind: hotspot
    cwe: CWE-297
    owasp: A07:2021
    languages: [java]
    flags: ''
    pathExclude: '{{TESTPATH}}'
    pattern: '\bimplements\s+(?:[\w.<>]{1,80}\s*,\s*){0,5}(?:javax\.net\.ssl\.)?HostnameVerifier\b|\bnew\s+(?:javax\.net\.ssl\.)?HostnameVerifier\s*\(\s*\)'
    group: java-tls
    message: A custom HostnameVerifier is defined; confirm verify() actually compares the host name with the certificate.
    message_zh: 定义了自定义 HostnameVerifier；需确认 verify() 确实比较了主机名与证书。
    remediation: Prefer the default hostname verifier; a custom one must delegate to it or check the certificate's subject alternative names.
    remediation_zh: 优先使用默认主机名校验器；自定义实现必须委托给它或检查证书的 SAN。
  - id: java-trust-all-strategy
    title: Apache HttpClient trust strategy accepts every certificate
    title_zh: Apache HttpClient 信任策略接受所有证书
    severity: high
    confidence: medium
    cwe: CWE-295
    owasp: A07:2021
    languages: [java]
    flags: ''
    pathExclude: '{{TESTPATH}}'
    pattern: '\bTrustAllStrategy\.INSTANCE\b|\bnew\s+(?:[\w.]{1,80}\.)?(?:TrustAllStrategy|TrustSelfSignedStrategy)\s*\(|\bTrustSelfSignedStrategy\.INSTANCE\b|\bloadTrustMaterial\s*\([^;\n]{0,100}\(\s*\w{1,40}\s*,\s*\w{1,40}\s*\)\s*->\s*true\b|\bInsecureTrustManagerFactory\.INSTANCE\b'
    group: java-tls
    message: The client trusts every (or every self-signed) server certificate, so TLS gives no protection against interception.
    message_zh: 客户端信任所有（或所有自签名）服务器证书，TLS 无法防止中间人拦截。
    remediation: Remove the trust strategy and add the server's CA to a trust store instead.
    remediation_zh: 去掉该信任策略，改为把服务器的 CA 加入信任库。
  - id: java-weak-tls-protocol
    title: Java SSLContext for SSL 3 / TLS 1.0 / TLS 1.1
    title_zh: Java SSLContext 使用 SSL 3 / TLS 1.0 / TLS 1.1
    severity: medium
    confidence: medium
    cwe: CWE-326
    owasp: A02:2021
    languages: [java]
    flags: ''
    pathExclude: '{{TESTPATH}}'
    pattern: '\bSSLContext\.getInstance\s*\(\s*"(?:SSLv2|SSLv3|TLSv1|TLSv1\.1)"|\bsetEnabledProtocols\s*\([^;\n]{0,200}"(?:SSLv2Hello|SSLv3|TLSv1|TLSv1\.1)"'
    group: java-tls
    message: The connection is limited to (or allows) SSL 3, TLS 1.0 or TLS 1.1, which are deprecated (RFC 8996) and have known attacks.
    message_zh: 连接被限定为（或允许）SSL 3、TLS 1.0 或 TLS 1.1，这些协议已被弃用（RFC 8996）且存在已知攻击。
    remediation: Use SSLContext.getInstance("TLSv1.3") or "TLS" and enable only TLSv1.2 and TLSv1.3.
    remediation_zh: 使用 SSLContext.getInstance("TLSv1.3") 或 "TLS"，并只启用 TLSv1.2 与 TLSv1.3。
  - id: java-sslcontext-generic-ssl
    title: Java SSLContext requested as "SSL"
    title_zh: Java 以 "SSL" 获取 SSLContext
    severity: low
    confidence: low
    kind: hotspot
    cwe: CWE-326
    owasp: A02:2021
    languages: [java]
    flags: ''
    pathExclude: '{{TESTPATH}}'
    pattern: '\bSSLContext\.getInstance\s*\(\s*"SSL"'
    group: java-tls
    message: SSLContext.getInstance("SSL") depends on the provider for which protocols are enabled; confirm old protocols are not enabled.
    message_zh: SSLContext.getInstance("SSL") 启用哪些协议取决于提供者；需确认未启用旧协议。
    remediation: Request "TLS" or "TLSv1.3" explicitly.
    remediation_zh: 显式请求 "TLS" 或 "TLSv1.3"。

  # ---------------------------------------------------- Spring Security ----
  - id: java-spring-csrf-disabled-form-login
    title: Spring Security disables CSRF for a form-login application
    title_zh: Spring Security 在表单登录应用中关闭了 CSRF
    severity: high
    confidence: medium
    cwe: CWE-352
    owasp: A01:2021
    languages: [java]
    flags: ''
    pathExclude: '{{TESTPATH}}'
    pattern: '\.csrf\s*\(\s*\)\s*\.disable\s*\(|\.csrf\s*\(\s*(?:\w{1,40}\s*->\s*\w{1,40}\s*\.disable\s*\(\s*\)|AbstractHttpConfigurer::disable|CsrfConfigurer::disable)\s*\)'
    filePattern: '\.formLogin\s*\('
    fileAbsentPattern: 'SessionCreationPolicy\.STATELESS|oauth2ResourceServer'
    group: java-csrf
    message: CSRF protection is disabled in a configuration that uses form login, i.e. cookie-authenticated browser sessions; other sites can submit state-changing requests as the user.
    message_zh: 在使用表单登录（基于 Cookie 的浏览器会话）的配置中关闭了 CSRF 防护；其他网站可以以用户身份提交修改状态的请求。
    remediation: Keep CSRF enabled for browser sessions; exclude only token-authenticated API paths with csrf.ignoringRequestMatchers(...).
    remediation_zh: 对浏览器会话保持 CSRF 开启；只对令牌认证的 API 路径使用 csrf.ignoringRequestMatchers(...) 排除。
  - id: java-spring-csrf-disabled
    title: Spring Security CSRF protection disabled
    title_zh: Spring Security 关闭了 CSRF 防护
    severity: medium
    confidence: low
    kind: hotspot
    cwe: CWE-352
    owasp: A01:2021
    languages: [java]
    flags: ''
    pathExclude: '{{TESTPATH}}'
    pattern: '\.csrf\s*\(\s*\)\s*\.disable\s*\(|\.csrf\s*\(\s*(?:\w{1,40}\s*->\s*\w{1,40}\s*\.disable\s*\(\s*\)|AbstractHttpConfigurer::disable|CsrfConfigurer::disable)\s*\)'
    group: java-csrf
    message: CSRF protection is disabled; this is fine for stateless token-authenticated APIs, but not when browsers authenticate with cookies.
    message_zh: CSRF 防护被关闭；对无状态、令牌认证的 API 没有问题，但浏览器使用 Cookie 认证时不安全。
    remediation: Keep CSRF enabled for cookie-authenticated endpoints, or confirm the API is stateless and uses bearer tokens.
    remediation_zh: 对 Cookie 认证的端点保持 CSRF 开启，或确认 API 是无状态的并使用 Bearer 令牌。
  - id: java-spring-permit-all
    title: Spring Security permits every request
    title_zh: Spring Security 放行所有请求
    severity: medium
    confidence: low
    kind: hotspot
    cwe: CWE-284
    owasp: A01:2021
    languages: [java]
    flags: ''
    pathExclude: '{{TESTPATH}}'
    pattern: '\banyRequest\s*\(\s*\)\s*\.permitAll\s*\(|\b(?:antMatchers|requestMatchers|mvcMatchers|pathMatchers|regexMatchers)\s*\(\s*(?:HttpMethod\.\w{1,10}\s*,\s*)?"/\*\*"\s*\)\s*\.permitAll\s*\('
    message: The filter chain allows unauthenticated access to every path; confirm access control is enforced elsewhere (method security, a gateway).
    message_zh: 过滤器链允许未认证访问所有路径；需确认访问控制在别处实施（方法级安全、网关）。
    remediation: End the rules with anyRequest().authenticated() and open only the paths that must be public.
    remediation_zh: 规则末尾使用 anyRequest().authenticated()，只开放必须公开的路径。
  - id: java-spring-cors-credentials
    title: Spring CORS allows any origin with credentials
    title_zh: Spring CORS 允许任意来源并携带凭证
    severity: high
