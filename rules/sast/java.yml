    message_zh: 允许任意来源模式（"*"）并同时允许携带凭证，任何网站都可以发起已认证的请求并读取响应。
    remediation: List the exact trusted origins when credentials are allowed.
    remediation_zh: 允许携带凭证时，明确列出受信任的来源。
  - id: java-spring-cors-wildcard
    title: Spring CORS allows any origin
    title_zh: Spring CORS 允许任意来源
    severity: medium
    confidence: low
    kind: hotspot
    cwe: CWE-942
    owasp: A05:2021
    languages: [java]
    flags: ''
    pathExclude: '{{TESTPATH}}'
    pattern: '@CrossOrigin\s*(?:\(\s*\)|$|\(\s*(?:(?:origins|value|originPatterns)\s*=\s*)?(?:\{\s*)?"\*")|\b(?:addAllowedOrigin|addAllowedOriginPattern|allowedOrigins|allowedOriginPatterns)\s*\(\s*"\*"|\b(?:setAllowedOrigins|setAllowedOriginPatterns)\s*\([^;\n]{0,100}"\*"'
    group: java-cors
    message: Cross-origin requests are allowed from any origin; confirm the endpoints are public or not cookie-authenticated.
    message_zh: 允许来自任意来源的跨域请求；需确认这些端点是公开的或不使用 Cookie 认证。
    remediation: List the trusted origins explicitly.
    remediation_zh: 明确列出受信任的来源。
  - id: java-spring-headers-disabled
    title: Spring Security response headers disabled
    title_zh: Spring Security 关闭了安全响应头
    severity: medium
    confidence: medium
    cwe: CWE-693
    owasp: A05:2021
    languages: [java]
    flags: ''
    pathExclude: '{{TESTPATH}}'
    pattern: '\.headers\s*\(\s*\)\s*\.disable\s*\(|\.headers\s*\(\s*(?:\w{1,40}\s*->\s*\w{1,40}\s*\.disable\s*\(\s*\)|AbstractHttpConfigurer::disable|HeadersConfigurer::disable)\s*\)'
    group: java-headers
    message: All security headers (X-Frame-Options, X-Content-Type-Options, HSTS, cache control) are switched off.
    message_zh: 所有安全响应头（X-Frame-Options、X-Content-Type-Options、HSTS、缓存控制）都被关闭。
    remediation: Keep the default headers and disable or relax only the single header that conflicts (for example frameOptions().sameOrigin()).
    remediation_zh: 保留默认响应头，只关闭或放宽有冲突的单个响应头（例如 frameOptions().sameOrigin()）。
  - id: java-spring-frame-options-disabled
    title: Spring Security X-Frame-Options disabled
    title_zh: Spring Security 关闭了 X-Frame-Options
    severity: low
    confidence: low
    kind: hotspot
    cwe: CWE-1021
    owasp: A05:2021
    languages: [java]
    flags: ''
    pathExclude: '{{TESTPATH}}'
    pattern: '\bframeOptions\s*\(\s*\)\s*\.disable\s*\(|\bframeOptions\s*\(\s*(?:\w{1,40}\s*->\s*\w{1,40}\s*\.disable\s*\(\s*\)|[\w.]{0,80}FrameOptionsConfig::disable)\s*\)'
    group: java-headers
    message: X-Frame-Options is disabled, so pages can be framed by other sites (clickjacking); often done for the H2 console.
    message_zh: X-Frame-Options 被关闭，页面可被其他网站嵌入（点击劫持）；常见于为 H2 控制台而关闭。
    remediation: Use frameOptions().sameOrigin() instead of disabling it.
    remediation_zh: 使用 frameOptions().sameOrigin() 替代关闭。
  - id: java-bcrypt-low-strength
    title: BCryptPasswordEncoder with a cost below 10
    title_zh: BCryptPasswordEncoder 强度低于 10
    severity: medium
    confidence: medium
    cwe: CWE-916
    owasp: A02:2021
    languages: [java]
    flags: ''
    pathExclude: '{{TESTPATH}}'
    pattern: 'new\s+BCryptPasswordEncoder\s*\(\s*[4-9]\s*[,)]'
    message: A bcrypt cost below 10 makes offline guessing of leaked password hashes cheap.
    message_zh: bcrypt 强度低于 10，泄露的口令哈希很容易被离线猜解。
    remediation: Use the default strength (10) or higher.
    remediation_zh: 使用默认强度（10）或更高。
  - id: java-weak-password-encoder
    title: Spring plaintext or weak password encoder
    title_zh: Spring 使用明文或弱口令编码器
    severity: high
    confidence: medium
    cwe: CWE-256
    owasp: A02:2021
    languages: [java]
    flags: ''
    pathExclude: '{{TESTPATH}}'
    pattern: '\bNoOpPasswordEncoder\.getInstance\s*\(|\bnew\s+(?:Md5|Md4|LdapSha|MessageDigest|Standard|Sha|Plaintext)PasswordEncoder\s*\('
    message: Passwords are stored in plain text (NoOpPasswordEncoder) or with a fast unsalted / weak digest.
    message_zh: 口令以明文（NoOpPasswordEncoder）或快速、无盐 / 弱摘要形式存储。
    remediation: Use PasswordEncoderFactories.createDelegatingPasswordEncoder() or BCrypt/Argon2/PBKDF2 encoders.
    remediation_zh: 使用 PasswordEncoderFactories.createDelegatingPasswordEncoder() 或 BCrypt/Argon2/PBKDF2 编码器。

  # ---------------------------------------------------------------- JWT ----
  - id: java-jwt-unsigned-parse
    title: JWT parsed without requiring a signature
    title_zh: 解析 JWT 时未要求签名
    severity: high
    confidence: medium
    cwe: CWE-347
    owasp: A02:2021
    languages: [java]
    flags: ''
    pathExclude: '{{TESTPATH}}'
    pattern: '\.(?:parseClaimsJwt|parsePlaintextJwt|parseUnsecuredClaims|parseUnsecuredContent)\s*\(|\bAlgorithm\.none\s*\(\s*\)|\bJwts\.parser(?:Builder)?\s*\(\s*\)(?![^;\n]{0,300}\.(?:verifyWith|decryptWith|keyLocator)\s*\()[^;\n]{0,300}\.parse\s*\(|\bJwts\.parser(?:Builder)?\s*\(\s*\)[^;\n]{0,300}\.unsecured\s*\('
    message: The token is parsed with an API that accepts unsigned JWTs (alg "none"); a client can forge any claims.
    message_zh: 使用了接受未签名 JWT（alg 为 "none"）的 API 解析令牌；客户端可以伪造任意声明。
    remediation: Use parseClaimsJws / parseSignedClaims (jjwt) or JWT.require(algorithm).build().verify(token) (auth0), which reject unsigned tokens.
    remediation_zh: 使用会拒绝未签名令牌的 parseClaimsJws / parseSignedClaims（jjwt）或 JWT.require(algorithm).build().verify(token)（auth0）。
  - id: java-jwt-hardcoded-secret
    title: JWT signing key is a string literal
    title_zh: JWT 签名密钥为字符串字面量
    severity: high
    confidence: medium
    cwe: CWE-798
    owasp: A07:2021
    languages: [java]
    flags: ''
    pathExclude: '{{TESTPATH}}'
    pattern: '(?:\.signWith|\.setSigningKey|\.verifyWith|\bAlgorithm\.HMAC(?:256|384|512)|\bKeys\.hmacShaKeyFor|\bnew\s+MACSigner|\bnew\s+MACVerifier)\s*\((?:\s*SignatureAlgorithm\.\w{1,10}\s*,)?\s*(?<secret>"[^"\n]{6,300}")'
    redactEvidence: true
    message: The JWT HMAC key is written in the source; anyone with the code can mint valid tokens.
    message_zh: JWT 的 HMAC 密钥写在源码中；任何拿到代码的人都能签发有效令牌。
    remediation: Load the key from configuration or a secret manager, use at least 256 random bits, and rotate the committed key.
    remediation_zh: 从配置或密钥管理服务加载密钥，使用至少 256 位随机密钥，并轮换已提交的密钥。
  - id: java-jwt-decode-without-verify
    title: auth0 JWT.decode used without verification in the file
    title_zh: 文件中使用 auth0 JWT.decode 但未见验签
    severity: medium
    confidence: low
    kind: hotspot
    cwe: CWE-347
    owasp: A02:2021
    languages: [java]
    flags: ''
    pathExclude: '{{TESTPATH}}'
    pattern: '\bJWT\.decode\s*\('
    fileAbsentPattern: 'JWT\.require\s*\(|\.verify\s*\('
    message: JWT.decode only decodes the token and does not check the signature; confirm the claims are not trusted for authentication or authorization.
    message_zh: JWT.decode 只解码令牌，不校验签名；需确认这些声明不会被用于认证或授权。
    remediation: Verify with JWT.require(algorithm).build().verify(token) before using claims.
    remediation_zh: 使用声明前先用 JWT.require(algorithm).build().verify(token) 验签。

  # ------------------------------------------------------------ cookies ----
  - id: java-cookie-insecure-flag
    title: Cookie explicitly created without Secure or HttpOnly
    title_zh: Cookie 被显式设为不带 Secure 或 HttpOnly
    severity: medium
    confidence: medium
    cwe: CWE-614
    owasp: A05:2021
    languages: [java]
    flags: ''
    pathExclude: '{{TESTPATH}}'
    pattern: '\.set(?:HttpOnly|Secure)\s*\(\s*false\s*\)|\.(?:httpOnly|secure)\s*\(\s*false\s*\)'
    filePattern: 'Cookie'
    message: The cookie is explicitly sent without Secure (allowed over plain HTTP) or without HttpOnly (readable by scripts).
    message_zh: 该 Cookie 被显式设为不带 Secure（可经明文 HTTP 发送）或不带 HttpOnly（可被脚本读取）。
    remediation: Set Secure and HttpOnly (and SameSite) on session and authentication cookies.
    remediation_zh: 为会话和认证 Cookie 设置 Secure、HttpOnly（以及 SameSite）。

  # ------------------------------------------------- JNDI / reflection ----
  - id: java-jndi-injection
    title: JNDI lookup of a name taken from the request
    title_zh: 以请求数据作为名称执行 JNDI lookup
    severity: critical
    confidence: high
    cwe: CWE-74
    owasp: A03:2021
    languages: [java]
    flags: ''
    pathExclude: '{{TESTPATH}}'
    pattern: '\.lookup\s*\(\s*{{REQVAL}}'
    filePattern: 'javax\.naming|InitialContext|JndiTemplate'
    message: A JNDI name chosen by the client is looked up; an ldap:// or rmi:// name loads a remote object (the Log4Shell mechanism).
    message_zh: 查找由客户端指定的 JNDI 名称；ldap:// 或 rmi:// 名称会加载远程对象（即 Log4Shell 的利用方式）。
    remediation: Look up only constant names; never pass request data to Context.lookup.
    remediation_zh: 只查找常量名称；不要把请求数据传给 Context.lookup。
  - id: java-log4j-request-logging
    title: Log4j 2 logs request data
    title_zh: Log4j 2 记录请求数据
    severity: medium
    confidence: low
    kind: hotspot
    cwe: CWE-917
    owasp: A06:2021
    languages: [java]
    flags: ''
    pathExclude: '{{TESTPATH}}'
    pattern: '\b(?:log|logger|LOG|LOGGER)\.(?:trace|debug|info|warn|error|fatal)\s*\({{INARG}}{{REQVAL}}'
    filePattern: 'org\.apache\.logging\.log4j'
    message: Request data is logged with Log4j 2. With log4j-core older than 2.17.1 (and lookups enabled) "${jndi:...}" in the value loads remote code (Log4Shell, CVE-2021-44228); it also allows log forging.
    message_zh: 用 Log4j 2 记录了请求数据。log4j-core 低于 2.17.1（且启用 lookup）时，值中的 "${jndi:...}" 会加载远程代码（Log4Shell，CVE-2021-44228）；也可能导致日志伪造。
    remediation: Upgrade log4j-core to 2.17.1 or later, log values as {} parameters, and strip CR/LF from logged request data.
    remediation_zh: 将 log4j-core 升级到 2.17.1 及以上，以 {} 参数方式记录值，并去除请求数据中的 CR/LF。
  - id: java-class-forname-request
    title: Java loads a class named by the request
    title_zh: Java 加载由请求指定的类
    severity: high
    confidence: low
    kind: hotspot
    cwe: CWE-470
    owasp: A03:2021
    languages: [java]
    flags: ''
    pathExclude: '{{TESTPATH}}'
    pattern: '(?:\bClass\.forName|\.loadClass)\s*\({{INARG}}{{REQVAL}}'
    message: The class to load comes from the request (unsafe reflection); confirm it is checked against an allowlist before use.
    message_zh: 要加载的类来自请求（不安全反射）；需确认使用前已按白名单校验。
    remediation: Map request values to classes through a fixed table instead of Class.forName.
    remediation_zh: 通过固定映射表把请求值映射为类，而不是使用 Class.forName。
  - id: java-regex-from-request
    title: Java compiles a regular expression from request data
    title_zh: Java 用请求数据编译正则表达式
    severity: medium
    confidence: low
    kind: hotspot
    cwe: CWE-1333
    owasp: A05:2021
    languages: [java]
    flags: ''
    pathExclude: '{{TESTPATH}}'
    pattern: '\bPattern\.(?:compile|matches)\s*\(\s*{{REQVAL}}|\.(?:matches|replaceAll|replaceFirst|split)\s*\(\s*{{REQVAL}}'
    message: A client-supplied regular expression can take exponential time on crafted input (ReDoS).
    message_zh: 客户端提供的正则表达式在特制输入上可能耗费指数级时间（ReDoS）。
    remediation: Quote the value with Pattern.quote, or accept only a fixed set of patterns.
    remediation_zh: 使用 Pattern.quote 转义该值，或只接受固定的模式集合。
  - id: java-forwarded-for-trusted
    title: Java reads the client IP from X-Forwarded-For
    title_zh: Java 从 X-Forwarded-For 读取客户端 IP
    severity: medium
    confidence: low
    kind: hotspot
    cwe: CWE-348
    owasp: A07:2021
    languages: [java]
    flags: ''
    pathExclude: '{{TESTPATH}}'
    pattern: '\.getHeader\s*\(\s*"(?:X-Forwarded-For|x-forwarded-for|X-FORWARDED-FOR|X-Real-IP|X-Real-Ip|x-real-ip|X-Client-IP|Client-IP|True-Client-IP)"'
    message: X-Forwarded-For / X-Real-IP is set by the client unless a trusted proxy overwrites it; confirm it is not used for authentication, allowlists or rate limits.
    message_zh: 除非可信代理覆盖，X-Forwarded-For / X-Real-IP 由客户端设置；需确认它没有被用于认证、白名单或限流。
    remediation: Use request.getRemoteAddr() behind a configured trusted proxy (ForwardedHeaderFilter / RemoteIpValve with an internal proxy list).
    remediation_zh: 在配置了可信代理的前提下使用 request.getRemoteAddr()（ForwardedHeaderFilter / RemoteIpValve 并设置内部代理列表）。

  # ------------------------------------------- Spring Boot configuration ----
  - id: java-spring-actuator-exposed
    title: Spring Boot exposes all actuator endpoints over HTTP
    title_zh: Spring Boot 通过 HTTP 暴露所有 actuator 端点
    severity: high
    confidence: medium
    cwe: CWE-200
    owasp: A05:2021
    languages: [yaml]
    flags: ''
    pathInclude: '{{SPRINGCONF}}'
    pathExclude: '{{TESTPATH}}|(?:^|/)application-(?:dev|local|test)\w{0,20}\.ya?ml$'
    pattern: '^\s*(?:management\.endpoints\.web\.exposure\.)?include\s*:\s*(?:"\*"|\x27\*\x27|\[\s*["\x27]\*["\x27]\s*\])'
    filePattern: 'exposure'
    group: java-actuator
    message: 'management.endpoints.web.exposure.include: "*" publishes every actuator endpoint, including heapdump (memory with secrets) and env, unless the endpoints are separately secured.'
    message_zh: 'management.endpoints.web.exposure.include: "*" 会公开所有 actuator 端点，包括 heapdump（含秘密的内存）和 env，除非这些端点另有保护。'
    remediation: Expose only health (and info) over HTTP, and protect any other endpoint with Spring Security or a separate management port.
    remediation_zh: 只通过 HTTP 暴露 health（和 info），其他端点用 Spring Security 或独立的管理端口保护。
  - id: java-spring-actuator-sensitive
    title: Spring Boot exposes sensitive actuator endpoints
    title_zh: Spring Boot 暴露敏感的 actuator 端点
    severity: medium
    confidence: low
    kind: hotspot
    cwe: CWE-200
    owasp: A05:2021
    languages: [yaml]
    flags: ''
    pathInclude: '{{SPRINGCONF}}'
    pathExclude: '{{TESTPATH}}'
    pattern: '^\s*(?:management\.endpoints\.web\.exposure\.)?include\s*:[^#\n]{0,300}\b(?:env|heapdump|threaddump|jolokia|configprops|logfile|shutdown|gateway)\b'
    filePattern: 'exposure'
    group: java-actuator
    message: env, heapdump, configprops or similar actuator endpoints are exposed over HTTP; confirm they require an administrator role.
    message_zh: env、heapdump、configprops 等 actuator 端点通过 HTTP 暴露；需确认访问它们需要管理员角色。
    remediation: Remove these endpoints from the exposure list or secure them with Spring Security.
    remediation_zh: 从暴露列表中去掉这些端点，或用 Spring Security 保护。
  - id: java-spring-h2-console
    title: Spring Boot enables the H2 web console
    title_zh: Spring Boot 开启了 H2 Web 控制台
    severity: high
    confidence: medium
    cwe: CWE-489
    owasp: A05:2021
    languages: [yaml]
    flags: ''
    pathInclude: '{{SPRINGCONF}}'
    pathExclude: '{{TESTPATH}}|(?:^|/)application-(?:dev|local|test)\w{0,20}\.ya?ml$'
    # Matched on the parsed YAML: every scalar below a `console:` key (nested
    # h2: / console: / enabled: true) and the dotted spellings of the key.
    withinKeys: [console, console.enabled, h2.console.enabled, spring.h2.console.enabled]
    pattern: '^\s*true\s*$'
    filePattern: '^\s*(?:spring\.)?h2[.:]'
    message: The H2 console gives a SQL shell (and, through CREATE ALIAS, Java code execution) to anyone who can reach it.
    message_zh: H2 控制台为任何能访问它的人提供 SQL 终端（并可通过 CREATE ALIAS 执行 Java 代码）。
    remediation: Enable the H2 console only in a local development profile.
    remediation_zh: 只在本地开发 profile 中开启 H2 控制台。
  - id: java-spring-stacktrace-exposed
    title: Spring Boot error pages always include the stack trace
    title_zh: Spring Boot 错误页面总是包含堆栈
    severity: medium
    confidence: medium
    cwe: CWE-209
    owasp: A05:2021
    languages: [yaml]
    flags: ''
    pathInclude: '{{SPRINGCONF}}'
    pathExclude: '{{TESTPATH}}|(?:^|/)application-(?:dev|local|test)\w{0,20}\.ya?ml$'
    pattern: '^\s*(?:server\.error\.)?include-stacktrace\s*:\s*["\x27]?always\b'
    message: Every error response contains the Java stack trace, which reveals code paths, library versions and sometimes data.
    message_zh: 每个错误响应都包含 Java 堆栈，会泄露代码路径、库版本，有时还包括数据。
    remediation: 'Use include-stacktrace: never (the default) in production profiles.'
    remediation_zh: '生产 profile 使用 include-stacktrace: never（默认值）。'
  - id: java-spring-debug-enabled
    title: Spring Boot debug mode enabled in a configuration file
    title_zh: Spring Boot 配置文件开启了 debug 模式
    severity: low
    confidence: low
    kind: hotspot
    cwe: CWE-489
    owasp: A05:2021
    languages: [yaml]
    flags: ''
    pathInclude: '{{SPRINGCONF}}'
    pathExclude: '{{TESTPATH}}|(?:^|/)application-(?:dev|local|test)\w{0,20}\.ya?ml$'
    pattern: '^debug\s*:\s*["\x27]?true\b'
    message: 'debug: true logs the auto-configuration report and more detail; confirm this file is not used in production.'
    message_zh: 'debug: true 会输出自动配置报告等详细日志；需确认该文件不用于生产环境。'
    remediation: Turn debug on per environment (command-line flag or a dev profile), not in the shared configuration.
    remediation_zh: 按环境开启 debug（命令行参数或开发 profile），而不是写在共享配置中。
  - id: java-spring-datasource-password
    title: Service password written in Spring Boot configuration
    title_zh: 服务口令写在 Spring Boot 配置文件中
    severity: high
    confidence: medium
    cwe: CWE-798
    owasp: A07:2021
    languages: [yaml]
    flags: 'i'
    pathInclude: '{{SPRINGCONF}}'
    pathExclude: '{{TESTPATH}}|(?:^|/)application-(?:dev|local|test)\w{0,20}\.ya?ml$'
    pattern: '^\s*(?:[\w-]{1,60}\.){0,8}password\s*:\s*(?<secret>"[^"$\n]{4,200}"|\x27[^\x27$\n]{4,200}\x27|[^\s"\x27#$][^\s#]{3,200})\s*(?:#|$)'
    notPattern: 'password\s*:\s*["\x27]?(?:[^\s"\x27#]{0,40}(?:changeme|change-me|changeit|example|placeholder|dummy|xxx|your)|(?:password|secret)["\x27]?\s*(?:#|$)|<|ENC\(|\{cipher\})'
    redactEvidence: true
    message: A service password (database, Redis, RabbitMQ, mail and similar) is written in plain text in the Spring Boot configuration; everyone with the repository or the built jar has it.
    message_zh: 服务口令（数据库、Redis、RabbitMQ、邮件等）以明文写在 Spring Boot 配置中；任何拿到仓库或构建产物的人都能看到它。
    remediation: 'Reference an environment variable or secret store (password: ${DB_PASSWORD}), or encrypt it (Jasypt ENC(...)), and rotate the committed password.'
    remediation_zh: '引用环境变量或密钥存储（password: ${DB_PASSWORD}），或加密保存（Jasypt ENC(...)），并轮换已提交的口令。'
