version: 1
# Agent host configuration committed to a repository: permission bypass,
# auto-approval and over-broad tool grants in the settings files of Claude
# Code, Cursor, VS Code / GitHub Copilot, Gemini CLI, OpenCode, Zed and Aider,
# and the frontmatter of skills, commands and subagents.
# Written for code-audit (Apache-2.0).
#
# Engine notes:
# - Permission lists are matched structurally (withinKeys: [allow]) so an
#   entry under "deny" or "ask" is never read as a grant. Other JSON and all
#   Markdown are matched one physical line at a time.
# - .cursorrules, .windsurfrules, .clinerules and .rules are language
#   markdown, and Cursor .mdc rules too; .codex/config.toml is language toml
#   (matched line by line).
definitions:
  CLAUDE_SETTINGS: '(?:^|/)\.claude/settings(?:\.local)?\.json$'
  CURSOR_CLI: '(?:^|/)\.cursor/cli(?:-config)?\.json$'
  # Instruction, skill, command and subagent files that agent hosts load.
  INSTR: '(?:^|/)(?:CLAUDE(?:\.local)?|AGENTS(?:\.override)?|AGENT|GEMINI|SKILL|QWEN|CRUSH|WARP)\.md$|(?:^|/)(?:\.cursorrules|\.windsurfrules|\.clinerules|\.rules)$|(?:^|/)\.github/(?:copilot-instructions\.md|(?:instructions|prompts|agents|chatmodes)/.+\.md)$|(?:^|/)\.(?:claude|opencode|codex|agents|cursor|windsurf|clinerules|roo|kilocode|continue|kiro|junie|gemini|qwen|dsh|amazonq|augment|trae)/.+\.mdc?$|(?:^|/)plugins/[^/]+/(?:agents|commands|skills)/.+\.md$'
  # Subagent definitions.
  AGENTDEF: '(?:^|/)\.(?:claude|opencode|codex|cursor|kiro|dsh)/agents?/.+\.md$|(?:^|/)\.github/(?:agents|chatmodes)/.+\.md$|(?:^|/)plugins/[^/]+/agents/.+\.md$'
  # Multi-line deny/ask arrays: elements on their own lines cannot be told
  # apart from allow elements.
  NEG: '\b(?:never|not|don\x27t|do\s+not|must\s+not|mustn\x27t|should\s+not|shouldn\x27t|won\x27t|cannot|can\x27t|avoid|refuse)\b'
  # Code that is downloaded and executed (shell or interpreter).
  REMOTE_EXEC: '\b(?:curl|wget)\b[^|\n]{0,600}\|\s*(?:sudo\s+(?:-\S+\s+)?)?(?:(?:ba|z|da|k)?sh|python[23]?(?:\.\d+)?|node|perl|ruby|php)\b(?!\s+-[ceE]\b)|\b(?:(?:ba|z|da|k)?sh|python[23]?(?:\.\d+)?|node|perl|ruby|php)\s+(?:-\S+\s+)?<\(\s*(?:curl|wget)\b|\b(?:ba|z|da)?sh\s+-c\s+\\?[\"\x27]?\$\(\s*(?:curl|wget)\b|"-c"\s*,\s*"\$\(\s*(?:curl|wget)\b|\b(?:curl|wget)\b[^\n]{0,300}?\s(?:-o|-O|--output|--output-document)[=\s]{0,3}[\"\x27]?[^\s\"\x27;&|]{1,200}[^\n]{0,40}?(?:&&|;)\s*(?:chmod\s+\+x\s+\S{1,200}\s*(?:&&|;)\s*)?(?:sudo\s+)?(?:(?:ba|z|da|k)?sh|python[23]?(?:\.\d+)?|node|perl|ruby|php)\s+[\"\x27]?[\w./~$]|\b(?:iwr|irm|Invoke-WebRequest|Invoke-RestMethod)\b[^|\n]{0,300}\|\s*(?:iex|Invoke-Expression)\b'
rules:
  - id: agent-auto-approve
    title: Agent/MCP configuration auto-approves all permissions
    title_zh: Agent/MCP 配置自动批准全部权限
    severity: high
    confidence: high
    cwe: CWE-284
    owasp: A01:2021
    languages:
      - json
    pattern: '"(?:autoApprove|auto_approve|alwaysAllow|dangerouslySkipPermissions)"\s*:\s*(?:true|\["\*"\])|"\*"\s*:\s*"allow"'
    pathInclude: '(?:^|/)(?:\.mcp\.json|mcp\.json|cline_mcp_settings\.json|mcp_settings\.json|opencode\.jsonc?)$|{{CLAUDE_SETTINGS}}'
    group: agent-permission-allow-all
    message: Auto-approving every tool or command lets malicious prompts or supply-chain content execute directly.
    message_zh: 自动批准所有工具/命令会让恶意提示或供应链内容直接执行。
    remediation: Remove wildcard approvals, allowlist tools and commands, and keep human confirmation.
    remediation_zh: 移除通配批准，改为按工具与命令白名单审批，并保持人工确认。
    references:
      - CWE-284
      - OWASP A01:2021
  - id: agent-curl-sh
    title: Agent/MCP configuration contains curl | sh
    title_zh: Agent/MCP 配置包含 curl | sh
    severity: critical
    confidence: high
    cwe: CWE-829
    owasp: A08:2021
    languages:
      - json
    pattern: '{{REMOTE_EXEC}}'
    # Other MCP files: agent-mcp-remote-script; hook files: agent-hook-network-exec.
    pathInclude: '(?:^|/)(?:\.mcp\.json|opencode\.jsonc?)$'
    message: Executing a remote script from agent configuration is a severe supply-chain risk.
    message_zh: Agent 配置中直接执行远程脚本，存在严重供应链风险。
    remediation: Pin downloaded content and verify SHA256; never pipe remote scripts to a shell.
    remediation_zh: 固定下载内容并校验 SHA256，避免把远程脚本直接交给 shell。
    references:
      - CWE-829
      - OWASP A08:2021

  # ---- Claude Code / Cursor CLI permission settings ----
  - id: agent-claude-bypass-permissions
    title: Claude Code settings start in bypassPermissions mode
    title_zh: Claude Code 配置以 bypassPermissions 模式启动
    severity: high
    confidence: medium
    cwe: CWE-284
    owasp: A01:2021
    languages: [json]
    flags: ''
    pathInclude: '{{CLAUDE_SETTINGS}}'
    pattern: '"defaultMode"\s*:\s*"bypassPermissions"|"skipDangerousModePermissionPrompt"\s*:\s*true'
    message: A committed settings file asks Claude Code to run every tool without a permission prompt. Claude Code v2.1.257 and later ignore bypassPermissions from project and local settings, but earlier releases apply it from any settings file, so on those text in the repository can drive arbitrary commands.
    message_zh: 提交到仓库的配置要求 Claude Code 无需确认即可运行所有工具。Claude Code v2.1.257 及以后版本会忽略项目与本地配置中的 bypassPermissions，但更早的版本会从任何配置文件中应用它，此时仓库中的文本即可驱动任意命令。
    remediation: Remove defaultMode bypassPermissions and the prompt skip from project settings; use explicit allow rules and keep the default mode.
    remediation_zh: 从项目配置中删除 bypassPermissions 默认模式和提示跳过选项；使用显式 allow 规则并保持默认模式。
    references:
      - https://code.claude.com/docs/en/settings
  - id: agent-codex-bypass-approvals
    title: Codex project configuration turns off approvals or the sandbox
    title_zh: Codex 项目配置关闭了审批或沙箱
    severity: high
    confidence: medium
    cwe: CWE-284
    owasp: A01:2021
    languages: [toml]
    flags: ''
    pathInclude: '(?:^|/)\.codex/config\.toml$'
    pattern: '^\s*(?:approval_policy\s*=\s*["\x27]never["\x27]|sandbox_mode\s*=\s*["\x27]danger-full-access["\x27])'
    message: A committed .codex/config.toml sets approval_policy = "never" or sandbox_mode = "danger-full-access". When Codex loads the project configuration, it runs commands without asking and outside the sandbox, so text in the repository can drive arbitrary commands with the user's full rights.
    message_zh: 提交到仓库的 .codex/config.toml 设置了 approval_policy = "never" 或 sandbox_mode = "danger-full-access"。Codex 加载项目配置时会不经询问、在沙箱之外执行命令，仓库中的文本即可以用户的全部权限驱动任意命令。
    remediation: Remove these settings from the project configuration; keep approval and sandbox choices in the user's own ~/.codex/config.toml or on the command line.
    remediation_zh: 从项目配置中删除这些设置；审批与沙箱选项应放在用户自己的 ~/.codex/config.toml 或命令行中。
    references:
      - https://github.com/openai/codex/blob/main/docs/config.md
  - id: agent-claude-allow-unrestricted-shell
    title: Agent permission allow list grants every shell command
    title_zh: Agent 权限允许列表放行所有 shell 命令
    severity: high
    confidence: medium
    cwe: CWE-284
    owasp: A01:2021
    languages: [json]
    flags: ''
    pathInclude: '{{CLAUDE_SETTINGS}}|{{CURSOR_CLI}}'
    # Matched against each entry of a permissions "allow" list (the parsed
    # file), so the same entry under "deny" or "ask" is not a grant. If the
    # file does not parse, every line is matched and the scan warns.
    withinKeys: [allow]
    pattern: '^\s*"?(?:Bash|Shell)(?:\((?:\*|:\*|\*\*|\*:\*)\))?"?\s*,?\s*$'
    group: agent-shell-allow
    message: An allow rule of Bash / Bash(*) / Shell(*) lets the agent run any command without asking, so a prompt injection becomes command execution.
    message_zh: Bash / Bash(*) / Shell(*) 允许规则让 Agent 无需确认即可运行任意命令，提示注入即可变为命令执行。
    remediation: Allow only the specific commands the project needs (for example Bash(npm run test *)) and keep the rest behind a prompt.
    remediation_zh: 仅放行项目需要的具体命令（例如 Bash(npm run test *)），其余命令保持确认提示。
  - id: agent-claude-allow-dangerous-command
    title: Agent permission allow list grants a dangerous command with any arguments
    title_zh: Agent 权限允许列表放行任意参数的危险命令
    severity: high
    confidence: medium
    cwe: CWE-284
    owasp: A01:2021
    languages: [json]
    flags: ''
    pathInclude: '{{CLAUDE_SETTINGS}}|{{CURSOR_CLI}}'
    # Matched against each entry of a permissions "allow" list (the parsed
    # file), so the same entry under "deny" or "ask" is not a grant. If the
    # file does not parse, every line is matched and the scan warns.
    withinKeys: [allow]
    pattern: '^\s*"?(?:Bash|Shell)\((?:sudo|su|curl|wget|rm|bash|sh|zsh|eval|nc|ncat|ssh|scp|dd|chmod|chown)(?:\s+-[\w-]+){0,3}(?::\*|\s+\*|\s*\*)\)"?\s*,?\s*$'
    group: agent-shell-allow
    message: Pre-approving curl, wget, rm, sudo or a shell interpreter with any arguments lets the agent download, delete, escalate or run arbitrary code without a prompt.
    message_zh: 预先放行任意参数的 curl、wget、rm、sudo 或 shell 解释器，Agent 可无需确认地下载、删除、提权或执行任意代码。
    remediation: Remove the wildcard rule or narrow it to exact arguments; keep network, deletion and privilege commands behind a prompt or in deny.
    remediation_zh: 删除通配规则或收窄到确切参数；网络、删除与提权命令保持确认或放入 deny。
  - id: agent-claude-enable-all-mcp
    title: Claude Code settings enable every project MCP server
    title_zh: Claude Code 配置启用项目中的所有 MCP 服务器
    severity: medium
    confidence: high
    cwe: CWE-829
    owasp: A08:2021
    languages: [json]
    pathInclude: '{{CLAUDE_SETTINGS}}'
    pattern: '"enableAllProjectMcpServers"\s*:\s*true'
    message: Every server added to .mcp.json is started without an approval prompt, so a later change to .mcp.json runs new code on every developer machine.
    message_zh: 添加到 .mcp.json 的每个服务器都会在无确认的情况下启动，之后对 .mcp.json 的修改会在所有开发者机器上运行新代码。
    remediation: Remove enableAllProjectMcpServers and list approved servers by name in enabledMcpjsonServers.
    remediation_zh: 删除 enableAllProjectMcpServers，改为在 enabledMcpjsonServers 中按名称列出批准的服务器。
  - id: agent-claude-api-base-url
    title: Agent settings redirect the model API to another host
    title_zh: Agent 配置将模型 API 重定向到其他主机
    severity: high
    confidence: low
    kind: hotspot
    cwe: CWE-522
    owasp: A07:2021
    languages: [json]
    pathInclude: '{{CLAUDE_SETTINGS}}'
    pattern: '"(?:ANTHROPIC_BASE_URL|ANTHROPIC_BEDROCK_BASE_URL|ANTHROPIC_VERTEX_BASE_URL|ANTHROPIC_FOUNDRY_BASE_URL)"\s*:\s*"https?://(?!(?:api\.anthropic\.com|localhost|127\.0\.0\.1)(?:[:/"]))'
    message: A committed env block sends the API credentials and every prompt of each developer to this host; confirm it is the organisation's own gateway.
    message_zh: 提交的 env 配置会把每位开发者的 API 凭据与全部提示发送到该主机；需确认它是组织自己的网关。
    remediation: Keep API endpoints out of project settings (use managed or user settings) and remove unknown hosts.
    remediation_zh: 不要在项目配置中设置 API 端点（使用托管或用户配置），并删除未知主机。

  # ---- Other hosts ----
  - id: agent-host-auto-approve
    title: Agent host configuration auto-approves tool or terminal calls
    title_zh: Agent 宿主配置自动批准工具或终端调用
    severity: high
    confidence: medium
    cwe: CWE-284
    owasp: A01:2021
    languages: [json, yaml]
    pathInclude: '(?:^|/)(?:\.vscode/settings\.json|\.zed/settings\.json|\.gemini/settings\.json|\.aider\.conf\.ya?ml)$'
    pattern: '"chat\.tools\.(?:global\.)?autoApprove"\s*:\s*true|"chat\.tools\.terminal\.autoApprove"\s*:\s*\{\s*"/\.\*/[a-z]*"\s*:\s*true|"always_allow_tool_actions"\s*:\s*true|^\s*"default"\s*:\s*"allow"|"tool_permissions"\s*:\s*\{\s*"default"\s*:\s*"allow"|"allowed"\s*:\s*\[[^\]\n]{0,400}"run_shell_command"\s*[,\]]|^\s*yes-always\s*:\s*true\b'
    message: Workspace settings approve agent tool or shell calls without asking (VS Code chat.tools autoApprove, Zed always_allow_tool_actions or tool_permissions default allow, Gemini tools.allowed run_shell_command, Aider yes-always), so injected instructions run unattended.
    message_zh: 工作区配置无需确认即批准 Agent 工具或 shell 调用（VS Code chat.tools autoApprove、Zed always_allow_tool_actions 或 tool_permissions default allow、Gemini tools.allowed run_shell_command、Aider yes-always），注入的指令会无人值守地执行。
    remediation: Remove the auto-approval from the repository; approve tools per user and allowlist specific commands only.
    remediation_zh: 从仓库中删除自动批准设置；按用户批准工具，只放行特定命令。
    references:
      - CVE-2025-53773
  - id: agent-opencode-allow-all
    title: OpenCode configuration allows every shell command
    title_zh: OpenCode 配置放行所有 shell 命令
    severity: high
    confidence: medium
    cwe: CWE-284
    owasp: A01:2021
    languages: [json]
    pathInclude: '(?:^|/)opencode\.jsonc?$'
    pattern: '"permission"\s*:\s*"allow"|"(?:bash|shell|external_directory)"\s*:\s*"allow"|"(?:bash|shell)"\s*:\s*\{\s*"\*"\s*:\s*"allow"|"action"\s*:\s*"(?:\*|shell|bash)"\s*,\s*"resource"\s*:\s*"\*"\s*,\s*"effect"\s*:\s*"allow"'
    group: agent-permission-allow-all
    message: The project configuration lets OpenCode run any shell command (or touch directories outside the project) without asking.
    message_zh: 项目配置允许 OpenCode 无需确认即可运行任意 shell 命令（或访问项目外目录）。
    remediation: Set bash/shell to "ask" and allow only specific command patterns.
    remediation_zh: 将 bash/shell 设为 "ask"，只放行特定命令模式。

  # ---- Instruction files that tell the user or agent to bypass approvals ----
  - id: agent-disable-permissions
    title: Agent instructions tell the agent to bypass permission checks
    title_zh: Agent 指令要求绕过权限检查
    severity: high
    confidence: medium
    cwe: CWE-284
    owasp: A01:2021
    languages:
      - markdown
    # An imperative at the start of a sentence or list item. Launch flags
    # (--dangerously-skip-permissions and others) are agent-cli-permission-bypass-flag.
    pattern: '(?:^\s*|[.!:;]\s+)(?:[-*>]\s+|\d+[.)]\s+)?(?:please\s+|always\s+|you\s+(?:must|should)\s+)?(?:disable|bypass|turn\s+off|skip|circumvent|deactivate)\s+(?:(?:all|any|the|every|your)\s+){0,2}(?:permission|approval)s?(?:\s+(?:checks?|prompts?|requests?|dialogs?))?\b'
    notPattern: '{{NEG}}\s+(?:[\w\x27]+\s+){0,3}(?:disable|bypass|turn\s+off|skip|circumvent|deactivate)\b'
    pathInclude: '{{INSTR}}'
    group: agent-instr-bypass
    message: Documentation instructs the agent to bypass permission checks, allowing arbitrary tool execution.
    message_zh: 文档指示 Agent 绕过权限检查，可执行任意工具。
    remediation: Remove the instruction and keep human confirmation for privileged actions.
    remediation_zh: 删除该指令，并对特权操作保留人工确认。
    references:
      - CWE-284
      - OWASP A01:2021
  - id: agent-cli-permission-bypass-flag
    title: Agent instructions launch an agent CLI with approvals turned off
    title_zh: Agent 指令以关闭审批的方式启动 Agent CLI
    severity: high
    confidence: low
    kind: hotspot
    cwe: CWE-284
    owasp: A01:2021
    languages: [markdown]
    pattern: 'dangerously[- _]?skip[- _]?permissions|--dangerously-bypass-approvals-and-sandbox|--permission-mode[= ]bypassPermissions|--approval-mode[= ]yolo|\b(?:codex|gemini|qwen|copilot|cursor-agent)\b[^\n]{0,80}\s--yolo\b|\bcopilot\b[^\n]{0,80}\s--allow-all(?:-tools)?\b|\bcursor-agent\b[^\n]{0,80}\s(?:--force|-f)\b|--dangerously-allow-all\b|--skip-permissions-unsafe\b'
    notPattern: '{{NEG}}\s+(?:[\w\x27]+\s+){0,3}[\x60"\x27]?(?:claude|codex|gemini|qwen|copilot|cursor-agent|amp|droid|--)'
    pathInclude: '{{INSTR}}'
    message: The file tells the agent to start Claude Code, Codex, Gemini CLI, Copilot CLI, cursor-agent, Amp or Droid with every approval turned off; check that this only happens in a disposable sandbox.
    message_zh: 该文件要求 Agent 以关闭所有审批的方式启动 Claude Code、Codex、Gemini CLI、Copilot CLI、cursor-agent、Amp 或 Droid；需确认只在一次性沙箱中这样做。
    remediation: Run such sessions only in an isolated container or VM, or drop the flag and allowlist the needed commands.
    remediation_zh: 只在隔离的容器或虚拟机中运行此类会话，或去掉该参数并放行所需命令。

  # ---- Skills, commands and subagents ----
  - id: agent-skill-unrestricted-bash
    title: Skill or command pre-approves unrestricted Bash
    title_zh: Skill 或命令预先批准不受限的 Bash
    severity: medium
    confidence: low
    kind: hotspot
    cwe: CWE-250
    owasp: A01:2021
    languages: [markdown]
    pathInclude: '{{INSTR}}|(?:^|/)commands/[^/]+\.md$'
    pattern: '^\s*allowed[-_]tools\s*:[^\n]{0,400}?(?<![\w(])Bash(?:\((?:\*|:\*|\*\*)\))?(?![\w(])'
    message: allowed-tools grants Bash with any arguments for the turn that runs this skill or command (Claude Code applies a project skill's grant even in an untrusted folder); check what the skill runs.
    message_zh: allowed-tools 在运行该 skill/命令的回合中放行任意参数的 Bash（Claude Code 即使在未信任目录中也会应用项目 skill 的授权）；需检查它运行的内容。
    remediation: Narrow allowed-tools to the exact commands, for example Bash(git status *).
    remediation_zh: 将 allowed-tools 收窄到确切命令，例如 Bash(git status *)。
  - id: agent-agent-all-tools
    title: Subagent definition grants every tool
    title_zh: 子 Agent 定义授予全部工具
    severity: medium
    confidence: low
    kind: hotspot
    cwe: CWE-250
    owasp: A01:2021
    languages: [markdown]
    pathInclude: '{{AGENTDEF}}'
    pattern: '^\s*(?:tools|allowed[-_]tools)\s*:\s*(?:["\x27]?\*["\x27]?|\[\s*["\x27]\*["\x27]\s*\])\s*$'
    message: The subagent may use every tool, including shell, network and MCP tools; check whether its task needs them.
    message_zh: 该子 Agent 可使用全部工具（包括 shell、网络和 MCP 工具）；需确认其任务是否需要。
    remediation: List only the tools the subagent needs.
    remediation_zh: 只列出子 Agent 需要的工具。
  - id: agent-skill-shell-arguments
    title: Command pre-executes a shell line with user arguments
    title_zh: 命令在预执行 shell 行中使用用户参数
    severity: high
    confidence: low
    kind: hotspot
    cwe: CWE-78
    owasp: A03:2021
    languages: [markdown]
    pathInclude: '{{INSTR}}|(?:^|/)commands/[^/]+\.md$'
    pathExclude: '(?:^|/)(?:references?|examples?|docs?)/'
    notPattern: '\x27\{[^\x27\n]{0,200}\$\d'
    pattern: '(?:^|\s)!\x60[^\x60\n]{0,300}?\$(?:ARGUMENTS\b|\{ARGUMENTS|\d\b|\{\d)'
    message: The "!`...`" line runs in a shell, without a permission prompt, before the model sees the command; if the argument text reaches it (for example when the model invokes the skill with text taken from repository content), ; $( ) or a closing quote runs extra commands. Check how the host substitutes arguments.
    message_zh: 预执行行 "!`...`" 在模型看到命令之前、无需权限确认即在 shell 中执行；若参数文本进入该行（例如模型用取自仓库内容的文本调用 skill），; $( ) 或闭合引号会执行额外命令。需确认宿主如何代入参数。
    remediation: Do not put $ARGUMENTS or $N into "!`...`" pre-execution; let the model run the command with the argument through the normal permission flow.
    remediation_zh: 不要把 $ARGUMENTS 或 $N 放入 "!`...`" 预执行；让模型通过正常的权限流程带参数运行命令。
