version: 1
# Instruction files that coding agents load as context: CLAUDE.md, AGENTS.md,
# GEMINI.md, SKILL.md, Copilot instructions and prompt files, and the rule,
# command and agent directories of Claude Code, OpenCode, Codex, Cursor,
# Windsurf, Cline, Roo, Kilo, Continue and Kiro.
# Written for code-audit (Apache-2.0).
#
# Precision: these files often DISCUSS prompt injection (security skills,
# reviewer agents). The patterns require imperative wording and the
# notPatterns drop lines that quote, negate or describe the phrase. READMEs
# and docs/ are not instruction files and are never matched.
# Not covered: .cursorrules, .windsurfrules and Cursor .mdc rules have no
# language in the inventory and are not read by the rule engine.
definitions:
  INSTR: '(?:^|/)(?:AGENTS?|SKILL|CLAUDE|GEMINI)[\w.-]*\.md$|(?:^|/)\.github/(?:copilot-instructions\.md|(?:instructions|prompts|agents|chatmodes)/.+\.md)$|(?:^|/)\.(?:claude|opencode|codex|agents|cursor|windsurf|clinerules|roo|kilocode|continue|kiro|junie|gemini|dsh)/.+\.md$|(?:^|/)plugins/[^/]+/(?:agents|commands|skills)/.+\.md$'
  NEG: '\b(?:never|not|don\x27t|do\s+not|must\s+not|mustn\x27t|should\s+not|shouldn\x27t|won\x27t|cannot|can\x27t|avoid|refuse|prevent\w*|block\w*|detect\w*|flag\w*|report\w*|reject\w*)\b'
  # Words that introduce a description or a quotation rather than a command.
  DISCUSS: '\b(?:such\s+as|e\.g\.|for\s+example|like|phrases?|patterns?|attacks?|attackers?|injections?|attempts?|payloads?|malicious|watch\s+for|beware|treat|contain\w*|says?|saying|text|strings?|tells?\s+you\s+to|asks?\s+(?:you\s+)?to|tries\s+to|trying\s+to|could|might|may|would|if\s+(?:a|the|any)\b)\b'
  QUOTE: '["\x27\x60“‘«]'
  IGNORE_PHRASE: '\b(?:ignore|disregard|forget|override)\s+(?:all\s+|any\s+)?(?:(?:of\s+)?(?:the|your|my)\s+)?(?:previous|prior|above|preceding|earlier|original|system)\s+(?:instructions?|prompts?|rules|directives|guidelines)\b'
  # Well-known vendor installers that are documented as curl | sh.
  KNOWN_INSTALLER: 'https://(?:sh\.rustup\.rs|astral\.sh/|get\.docker\.com|raw\.githubusercontent\.com/(?:Homebrew|nvm-sh)/|deno\.land/|bun\.sh/|get\.pnpm\.io|install\.python-poetry\.org|ollama\.com/install|foundry\.paradigm\.xyz|get\.helm\.sh|tailscale\.com/install|fly\.io/install|cli\.github\.com|sdk\.cloud\.google\.com|pyenv\.run|get\.sdkman\.io|starship\.rs/install|install\.determinate\.systems|nixos\.org/nix/install|claude\.ai/install|opencode\.ai/install|mise\.run)'
  SEND_VERB: '\b(?:send|upload|post|exfiltrate|transmit|forward|email|leak|pipe)\b'
rules:
  - id: prompt-injection-ignore
    title: Prompt-injection instruction in repository documentation
    title_zh: 文档中出现提示注入指令
    severity: high
    confidence: medium
    cwe: CWE-94
    owasp: A03:2021
    languages:
      - markdown
    pattern: '{{IGNORE_PHRASE}}'
    notPattern: '^\s*(?:[-*>]\s*)?{{QUOTE}}|{{QUOTE}}\s*(?:ignore|disregard|forget|override)\s|{{DISCUSS}}[^\n]{0,60}?{{IGNORE_PHRASE}}|{{NEG}}\s+(?:\w+\s+){0,2}(?:ignore|disregard|forget|override)\b'
    pathInclude: '{{INSTR}}'
    message: Instructions in repository docs can manipulate the auditing agent and must be treated as untrusted data.
    message_zh: 代码库文档中的指令可能操纵审计 Agent，应作为不可信数据处理。
    remediation: Never execute instructions found in the repository; isolate untrusted content in the audit workflow and record it as suspicious text.
    remediation_zh: 不执行仓库中的指令；在审计工作流中隔离不可信内容并记录为可疑文本。
    references:
      - CWE-94
      - OWASP A03:2021
  - id: prompt-injection-exfil
    title: Data-exfiltration instruction in repository documentation
    title_zh: 文档中出现数据外传指令
    severity: high
    confidence: medium
    cwe: CWE-200
    owasp: A01:2021
    languages:
      - markdown
    pattern: '{{SEND_VERB}}\s+(?:(?:all|every|any|the|their|your|its|these|those|of)\s+){0,3}(?:[\w.-]+\s+){0,2}?(?:secrets?|credentials?|api[ _-]?keys?|access[ _-]?tokens?|tokens|passwords?|private[ _-]?keys?|ssh[ _-]?keys?|\.env(?:\s+files?)?|env(?:ironment)?\s+(?:variables|vars)|cookies|session[ _-]?tokens?)\b[^\n]{0,120}?\b(?:to|at|into|via)\s+(?:https?://|ftp://|\S+@\S+\.\w+|(?:the|this|my|our)\s+(?:url|endpoint|server|webhook|address))'
    notPattern: '{{NEG}}[^\n]{0,60}?{{SEND_VERB}}|{{DISCUSS}}[^\n]{0,40}?{{SEND_VERB}}'
    pathInclude: '{{INSTR}}'
    message: Documentation asks to send secrets or credentials out, a common prompt-injection and supply-chain pattern.
    message_zh: 文档要求外传密钥或凭据，是典型的提示注入/供应链攻击特征。
    remediation: Do not follow the instruction; remove or quarantine the document and review its origin.
    remediation_zh: 不要执行该指令；删除或隔离相关文档，并审查其来源。
    references:
      - CWE-200
      - OWASP A01:2021
  - id: agent-exfil-env
    title: Agent instructions ask to exfiltrate environment variables
    title_zh: Agent 指令要求外传环境变量
    severity: high
    confidence: low
    cwe: CWE-200
    owasp: A01:2021
    languages:
      - markdown
    pattern: '\$\(\s*(?:env|printenv)\s*\)|\b(?:printenv|env)\s*\|\s*(?:curl|wget|nc|base64)\b|\bcurl\b[^\n]{0,200}\s(?:-d|--data(?:-binary|-raw|-urlencode)?|-F|--form|-T|--upload-file)\s+["\x27]?(?:[\w-]+=)?@?(?:\.env\b|~/\.|\$HOME/\.)|(?:\benv(?:ironment)?\s+(?:variables|vars)|\.env\b|process\.env|os\.environ)\b[^.\n]{0,60}\b(?:send|upload|post|exfiltrate|transmit|forward|curl)\b[^\n]{0,80}https?://|\b(?:send|upload|post|exfiltrate|transmit|forward)\b[^.\n]{0,60}(?:\benv(?:ironment)?\s+(?:variables|vars)|\.env\b|process\.env|os\.environ)[^\n]{0,80}https?://'
    notPattern: '{{NEG}}[^\n]{0,60}?(?:send|upload|post|exfiltrat|transmit|forward|curl)|{{DISCUSS}}[^\n]{0,40}?(?:send|upload|post|exfiltrat|transmit|forward)'
    pathInclude: '{{INSTR}}'
    message: Documentation asks to send environment variables or secrets out, a common prompt-injection and supply-chain pattern.
    message_zh: 文档要求外传环境变量或密钥，是典型的提示注入/供应链攻击特征。
    remediation: Do not follow the instruction; remove or quarantine the document and review its origin.
    remediation_zh: 不要执行该指令；删除或隔离相关文档，并审查其来源。
    references:
      - CWE-200
      - OWASP A01:2021

  - id: prompt-injection-hidden-unicode
    title: Invisible Unicode characters in an agent instruction file
    title_zh: Agent 指令文件中含不可见 Unicode 字符
    severity: high
    confidence: medium
    cwe: CWE-1007
    owasp: A03:2021
    languages: [markdown]
    flags: ''
    # Unicode tag characters (U+E0000-E007F, as surrogate pairs) except inside
    # a subdivision flag emoji; bidi embedding/override/isolate controls; and
    # runs of three or more zero-width characters. A single zero-width joiner
    # (emoji sequences) or non-joiner (Persian text) is not matched.
    pattern: '(?<!🏴(?:\uDB40[\uDC00-\uDC7F]){0,8})\uDB40[\uDC00-\uDC7F](?:\uDB40[\uDC00-\uDC7F])+|[‪-‮⁦-⁩]|[​‌‍⁠⁡⁢⁣⁤﻿]{3,}'
    pathInclude: '{{INSTR}}'
    message: The file contains characters that editors and diffs do not show but the model reads (ASCII smuggling with tag characters, bidi overrides, zero-width encodings), a known way to hide instructions from reviewers.
    message_zh: 文件包含编辑器和 diff 不显示、但模型会读取的字符（标签字符 ASCII 走私、双向覆盖、零宽编码），这是向审阅者隐藏指令的已知手法。
    remediation: Decode the characters (for example with a Unicode inspector), remove them, and review where the file came from.
    remediation_zh: 解码这些字符（例如用 Unicode 检查工具），删除它们，并审查文件来源。
  - id: prompt-injection-html-comment
    title: Hidden HTML comment gives the agent instructions
    title_zh: 隐藏的 HTML 注释向 Agent 下达指令
    severity: high
    confidence: medium
    cwe: CWE-94
    owasp: A03:2021
    languages: [markdown]
    pattern: '<!--(?:(?!-->)[^\n]){0,400}?(?:\b(?:ignore|disregard|forget)\s+(?:\w+\s+){0,3}(?:instructions?|rules|prompts?)\b|\b(?:do\s+not|don\x27t|never)\s+(?:tell|inform|mention|reveal|show)\b|\bwithout\s+(?:telling|informing|asking|notifying)\b|\b(?:AI|assistant|agent|model|LLM|Claude|Copilot|Cursor|Codex|Gemini)\b[,:]?\s+(?:you\s+)?(?:must|should|need\s+to|have\s+to|will|please)\s+(?:now\s+|also\s+|first\s+|always\s+)?(?:run|execute|send|upload|read|fetch|download|install|curl|delete|remove|add|insert|include|call|open|post)\b|\b(?:run|execute)\s+(?:the\s+following|this)\s+(?:command|script)\b|\bcurl\s|\bwget\s)'
    pathInclude: '{{INSTR}}'
    message: An HTML comment is invisible in rendered Markdown but the agent reads it, and this one addresses the agent with an instruction.
    message_zh: HTML 注释在渲染后的 Markdown 中不可见，但 Agent 会读取；该注释包含给 Agent 的指令。
    remediation: Remove the comment and review the change that added it; instructions for agents must be visible to reviewers.
    remediation_zh: 删除该注释并审查添加它的变更；给 Agent 的指令必须对审阅者可见。
  - id: prompt-injection-conceal
    title: Instruction tells the agent to hide actions from the user
    title_zh: 指令要求 Agent 向用户隐瞒操作
    severity: high
    confidence: medium
    cwe: CWE-94
    owasp: A03:2021
    languages: [markdown]
    pattern: '\b(?:do\s+not|don\x27t|never)\s+(?:tell|inform|notify|alert|warn|show)\s+(?:the\s+)?(?:user|human|developer|operator)\s+(?:about\s+(?:this|these|the)\s+(?:step|instruction|change|command|request|action|file)s?|what\s+you(?:\x27re|\s+are|\s+have)?\s+(?:doing|done|did|run|ran)|that\s+you\s+(?:ran|run|executed|sent|uploaded|read|accessed|modified|installed|downloaded))\b|\bwithout\s+(?:telling|informing|notifying|alerting)\s+(?:the\s+)?(?:user|human|developer)\b|\b(?:hide|conceal)\s+(?:this|it|these\s+\w+|the\s+\w+|your\s+\w+)\s+from\s+(?:the\s+)?(?:user|human|developer|reviewer)s?\b|\b(?:silently|secretly|covertly)\s+(?:run|execute|send|upload|install|download|curl|post|exfiltrate|copy|read|insert|modify|delete)\b'
    notPattern: '^\s*(?:[-*>]\s*)?{{QUOTE}}|{{NEG}}[^\n]{0,80}?\bwithout\s+(?:telling|informing|notifying|alerting)|{{DISCUSS}}[^\n]{0,40}?(?:tell|inform|hide|conceal|silently|secretly|covertly|without)'
    pathInclude: '{{INSTR}}'
    message: The file tells the agent to keep its actions from the user, which only serves an attacker who planted the instruction.
    message_zh: 该文件要求 Agent 对用户隐瞒其操作，这只对植入该指令的攻击者有利。
    remediation: Remove the instruction and review the file's history and every action an agent took while it was present.
    remediation_zh: 删除该指令，审查文件历史以及该指令存在期间 Agent 执行的所有操作。
  - id: prompt-injection-disable-safety
    title: Instruction tells the agent to disable safety or security checks
    title_zh: 指令要求 Agent 关闭安全检查
    severity: high
    confidence: medium
    cwe: CWE-94
    owasp: A03:2021
    languages: [markdown]
    pattern: '\b(?:disable|turn\s+off|bypass|circumvent|ignore|skip|deactivate)\s+(?:(?:all|any|the|your|every)\s+){0,2}(?:safety|security|content|permission|approval|confirmation)\s+(?:checks?|guardrails?|filters?|restrictions?|guidelines|policies|prompts?|measures|protections?|rules|dialogs?)\b|\byou\s+are\s+(?:now\s+)?(?:in\s+)?(?:DAN|developer\s+mode|god\s+mode|jailbreak\s+mode|unrestricted\s+mode|jailbroken)\b|\byou\s+(?:have|has)\s+no\s+(?:restrictions|limitations|guardrails|safety\s+guidelines)\b'
    notPattern: '^\s*(?:[-*>]\s*)?{{QUOTE}}|{{NEG}}\s+(?:\w+\s+){0,3}(?:disable|turn\s+off|bypass|circumvent|ignore|skip|deactivate)\b|{{DISCUSS}}[^\n]{0,40}?(?:disable|turn\s+off|bypass|circumvent|ignore|skip|deactivate|you\s+are|you\s+have)|\b(?:if|unless|when)\s+(?:you\s+)?(?:need|must|have)\s+to\b'
    pathInclude: '{{INSTR}}'
    group: agent-instr-bypass
    message: The file tells the agent to switch off safety, security or approval checks, a jailbreak pattern that makes later injected instructions effective.
    message_zh: 该文件要求 Agent 关闭安全、防护或审批检查，这是一种越狱模式，会让后续注入的指令生效。
    remediation: Remove the instruction; safety and approval checks must not be configurable from repository text.
    remediation_zh: 删除该指令；安全与审批检查不应由仓库文本控制。
  - id: prompt-injection-read-credentials
    title: Instruction tells the agent to read credential files
    title_zh: 指令要求 Agent 读取凭据文件
    severity: high
    confidence: medium
    cwe: CWE-200
    owasp: A01:2021
    languages: [markdown]
    pattern: '\b(?:cat|less|more|head|tail|read|open|print|dump|copy|cp|scp|send|upload|include|base64|attach|exfiltrate|collect|grab|steal|tar\s+-?c\w*|zip\s+-r\w*)\s+(?:-\S+\s+){0,3}(?:(?:the|your|all|every)\s+)?(?:(?:contents?|files?)\s+(?:of|in)\s+)?(?:[\w.-]+\s+)?["\x27\x60]?(?:~|\$HOME|\$\{HOME\}|%USERPROFILE%|/home/[\w.-]+|/Users/[\w.-]+|/root)[/\\]\.(?:ssh(?:[/\\](?!authorized_keys|known_hosts)(?:id_\w+|[\w.-]*_key\w*))?(?![\w/\\.-])|aws[/\\]credentials\b|netrc\b|npmrc\b|pypirc\b|git-credentials\b|config[/\\]gh[/\\]hosts\.yml|docker[/\\]config\.json|kube[/\\]config\b|gnupg\b)|\bsecurity\s+find-(?:generic|internet)-password\b'
    notPattern: '{{NEG}}[^\n]{0,60}?(?:cat|read|open|print|dump|copy|send|upload|include|access|touch)\b|\b(?:Read|Edit|Write|Bash)\((?:~|\$HOME|/)|\bdeny\b|{{DISCUSS}}[^\n]{0,40}?(?:cat|read|open|print|dump|copy|send|upload)\b'
    pathInclude: '{{INSTR}}'
    message: The file tells the agent to read SSH keys, cloud or registry credentials, or the keychain, which an agent has no reason to do for a coding task.
    message_zh: 该文件要求 Agent 读取 SSH 密钥、云或注册表凭据或钥匙串，编码任务没有理由这样做。
    remediation: Remove the instruction, deny Read on credential paths in the agent settings, and review the file's origin.
    remediation_zh: 删除该指令，在 Agent 配置中拒绝读取凭据路径，并审查文件来源。
  - id: prompt-injection-decode-exec
    title: Instruction or command decodes and executes an encoded payload
    title_zh: 指令或命令解码并执行编码载荷
    severity: high
    confidence: medium
    cwe: CWE-506
    owasp: A08:2021
    languages: [markdown, json]
    pattern: '\bbase64\s+(?:-d|--decode|-D)\b[^\n]{0,200}?\|\s*(?:sudo\s+)?(?:ba|z|da)?sh\b|\b(?:eval|exec)\s*(?:\(\s*)?["\x27]?\$\(\s*(?:echo|printf)\s+\S{1,4000}\s*\|\s*base64\s+(?:-d|--decode|-D)|\bexec\s*\(\s*(?:base64\.b64decode|__import__\(\s*["\x27]base64)|\bdecode\b[^.\n]{0,60}\bbase64\b[^.\n]{0,60}\b(?:and|then)\s+(?:execute|run|eval|follow|obey)\b|\bbase64\b[^.\n]{0,60}\bdecode\b[^.\n]{0,40}\b(?:and|then)\s+(?:execute|run|eval|follow|obey)\b'
    notPattern: '{{NEG}}[^\n]{0,60}?(?:decode|eval|exec|base64)|{{DISCUSS}}[^\n]{0,40}?(?:decode|eval|exec|base64)'
    pathInclude: '{{INSTR}}|(?:^|/)(?:\.mcp\.json|mcp\.json|opencode\.jsonc?|hooks?\.json)$|(?:^|/)\.(?:claude|gemini|cursor)/settings(?:\.local)?\.json$'
    message: An encoded payload is decoded and executed (or the agent is told to decode and follow it), which hides what actually runs from review.
    message_zh: 编码载荷被解码并执行（或要求 Agent 解码后照做），这会向审阅者隐藏实际运行的内容。
    remediation: Remove the payload; commands and instructions must be readable in plain text.
    remediation_zh: 删除该载荷；命令与指令必须以明文可读。
  - id: prompt-injection-auto-approve
    title: Instruction tells the agent to approve or run commands without asking
    title_zh: 指令要求 Agent 不经询问即批准或运行命令
    severity: medium
    confidence: medium
    cwe: CWE-284
    owasp: A01:2021
    languages: [markdown]
    pattern: '\b(?:always|automatically|auto-?)\s*(?:approve|accept|allow|confirm|say\s+yes\s+to)\s+(?:all|every|any)\s+(?:\w+\s+)?(?:tools?|tool\s+calls?|commands?|permissions?(?:\s+requests?)?|permission\s+prompts?|shell\s+commands?)\b|\b(?:run|execute)\s+(?:all\s+|any\s+)?(?:shell\s+|terminal\s+|bash\s+)?commands?\s+without\s+(?:asking|confirmation|approval|permission|prompting)\b|\b(?:never|do\s+not|don\x27t)\s+ask\s+(?:the\s+user\s+)?(?:for\s+)?(?:permission|confirmation|approval)\s+(?:before|to)\s+(?:run|execut|install|delet|push|deploy|download)'
    notPattern: '\b(?:never|not|don\x27t|do\s+not|avoid)\s+(?:\w+\s+){0,2}(?:auto-?approv|always\s+(?:approve|accept|allow)|run|execute)\b|{{DISCUSS}}[^\n]{0,40}?(?:approve|accept|allow|run|execute|ask)'
    pathInclude: '{{INSTR}}'
    message: The file tells the agent to skip the user's approval for tools or commands, so anything injected later runs unattended.
    message_zh: 该文件要求 Agent 跳过用户对工具或命令的审批，之后注入的任何内容都会无人值守地运行。
    remediation: Remove the instruction; approvals belong in the user's own settings, not in repository text.
    remediation_zh: 删除该指令；审批应由用户自己的设置决定，而不是仓库文本。
  - id: prompt-injection-paste-url
    title: Agent instruction file points at a paste site, tunnel or request collector
    title_zh: Agent 指令文件指向粘贴站、隧道或请求收集服务
    severity: medium
    confidence: medium
    cwe: CWE-829
    owasp: A08:2021
    languages: [markdown]
    pattern: '\bhttps?://(?:[\w-]+\.)*(?:pastebin\.com|paste\.ee|hastebin\.com|ghostbin\.\w+|rentry\.(?:co|org)|dpaste\.(?:com|org)|termbin\.com|ix\.io|0x0\.st|transfer\.sh|file\.io|webhook\.site|requestbin\.(?:com|net)|pipedream\.net|ngrok(?:-free)?\.(?:io|app|dev)|trycloudflare\.com|interact\.sh|oast\.(?:fun|live|me|online|pro|site)|burpcollaborator\.net|canarytokens\.com)\b|\bhttps?://(?:discord(?:app)?\.com/api/webhooks|hooks\.slack\.com/services)/|\bhttps?://(?!(?:127|10|0)\.|192\.168\.|169\.254\.|172\.(?:1[6-9]|2\d|3[01])\.|192\.0\.2\.|198\.51\.100\.|203\.0\.113\.)\d{1,3}(?:\.\d{1,3}){3}\b'
    pathInclude: '{{INSTR}}'
    message: Agent instructions reference a paste site, tunnel, request collector, chat webhook or raw IP address, the usual places to fetch hidden payloads from or send stolen data to.
    message_zh: Agent 指令引用了粘贴站、隧道、请求收集服务、聊天 webhook 或裸 IP 地址，这些通常用于获取隐藏载荷或接收被窃数据。
    remediation: Remove the URL or replace it with a reviewed, versioned source; check what the agent fetched or sent there.
    remediation_zh: 删除该 URL 或替换为经过审查的版本化来源；检查 Agent 曾从该处获取或向其发送的内容。
  - id: agent-instructions-pipe-to-shell
    title: Agent instruction file pipes a download into a shell
    title_zh: Agent 指令文件将下载内容直接交给 shell
    severity: high
    confidence: low
    kind: hotspot
    cwe: CWE-829
    owasp: A08:2021
    languages: [markdown]
    pattern: '\b(?:curl|wget)\b[^|\n]{0,300}?(?:https?://|\$\{?\w)[^|\n]{0,300}\|\s*(?:sudo\s+)?(?:ba|z|da)?sh\b|\b(?:ba)?sh\s+<\(\s*(?:curl|wget)\b|\b(?:iwr|irm|Invoke-WebRequest|Invoke-RestMethod)\b[^|\n]{0,300}\|\s*iex\b'
    notPattern: '{{KNOWN_INSTALLER}}'
    pathInclude: '{{INSTR}}'
    message: The agent is told to run a remote script without review; check that the URL is the vendor's official installer and that the step is needed.
    message_zh: Agent 被要求不经审查运行远程脚本；需确认该 URL 是供应商官方安装脚本且该步骤确有必要。
    remediation: Prefer a package manager or a pinned, checksum-verified download; never pipe an unknown URL to a shell.
    remediation_zh: 优先使用包管理器或固定版本并校验哈希的下载；不要把未知 URL 交给 shell。
