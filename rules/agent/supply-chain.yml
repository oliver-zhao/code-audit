version: 1
# Agent supply chain: MCP server definitions and agent hooks.
# Written for code-audit (Apache-2.0). JSON and YAML are matched one physical
# line at a time; a server whose "command" and "args" sit on different lines
# is only partly visible to a rule (see the notes on each rule).
definitions:
  # MCP server definitions of Claude Code, Cursor, VS Code, Cline, Roo, Kilo,
  # Windsurf, Claude Desktop, OpenCode, Gemini CLI, Zed and Continue.
  # mcp-supply.json is the name of the bundled fixture.
  MCP_JSON: '(?:^|/)(?:\.mcp\.json|mcp\.json|mcp_config\.json|mcp_settings\.json|cline_mcp_settings\.json|claude_desktop_config\.json|mcp-supply\.json|opencode\.jsonc?|gemini-extension\.json)$|(?:^|/)\.(?:gemini|zed)/settings\.json$|(?:^|/)\.continue/mcpServers/[^/]+\.json$'
  MCP_YAML: '(?:^|/)\.continue/(?:config\.ya?ml|mcpServers/[^/]+\.ya?ml)$'
  MCP: '{{MCP_JSON}}|{{MCP_YAML}}'
  # Files that hold hook commands.
  HOOKS: '(?:^|/)\.claude/settings(?:\.local)?\.json$|(?:^|/)hooks?\.json$|(?:^|/)\.github/hooks/[^/]+\.json$'
  LOCALHOST: '(?:localhost|127\.\d{1,3}\.\d{1,3}\.\d{1,3}|\[::1\]|0\.0\.0\.0|host\.docker\.internal)(?:[:/"\x27\s]|$)'
  PLACEHOLDER: '(?:your|xxx|<|\.\.\.|example|placeholder|changeme|change[-_]me|replace|dummy|redacted|insert|todo|fake|\*\*\*)'
rules:
  - id: agent-mcp-remote-script
    title: MCP server config runs a remote script
    title_zh: MCP 服务器配置执行远程脚本
    severity: critical
    confidence: high
    cwe: CWE-829
    owasp: A08:2021
    languages: [json, yaml]
    pattern: '(?:curl|wget)[^|\n]{0,600}\|\s*(?:sudo\s+)?(?:ba|z|da)?sh\b|\b(?:ba)?sh\s+<\(\s*(?:curl|wget)\b|\b(?:iwr|irm|Invoke-WebRequest|Invoke-RestMethod)\b[^|\n]{0,300}\|\s*iex\b'
    # .mcp.json and opencode.json: agent-curl-sh.
    pathInclude: '{{MCP}}'
    pathExclude: '(?:^|/)(?:\.mcp\.json|opencode\.jsonc?)$'
    message: An MCP server pipes a remote script straight into a shell, a severe supply-chain risk.
    message_zh: MCP 服务器把远程脚本直接交给 shell 执行，存在严重供应链风险。
    remediation: Pin downloaded content and verify SHA256; never pipe remote scripts to a shell.
    remediation_zh: 固定下载内容并校验 SHA256；不要把远程脚本直接交给 shell。
    references:
      - CWE-829
      - OWASP A08:2021
  - id: agent-mcp-unpinned-npx
    title: MCP server config runs an unpinned package
    title_zh: MCP 服务器配置运行未固定版本的包
    severity: medium
    confidence: low
    kind: hotspot
    cwe: CWE-829
    owasp: A08:2021
    languages: [json, yaml]
    # Matches an inline command ("npx -y pkg", "uvx pkg") and an args array that
    # starts with -y on the same line. Multi-line args arrays are not seen.
    pattern: '\b(?:npx|bunx|pnpm\s+dlx|yarn\s+dlx)\s+(?:-(?:y|-yes)\s+)(?!-)(?:@[\w.-]+/)?[\w.-]+(?:@latest)?(?=["\x27\s,\]]|$)|\buvx\s+(?!-)[\w.-]+(?:@latest)?(?=["\x27\s,\]]|$)|["\x27]?args["\x27]?\s*:\s*\[\s*(?:["\x27](?:-y|--yes)["\x27]\s*,\s*)(?:["\x27]-{1,2}[\w-]+["\x27]\s*,\s*){0,2}["\x27](?:@[\w.-]+/)?[\w.-]+(?:@latest)?["\x27]\s*[,\]]|"command"\s*:\s*"(?:uvx|npx|bunx)"\s*,\s*"args"\s*:\s*\[\s*(?:"-{1,2}[\w-]+"\s*,\s*){0,3}"(?!-)(?:@[\w.-]+/)?[\w.-]+(?:@latest)?"\s*[,\]]'
    pathInclude: '{{MCP}}'
    message: An MCP server runs a registry package without a pinned version (or with @latest), so each start can fetch different code.
    message_zh: MCP 服务器运行未固定版本（或 @latest）的注册表包，每次启动都可能获取不同的代码。
    remediation: Pin the package to an exact version (pkg@1.2.3, uvx pkg==1.2.3) and verify its integrity.
    remediation_zh: 将包固定到精确版本（pkg@1.2.3、uvx pkg==1.2.3）并校验完整性。
    references:
      - CWE-829
      - OWASP A08:2021
  - id: agent-mcp-inline-secret
    title: MCP or agent config has an inline secret
    title_zh: MCP/Agent 配置包含内联密钥
    severity: high
    confidence: medium
    cwe: CWE-798
    owasp: A07:2021
    languages: [json, yaml]
    # Only fields whose name says credential, and Authorization headers. The
    # value must contain a digit; ${VAR}, {env:VAR} and ${input:x} references
    # never match.
    pattern: '(?:["\x27]?[\w-]{0,40}(?:api[_-]?key|apikey|token|secret|password|passwd|access[_-]?key|client[_-]?secret)["\x27]?\s*:\s*["\x27]?|["\x27]?authorization["\x27]?\s*:\s*["\x27](?:Bearer|Basic|token)\s+)(?<secret>(?=[A-Za-z_\-./+=]{0,200}\d)[A-Za-z0-9_\-+=][A-Za-z0-9_\-./+=]{11,})(?:["\x27]|\s*$|\s+#)'
    notPattern: '{{PLACEHOLDER}}'
    redactEvidence: true
    pathInclude: '{{MCP}}|(?:^|/)\.claude/settings(?:\.local)?\.json$|(?:^|/)\.aider\.conf\.ya?ml$'
    message: A credential is embedded in an MCP/agent config file, exposing it to anyone who reads the repository.
    message_zh: MCP/Agent 配置文件中内联了凭据，任何能读取仓库的人都能获取。
    remediation: Reference the secret from an environment variable or a secrets manager.
    remediation_zh: 通过环境变量或密钥管理器引用凭据。
    references:
      - CWE-798
      - OWASP A07:2021
  - id: agent-mcp-git-source
    title: MCP server runs code from a git URL or gist
    title_zh: MCP 服务器运行来自 git URL 或 gist 的代码
    severity: medium
    confidence: medium
    cwe: CWE-494
    owasp: A08:2021
    languages: [json, yaml]
    pattern: '(?:^|["\x27\s=])(?:git\+(?:https?|ssh|git)://[^\s"\x27]{1,300}|(?:github|gitlab|bitbucket):[\w.-]+/[\w.-]+[^\s"\x27]{0,200}|https?://gist\.github(?:usercontent)?\.com/[^\s"\x27]{1,300})(?=["\x27\s,\]]|$)|\b(?:npx|bunx|uvx|pipx\s+run)\s+(?:-\S+\s+){0,3}https?://(?:github\.com|gitlab\.com)/[^\s"\x27]{1,300}'
    notPattern: '[#@][0-9a-f]{40}\b|"(?:homepage|repository|url|bugs|source)"\s*:'
    pathInclude: '{{MCP}}'
    message: The server is installed from a git branch or a gist rather than a versioned release, so whoever controls that ref can change the code that runs on every start.
    message_zh: 服务器从 git 分支或 gist 安装而非版本化发布，控制该引用的人可以修改每次启动时运行的代码。
    remediation: Install a released version from a registry, or pin the git URL to a full commit SHA.
    remediation_zh: 从注册表安装已发布版本，或将 git URL 固定到完整提交 SHA。
  - id: agent-mcp-docker-privileged
    title: MCP server container runs privileged or mounts the host
    title_zh: MCP 服务器容器以特权运行或挂载宿主机
    severity: high
    confidence: medium
    cwe: CWE-250
    owasp: A05:2021
    languages: [json]
    filePattern: '\b(?:docker|podman)\b'
    pattern: '"(?:--privileged|--cap-add[= ](?:ALL|SYS_ADMIN|SYS_PTRACE)|--pid[= ]host|--security-opt[= ](?:seccomp|apparmor)[=:]unconfined)"|"--cap-add"\s*,\s*"(?:ALL|SYS_ADMIN|SYS_PTRACE)"|"(?:(?:-v|--volume)[= ])?(?:/|~/?|\$HOME/?|\$\{HOME\}/?|\$\{env:HOME\}/?|\$\{userHome\}/?|/var/run/docker\.sock|/root/?|/etc/?|/home/?|/Users/?):/[^"]{0,200}"|type=bind,\s*(?:src|source)=(?:/|~/?|\$HOME/?|\$\{HOME\}/?|/var/run/docker\.sock|/root/?|/etc/?|/home/?|/Users/?)(?=[,"])'
    pathInclude: '{{MCP_JSON}}'
    message: The MCP server container gets root-equivalent access to the host (privileged mode, host PID, a dangerous capability, the Docker socket, or the host root or home directory mounted).
    message_zh: MCP 服务器容器获得等同 root 的宿主机访问（特权模式、宿主 PID、危险能力、Docker socket，或挂载宿主根目录/家目录）。
    remediation: Drop --privileged and extra capabilities; mount only the project directory, read-only where possible.
    remediation_zh: 去掉 --privileged 和额外能力；只挂载项目目录，尽量只读。
  - id: agent-mcp-cleartext-http
    title: Remote MCP server over plain HTTP
    title_zh: 远程 MCP 服务器使用明文 HTTP
    severity: medium
    confidence: medium
    cwe: CWE-319
    owasp: A02:2021
    languages: [json, yaml]
    pattern: '["\x27]?(?:url|httpUrl|serverUrl|endpoint|uri)["\x27]?\s*:\s*["\x27]?http://(?!{{LOCALHOST}})[^\s"\x27]{1,300}|"(?:mcp-remote|supergateway|--sse|--url)"\s*,\s*"http://(?!{{LOCALHOST}})[^\s"]{1,300}"'
    pathInclude: '{{MCP}}'
    message: Tool calls, results and any Authorization header travel unencrypted to a non-local MCP server, where they can be read or rewritten in transit.
    message_zh: 工具调用、结果及 Authorization 头以明文发送到非本机 MCP 服务器，可在传输中被读取或篡改。
    remediation: Use https:// for every remote MCP server.
    remediation_zh: 所有远程 MCP 服务器都使用 https://。
  - id: agent-mcp-filesystem-root
    title: Filesystem MCP server rooted at / or the home directory
    title_zh: 文件系统 MCP 服务器以 / 或家目录为根
    severity: high
    confidence: medium
    cwe: CWE-552
    owasp: A01:2021
    languages: [json]
    filePattern: 'server-filesystem|filesystem-server|mcp-filesystem|"filesystem"\s*:'
    pattern: '(?:^\s*|[\[,]\s*)"(?:/|~|~/|\$HOME/?|\$\{HOME\}/?|\$\{env:HOME\}/?|\$\{userHome\}/?|%USERPROFILE%|C:\\\\|C:/|/Users/?|/home/?)"\s*(?=[,\]]|$)'
    pathInclude: '{{MCP_JSON}}'
    message: The filesystem server can read and write the whole disk or home directory, including SSH keys, cloud credentials and shell startup files.
    message_zh: 文件系统服务器可读写整个磁盘或家目录，包括 SSH 密钥、云凭据和 shell 启动文件。
    remediation: Pass only the project directory (or a dedicated workspace) as the allowed root.
    remediation_zh: 只把项目目录（或专用工作区）作为允许的根目录。
  - id: agent-gemini-mcp-trust
    title: Gemini CLI MCP server marked trusted
    title_zh: Gemini CLI MCP 服务器被标记为可信
    severity: medium
    confidence: high
    cwe: CWE-284
    owasp: A01:2021
    languages: [json]
    pathInclude: '(?:^|/)\.gemini/settings\.json$|(?:^|/)gemini-extension\.json$'
    pattern: '"trust"\s*:\s*true'
    message: trust true makes Gemini CLI run every tool of this server without confirmation.
    message_zh: trust true 使 Gemini CLI 无需确认即可运行该服务器的所有工具。
    remediation: Remove trust and approve tools individually (includeTools / tools.allowed).
    remediation_zh: 删除 trust，逐个批准工具（includeTools / tools.allowed）。

  # ---- Hooks ----
  - id: agent-hook-network-exec
    title: Agent hook executes network-fetched code
    title_zh: Agent hook 执行网络获取的代码
    severity: critical
    confidence: high
    cwe: CWE-829
    owasp: A08:2021
    languages:
      - json
    pattern: '(?:curl|wget|fetch|http)[^"\n]{0,600}\|\s*(?:sudo\s+)?(?:ba|z|da)?sh\b|\b(?:ba)?sh\s+<\(\s*(?:curl|wget)\b|\b(?:iwr|irm|Invoke-WebRequest|Invoke-RestMethod)\b[^|\n]{0,300}\|\s*iex\b'
    pathInclude: '{{HOOKS}}'
    message: A hook downloads and executes code from the network, enabling remote code execution on every tool call.
    message_zh: Hook 从网络下载并执行代码，可在每次工具调用时实现远程代码执行。
    remediation: Remove the hook or vendor the script with a pinned checksum.
    remediation_zh: 移除该 hook，或将脚本纳入仓库并固定校验和。
    references:
      - CWE-829
      - OWASP A08:2021
  - id: agent-hook-secret-exfil
    title: Agent hook or MCP command sends local secrets over the network
    title_zh: Agent hook 或 MCP 命令通过网络发送本地机密
    severity: critical
    confidence: medium
    cwe: CWE-200
    owasp: A01:2021
    languages: [json]
    patterns:
      - '\b(?:curl|wget|nc|ncat|socat|Invoke-WebRequest|Invoke-RestMethod|iwr|irm)\b'
      - '(?:~|\$HOME|\$\{HOME\})/\.(?:ssh|aws|gnupg|kube|docker/config|netrc|npmrc|pypirc|git-credentials|config/gh|config/gcloud|azure)\b|\$\(\s*(?:env|printenv|set)\s*\)|`\s*(?:env|printenv)\s*`|\b(?:env|printenv)\s*\|\s*(?:curl|wget|nc|base64|gzip)|(?:^|[\s"\x27@<=])\.env\b|/etc/(?:passwd|shadow)\b|\bsecurity\s+find-(?:generic|internet)-password\b'
    pathInclude: '{{HOOKS}}|{{MCP_JSON}}'
    message: A command that runs automatically reads SSH or cloud credentials, .env files or the whole environment and sends them to a network endpoint.
    message_zh: 自动运行的命令读取 SSH/云凭据、.env 文件或整个环境变量并发送到网络端点。
    remediation: Remove the command and rotate every credential that was reachable on machines that ran it.
    remediation_zh: 删除该命令，并轮换运行过它的机器上可访问的所有凭据。
  - id: agent-hook-persistence
    title: Agent hook or MCP command modifies shell startup or scheduled tasks
    title_zh: Agent hook 或 MCP 命令修改 shell 启动文件或计划任务
    severity: high
    confidence: medium
    cwe: CWE-506
    owasp: A08:2021
    languages: [json]
    pattern: '(?:>>?\s*|\btee\s+(?:-a\s+)?)["\x27]?(?:~|\$HOME|\$\{HOME\})/\.(?:bashrc|zshrc|profile|bash_profile|bash_login|zprofile|zshenv|zlogin|config/fish/config\.fish|ssh/authorized_keys)\b|\bcrontab\s+-(?:\s|"|$)|\|\s*crontab\b|(?:~|\$HOME)/Library/LaunchAgents/|/etc/(?:cron\.d|profile\.d|sudoers)\b'
    pathInclude: '{{HOOKS}}|{{MCP_JSON}}'
    message: A command that runs automatically writes to shell startup files, authorized_keys, cron or launch agents, which gives it persistence beyond the agent session.
    message_zh: 自动运行的命令写入 shell 启动文件、authorized_keys、cron 或 LaunchAgents，使其在 Agent 会话之外持久化。
    remediation: Remove the command; hooks must not change user or system startup configuration.
    remediation_zh: 删除该命令；hook 不应修改用户或系统启动配置。
