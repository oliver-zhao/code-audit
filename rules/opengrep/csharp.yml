# Opengrep/Semgrep-syntax rules written for code-audit (Apache-2.0).
# Not copied from the Semgrep registry. Validated with Opengrep 1.33.1 against
# fixtures/vulnerable/csharp and fixtures/clean/csharp.
rules:
  - id: cs-opengrep-binary-formatter
    languages: [csharp]
    severity: ERROR
    message: BinaryFormatter deserializes untrusted data and can execute arbitrary code.
    metadata:
      cwe: "CWE-502"
      confidence: MEDIUM
    pattern: new BinaryFormatter()

  - id: cs-opengrep-process-start
    languages: [csharp]
    severity: ERROR
    message: Process.Start() launches a process with arguments that may contain untrusted input.
    metadata:
      cwe: "CWE-78"
      confidence: MEDIUM
    # Taint from the first command-line argument into Process.Start, so a call
    # whose ProcessStartInfo has a constant FileName/Arguments is not reported.
    mode: taint
    pattern-sources:
      - pattern: $ARGS[0]
    pattern-sinks:
      - pattern: Process.Start(...)

  - id: cs-opengrep-aspnet-sql
    languages: [csharp]
    severity: ERROR
    message: Data from the HTTP request (query string, form, headers, cookies, a [FromQuery]/[FromForm]/[FromBody]/[FromRoute] parameter or a string parameter of a controller action) reaches the SQL text of a command (SqlCommand, CommandText, EF Core FromSqlRaw/ExecuteSqlRaw, Dapper Query/Execute). Pass it as a parameter instead.
    metadata:
      cwe: "CWE-89"
      confidence: HIGH
    mode: taint
    pattern-sources: &aspnet-sources
      - pattern: Request.Query[...]
      - pattern: Request.Form[...]
      - pattern: Request.Headers[...]
      - pattern: Request.Cookies[...]
      - pattern: HttpContext.Request.Query[...]
      - pattern: HttpContext.Request.Form[...]
      - patterns:
          - pattern-inside: |
              $RET $METHOD(..., [FromQuery] $TYPE $PARAM, ...) { ... }
          - pattern: $PARAM
      - patterns:
          - pattern-inside: |
              $RET $METHOD(..., [FromQuery(...)] $TYPE $PARAM, ...) { ... }
          - pattern: $PARAM
      - patterns:
          - pattern-inside: |
              $RET $METHOD(..., [FromForm] $TYPE $PARAM, ...) { ... }
          - pattern: $PARAM
      - patterns:
          - pattern-inside: |
              $RET $METHOD(..., [FromForm(...)] $TYPE $PARAM, ...) { ... }
          - pattern: $PARAM
      - patterns:
          - pattern-inside: |
              $RET $METHOD(..., [FromBody] $TYPE $PARAM, ...) { ... }
          - pattern: $PARAM
      - patterns:
          - pattern-inside: |
              $RET $METHOD(..., [FromBody(...)] $TYPE $PARAM, ...) { ... }
          - pattern: $PARAM
      - patterns:
          - pattern-inside: |
              $RET $METHOD(..., [FromRoute] $TYPE $PARAM, ...) { ... }
          - pattern: $PARAM
      - patterns:
          - pattern-inside: |
              $RET $METHOD(..., [FromRoute(...)] $TYPE $PARAM, ...) { ... }
          - pattern: $PARAM
      # String parameters of an action without a binding attribute: public
      # methods with an [Http*] attribute in a class deriving from Controller
      # or ControllerBase.
      - patterns:
          - pattern-either:
              - pattern-inside: |
                  class $CTRL : Controller { ... }
              - pattern-inside: |
                  class $CTRL : ControllerBase { ... }
          - pattern-either:
              - pattern-inside: |
                  [$HTTP]
                  public $RET $METHOD(..., string $PARAM, ...) { ... }
              - pattern-inside: |
                  [$HTTP(...)]
                  public $RET $METHOD(..., string $PARAM, ...) { ... }
          - metavariable-regex:
              metavariable: $HTTP
              regex: ^Http(Get|Post|Put|Patch|Delete)$
          - pattern: $PARAM
    pattern-sanitizers: &aspnet-sanitizers
      - pattern: int.Parse(...)
      - pattern: long.Parse(...)
      - pattern: Guid.Parse(...)
    pattern-sinks:
      - patterns:
          - pattern-either:
              - pattern: new SqlCommand($SQL, ...)
              - pattern: new SqliteCommand($SQL, ...)
              - pattern: new NpgsqlCommand($SQL, ...)
              - pattern: new MySqlCommand($SQL, ...)
              - pattern: $CMD.CommandText = $SQL
              - pattern: $DB.FromSqlRaw($SQL, ...)
              - pattern: $DB.ExecuteSqlRaw($SQL, ...)
              - pattern: $DB.ExecuteSqlRawAsync($SQL, ...)
              # Dapper extension methods on a connection (the receiver must be
              # named like one: Execute/Query are common method names).
              - patterns:
                  - pattern-either:
                      - pattern: $CONN.$DAPPER($SQL, ...)
                      - pattern: $CONN.$DAPPER<$T>($SQL, ...)
                  - metavariable-regex:
                      metavariable: $DAPPER
                      regex: ^(Query|Execute)(First|FirstOrDefault|Single|SingleOrDefault|Multiple|Scalar|Reader)?(Async)?$
                  - metavariable-regex:
                      metavariable: $CONN
                      regex: (?i)^(_?\w*conn(ection)?|_?\w*db|_?cn|_?\w*transaction|_?tx)$
          - focus-metavariable: $SQL

  - id: cs-opengrep-aspnet-command
    languages: [csharp]
    severity: ERROR
    message: Data from the HTTP request reaches the program or argument string of a process (Process.Start, ProcessStartInfo). Use a fixed program and ProcessStartInfo.ArgumentList with allowlisted values.
    metadata:
      cwe: "CWE-78"
      confidence: HIGH
    mode: taint
    pattern-sources: *aspnet-sources
    pattern-sanitizers: *aspnet-sanitizers
    pattern-sinks:
      - patterns:
          - pattern-either:
              - pattern: Process.Start($ARG, ...)
              - pattern: Process.Start($EXE, $ARG)
              - pattern: new ProcessStartInfo($ARG, ...)
              - pattern: new ProcessStartInfo($EXE, $ARG)
              - pattern: $PSI.FileName = $ARG
              - pattern: $PSI.Arguments = $ARG
          - focus-metavariable: $ARG

  - id: cs-opengrep-aspnet-path
    languages: [csharp]
    severity: ERROR
    message: Data from the HTTP request reaches a file path (File.*, Path.Combine, FileStream, PhysicalFile); "../" in it reaches files outside the intended directory.
    metadata:
      cwe: "CWE-22"
      confidence: HIGH
    mode: taint
    pattern-sources: *aspnet-sources
    pattern-sanitizers:
      - pattern: Path.GetFileName(...)
      - pattern: int.Parse(...)
      - pattern: Guid.Parse(...)
    pattern-sinks:
      - patterns:
          - pattern-either:
              - pattern: File.$METHOD($PATH, ...)
              - pattern: System.IO.File.$METHOD($PATH, ...)
              - pattern: Path.Combine(..., $PATH, ...)
              - pattern: new FileStream($PATH, ...)
              - pattern: PhysicalFile($PATH, ...)
          - focus-metavariable: $PATH

  - id: cs-opengrep-aspnet-redirect
    languages: [csharp]
    severity: WARNING
    message: Data from the HTTP request is used as a redirect target without Url.IsLocalUrl; the site can send users to any other site (open redirect). Use LocalRedirect or check Url.IsLocalUrl first.
    metadata:
      cwe: "CWE-601"
      confidence: HIGH
    mode: taint
    pattern-sources: *aspnet-sources
    pattern-sinks:
      - patterns:
          - pattern-either:
              - pattern: Redirect($URL)
              - pattern: RedirectPermanent($URL)
              - pattern: Response.Redirect($URL, ...)
          - pattern-not-inside: |
              if (<... Url.IsLocalUrl(...) ...>) { ... }
          - pattern-not-inside: |
              if (<... Url.IsLocalUrl(...) ...>) $STMT;
          # Early return when the URL is not local.
          - pattern-not-inside: |
              if (!Url.IsLocalUrl($U)) { ... }
              ...
          - pattern-not-inside: |
              if (!Url.IsLocalUrl($U)) return $X;
              ...
          # A URL built by a helper method (which may fix the host) is not
          # reported; the request value must be the target or part of it.
          - metavariable-pattern:
              metavariable: $URL
              patterns:
                - pattern-not: $OBJ.$HELPER(...)
                - pattern-not: $HELPER(...)
          - focus-metavariable: $URL
