# code-audit CI workflow for GitHub Actions.
#
# This workflow checks out the repository, installs code-audit, runs a scan
# that fails only on NEW findings relative to a committed baseline, uploads the
# SARIF report to the GitHub code-scanning API, and uploads the Markdown report
# as an artifact.
#
# The baseline workflow:
#   1. Run `code-audit scan .` locally once (the run goes to .audit/<run-id>;
#      keep .audit/ in .gitignore).
#   2. Run `code-audit baseline <run-id>` to write .code-audit-baseline.json.
#   3. Commit .code-audit-baseline.json to the repository.
#   4. CI then fails only when a scan introduces findings that are not in the
#      baseline. Pre-existing findings do not break the build.
#
# To suppress a finding permanently, add an entry to .code-audit-ignore (see
# the README "Suppressing findings" section).
#
# Exit codes: 0 = clean (or only baseline findings), 1 = new findings reached
# the fail-on threshold, 2 = runtime error (bad arguments, invalid ignore file
# or baseline, ...).
#
# Third-party actions are pinned to full commit SHAs (the comment names the
# release). Check for newer releases before you copy this file.

name: code-audit

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  audit:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      security-events: write
    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Set up Node 22
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: "22"

      - name: Install code-audit
        # code-audit is not published to npm yet: build it from a pinned
        # checkout. Replace <pin-to-commit-sha> with the commit of the release
        # you want (for example the commit of tag v0.3.0).
        run: |
          git clone https://github.com/oliver-zhao/code-audit.git "$RUNNER_TEMP/code-audit"
          cd "$RUNNER_TEMP/code-audit"
          git checkout <pin-to-commit-sha>
          corepack enable
          pnpm install --frozen-lockfile
          pnpm build
          echo "$PWD/bin" >> "$GITHUB_PATH"

      - name: Run code-audit
        run: code-audit scan . --ci --format sarif,md --out audit-out --latest-link

      - name: Upload SARIF to code scanning
        if: always()
        uses: github/codeql-action/upload-sarif@915412ff23e8b7659517e607487dbeae018f2934 # v4.39.5
        with:
          sarif_file: audit-out/latest/results.sarif

      - name: Upload Markdown report
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: code-audit-report
          path: audit-out/latest/report.md
