services:
  monitor:
    image: example/monitor:1.4.2
    network_mode: host
    pid: host
    cap_add:
      - SYS_ADMIN
      - NET_ADMIN
    cap_drop:
      - ALL
    security_opt:
      - seccomp:unconfined
      - apparmor=unconfined
    volumes:
      - /:/host:ro
      - /etc/localtime:/etc/localtime:ro
  db:
    image: postgres:16.4
    ports:
      - "5432:5432"
    expose:
      - "6379"
    environment:
      POSTGRES_PASSWORD: Sup3rS3cretDbPass
      POSTGRES_PASSWORD_FILE: /run/secrets/db
      MYSQL_RANDOM_ROOT_PASSWORD: "yes"
  cache:
    image: redis:7.4
    ports:
      - "127.0.0.1:6379:6379"
    environment:
      - API_TOKEN=tok_fake_0123456789abcdef
      - DB_PASSWORD=${DB_PASSWORD}
