apiVersion: v1
kind: Pod
metadata:
  name: insecure
spec:
  hostNetwork: true
  hostPID: true
  containers:
    - name: app
      image: nginx:latest
      securityContext:
        privileged: true
        allowPrivilegeEscalation: true
        runAsNonRoot: false
      env:
        - name: DB_PASSWORD
          value: "SuperSecret123"
      volumeMounts:
        - name: docker
          mountPath: /var/run/docker.sock
  volumes:
    - name: docker
      hostPath:
        path: /var/run/docker.sock
    - name: root
      hostPath:
        path: /
