name: preview
on:
  workflow_run:
    workflows: [ci]
    types: [completed]
permissions:
  contents: read
  pull-requests: write
jobs:
  comment:
    if: github.event.workflow_run.conclusion == 'success'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.workflow_run.head_branch == 'main' && 'main' || github.sha }}
          persist-credentials: false
      - uses: some-org/comment-action@8f4b7f84864484a7bf31766abe9204da3cbe65b3 # v2.1.0
        with:
          body: ${{ github.event.workflow_run.display_title }}
      - env:
          TITLE: ${{ github.event.workflow_run.display_title }}
        run: |
          printf '%s\n' "$TITLE" > title.txt
          echo "LABELLED=true" >> "$GITHUB_ENV"
  call:
    uses: ./.github/workflows/reusable.yml
    secrets:
      deploy-token: ${{ secrets.DEPLOY_TOKEN }}
