services:
  web:
    image: example/web:1.4.2
    network_mode: bridge
    read_only: true
    cap_drop:
      - ALL
    cap_add:
      - NET_BIND_SERVICE
    security_opt:
      - no-new-privileges:true
    volumes:
      - /etc/localtime:/etc/localtime:ro
      - ./config:/app/config:ro
    ports:
      - "8443:8443"
  db:
    image: postgres:16.4
    ports:
      - "127.0.0.1:5432:5432"
    expose:
      - "6379"
    environment:
      POSTGRES_PASSWORD_FILE: /run/secrets/db_password
      MYSQL_RANDOM_ROOT_PASSWORD: "yes"
      REDIS_PASSWORD: ${REDIS_PASSWORD}
    secrets:
      - db_password
  # privileged: true   (documented as not needed)
secrets:
  db_password:
    file: ./db_password.txt
