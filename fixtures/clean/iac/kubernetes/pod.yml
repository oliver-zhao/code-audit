apiVersion: v1
kind: Pod
metadata:
  name: secure
spec:
  automountServiceAccountToken: false
  containers:
    - name: app
      image: nginx:1.27.0
      securityContext:
        privileged: false
        allowPrivilegeEscalation: false
        runAsNonRoot: true
        runAsUser: 10001
        capabilities:
          drop: ["ALL"]
      resources:
        limits:
          memory: 128Mi
      readinessProbe:
        httpGet:
          path: /
          port: 8080
      env:
        - name: DB_PASSWORD
          valueFrom:
            secretKeyRef:
              name: db
              key: password
        - name: LOG_LEVEL
          value: "production-cluster"
      volumeMounts:
        - name: data
          mountPath: /data
    - name: sidecar
      image: registry.example.com:5000/app:1.2.3
  volumes:
    - name: data
      emptyDir: {}