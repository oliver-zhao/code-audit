name: Bug report
description: The tool crashed, printed something wrong, or did not do what the documentation says.
labels: ["bug"]
body:
  - type: markdown
    attributes:
      value: |
        Security problems of code-audit itself: please do not file them here, see SECURITY.md.
        A rule that reports safe code or misses vulnerable code has its own template.
  - type: textarea
    id: what
    attributes:
      label: What happened, and what did you expect?
    validations:
      required: true
  - type: textarea
    id: command
    attributes:
      label: Command and output
      description: The exact command line, the exit code and the output (terminal text, the part of report.md, or the MCP tool call and its result). Remove anything confidential.
      render: text
    validations:
      required: true
  - type: textarea
    id: sample
    attributes:
      label: Minimal sample
      description: The smallest set of files (names and content) that reproduces the problem in an empty directory. A few lines are best. Never paste real credentials.
      render: text
    validations:
      required: true
  - type: textarea
    id: doctor
    attributes:
      label: Output of `code-audit doctor`
      description: It shows the version, Node.js, the rule counts and which external scanners are installed. Paths may be shortened.
      render: text
    validations:
      required: true
  - type: input
    id: platform
    attributes:
      label: Operating system and how code-audit was installed
      placeholder: "macOS 15 arm64, git checkout at <commit>"
    validations:
      required: true
